<text x="360" y="1176.1" font-size="17" font-weight="400" fill="#2A2520"><tspan x="360"><tspan font-weight="600">Annonsetekst</tspan></tspan></text><text x="360" y="1202.0" font-size="15" font-weight="400" fill="#5B5247"><tspan x="360">Ta med stillingstittel og arbeidsgiver, så kan teksten nevne dem.</tspan></text>
