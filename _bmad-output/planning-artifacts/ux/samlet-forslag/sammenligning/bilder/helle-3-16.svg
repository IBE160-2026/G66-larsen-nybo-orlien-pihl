<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="390" height="2925" viewBox="0 0 390 2925" role="img" aria-labelledby="tittel beskrivelse" xml:lang="nb">
<title id="tittel">Supersøker – Gap-analyse på mobil</title>
<desc id="beskrivelse">Gap-analysen på 390 px: steglisten viser bare aktivt steg (Steg 2 av 3, Gap-analyse) med fremdriftsstripe, kortene er stablet, svarfeltet under det manglende kravet har fokus, og handlingslinjen nederst har Lag tekst og Endre CV eller annonse.</desc>
<style>.t{font-family:'Segoe UI Variable Text','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Roboto,Arial,sans-serif}.d{font-family:'Segoe UI Variable Display','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Roboto,Arial,sans-serif}</style>
<defs><filter id="lift" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#24102F" flood-opacity="0.13"/></filter><filter id="sticker" x="-10%" y="-20%" width="120%" height="150%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#24102F" flood-opacity="0.22"/></filter><filter id="barShadow" x="-5%" y="-60%" width="110%" height="200%"><feDropShadow dx="0" dy="-4" stdDeviation="8" flood-color="#24102F" flood-opacity="0.14"/></filter></defs>
<rect width="390" height="2925" fill="#FFF3E2"/>
<rect x="0" y="0" width="390" height="64" rx="0" fill="#4B1D63"/><g transform="translate(18 13) scale(0.9)"><rect x="0" y="2" width="34" height="34" rx="10" fill="#C9F46A" transform="rotate(-8 17 19)"/><g transform="translate(5 7) scale(1.0000)" fill="none" stroke="#24102F" color="#24102F" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></g><text class="d" x="46" y="29" font-size="26" font-weight="900" fill="#FFF3E2">Supersøker</text></g><g><rect x="266" y="10" width="108" height="44" rx="22" fill="none" stroke="#FFF3E2" stroke-width="2.5"/><g transform="translate(280.005 23.5) scale(0.7083)" fill="none" stroke="#FFF3E2" color="#FFF3E2" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h3.5"/><path d="M15.5 8l4 4-4 4"/><path d="M19.5 12H10"/></g><text class="t" x="305.0" y="37.1" font-size="15" font-weight="700" fill="#FFF3E2">Logg ut</text></g><rect x="0" y="64" width="390" height="60" rx="0" fill="#C9F46A"/><g transform="translate(18 83) scale(0.9167)" fill="none" stroke="#24102F" color="#24102F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v5.8c0 4.6-3.4 8.2-8 9.2-4.6-1-8-4.6-8-9.2V6z"/><path d="M8.3 12.2l2.6 2.6 4.8-5"/></g><text class="t" font-size="14" font-weight="600" fill="#24102F"><tspan x="50" y="88.2">Mock-modus er på – ingen tekst sendes til en</tspan><tspan x="50" y="108.2">språkmodell.</tspan></text><text class="t" font-size="14" font-weight="700" fill="#5C4868"><tspan x="20" y="162.2">Steg 2 av 3</tspan></text><text class="d" font-size="20" font-weight="800" fill="#24102F"><tspan x="20" y="188.5">Gap-analyse</tspan></text><rect x="20" y="206" width="112.66666666666667" height="10" rx="5" fill="#4B1D63"/><rect x="138.66666666666669" y="206" width="112.66666666666667" height="10" rx="5" fill="#4B1D63"/><circle cx="242.33333333333337" cy="211" r="9" fill="#C9F46A" stroke="#4B1D63" stroke-width="3"/><rect x="257.33333333333337" y="206" width="112.66666666666667" height="10" rx="5" fill="#FFF3E2" stroke="#8A7894" stroke-width="1.5" stroke-dasharray="4 3"/><text class="d" font-size="32" font-weight="900" fill="#24102F"><tspan x="20" y="277.1">Sommervikar i</tspan><tspan x="20" y="312.1">hjemmetjenesten –</tspan><tspan x="20" y="347.1">Testvik kommune</tspan></text><text class="t" font-size="20" font-weight="700" fill="#24102F"><tspan x="20" y="388.5">3 av 4 kompetansekrav er</tspan><tspan x="20" y="415.5">dokumentert i CV-en.</tspan></text><text class="t" font-size="16" font-weight="400" fill="#24102F"><tspan x="20" y="449.8">At noe ikke står i CV-en, betyr ikke at du</tspan><tspan x="20" y="473.8">mangler det. Svarene brukes bare i denne</tspan><tspan x="20" y="497.8">søknaden.</tspan></text><text class="d" font-size="24" font-weight="900" fill="#24102F"><tspan x="20" y="558.2">Står ikke i CV-en</tspan></text><rect x="20" y="579" width="350" height="597" rx="28" fill="#FFFDF9" filter="url(#lift)"/><rect x="20" y="579" width="350" height="597" rx="28" fill="#FFFDF9" stroke="#E8D8C4" stroke-width="1.5"/><path d="M20 643 V607 a28 28 0 0 1 28 -28 H342 a28 28 0 0 1 28 28 V643 z" fill="#FFC247"/><rect x="36" y="593" width="246" height="36" rx="18" fill="#FFFDF9" stroke="#24102F" stroke-width="2"/><g transform="translate(48 600) scale(0.9167)" fill="none" stroke="#4B1D63" color="#4B1D63" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5" stroke-dasharray="3.2 2.6"/><path d="M9.4 9.6a2.6 2.6 0 1 1 3.7 2.4c-.8.4-1.1.9-1.1 1.7v.6"/><circle cx="12" cy="17.2" r="1.1" fill="currentColor" stroke="none"/></g><text class="t" x="78" y="616.6" font-size="16" font-weight="700" fill="#24102F">Mangler dokumentasjon</text><text class="d" font-size="24" font-weight="800" fill="#24102F"><tspan x="42" y="684.7">Førerkort klasse B</tspan></text><text class="t" font-size="17" font-weight="400" fill="#24102F"><tspan x="42" y="719.6">Står ikke i CV-en din. Det betyr ikke at</tspan><tspan x="42" y="744.6">du mangler det.</tspan></text><text class="t" font-size="15" font-weight="700" fill="#5C4868"><tspan x="42" y="779.5">Fra annonsen:</tspan></text><text class="t" font-size="15" font-weight="400" fill="#5C4868"><tspan x="42" y="803.5">«har førerkort klasse B (krav, du kjører</tspan><tspan x="42" y="825.5">kommunens biler mellom brukerne)»</tspan></text><rect x="30" y="846" width="330" height="320" rx="22" fill="#FFF0CC" stroke="#FFC247" stroke-width="2"/><g transform="translate(46 868) scale(0.9167)" fill="none" stroke="#4B1D63" color="#4B1D63" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l1.2-4.6L15.6 5l3.4 3.4L8.6 18.8z"/><path d="M13.6 7l3.4 3.4"/></g><text class="d" font-size="20" font-weight="800" fill="#24102F"><tspan x="78" y="886.5">Fortell oss kort</tspan></text><text class="t" font-size="15" font-weight="400" fill="#5C4868"><tspan x="46" y="912.5">Valgfritt. Har du erfaring med dette? Skriv</tspan><tspan x="46" y="934.5">bare det som stemmer – vi bruker ordene</tspan><tspan x="46" y="956.5">dine slik de står.</tspan></text><text class="t" font-size="16" font-weight="700" fill="#24102F"><tspan x="46" y="991.3">Ditt svar om førerkort klasse B</tspan></text><rect x="46" y="1006" width="298" height="110" rx="16" fill="#FFFDF9" stroke="#24102F" stroke-width="2"/><rect x="41" y="1001" width="308" height="120" rx="21" fill="none" stroke="#24102F" stroke-width="3"/><text class="t" font-size="17" font-weight="400" fill="#24102F"><tspan x="64" y="1038.1">Jeg har ikke førerkort ennå. Jeg</tspan><tspan x="64" y="1064.1">har oppkjøring i april.</tspan></text><rect x="224.7" y="1049" width="2" height="20" fill="#24102F"/><text class="t" font-size="15" font-weight="400" fill="#5C4868" text-anchor="end"><tspan x="344" y="1139.5">56 / 1 000 tegn</tspan></text><text class="d" font-size="24" font-weight="900" fill="#24102F"><tspan x="20" y="1233.2">Dokumentert i CV-en</tspan></text><rect x="20" y="1254" width="350" height="260" rx="28" fill="#FFFDF9" filter="url(#lift)"/><rect x="20" y="1254" width="350" height="260" rx="28" fill="#FFFDF9" stroke="#E8D8C4" stroke-width="1.5"/><path d="M20 1318 V1282 a28 28 0 0 1 28 -28 H342 a28 28 0 0 1 28 28 V1318 z" fill="#E3F8C4"/><rect x="36" y="1268" width="161" height="36" rx="18" fill="#FFFDF9" stroke="#24102F" stroke-width="2"/><g transform="translate(48 1275) scale(0.9167)" fill="none" stroke="#4B1D63" color="#4B1D63" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5"/><path d="M7.8 12.4l3 3 5.6-6"/></g><text class="t" x="78" y="1291.6" font-size="16" font-weight="700" fill="#24102F">Dokumentert</text><text class="d" font-size="21" font-weight="800" fill="#24102F"><tspan x="42" y="1357.3">Gode norskkunnskaper,</tspan><tspan x="42" y="1383.3">muntlig og skriftlig</tspan></text><g transform="rotate(-1.6 192 1446)"><rect x="42" y="1404" width="300" height="84" rx="16" fill="#C9F46A" filter="url(#sticker)"/><g transform="translate(60 1419) scale(0.7500)" fill="none" stroke="#24102F" color="#24102F" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h8.5L19 7.5V21H6z"/><path d="M14 3v5h5"/><path d="M9 13h7M9 16.5h5"/></g><text class="t" x="84" y="1433" font-size="14" font-weight="700" fill="#24102F">Fra CV-en din</text><text class="t" font-size="18" font-weight="700" fill="#24102F"><tspan x="62" y="1463.4">«Norsk – morsmål»</tspan></text></g><rect x="20" y="1530" width="350" height="284" rx="28" fill="#FFFDF9" filter="url(#lift)"/><rect x="20" y="1530" width="350" height="284" rx="28" fill="#FFFDF9" stroke="#E8D8C4" stroke-width="1.5"/><path d="M20 1594 V1558 a28 28 0 0 1 28 -28 H342 a28 28 0 0 1 28 28 V1594 z" fill="#E3F8C4"/><rect x="36" y="1544" width="161" height="36" rx="18" fill="#FFFDF9" stroke="#24102F" stroke-width="2"/><g transform="translate(48 1551) scale(0.9167)" fill="none" stroke="#4B1D63" color="#4B1D63" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5"/><path d="M7.8 12.4l3 3 5.6-6"/></g><text class="t" x="78" y="1567.6" font-size="16" font-weight="700" fill="#24102F">Dokumentert</text><text class="d" font-size="21" font-weight="800" fill="#24102F"><tspan x="42" y="1633.3">Erfaring med eller interesse</tspan><tspan x="42" y="1659.3">for å jobbe med mennesker</tspan></text><g transform="rotate(1.2 192 1734)"><rect x="42" y="1680" width="300" height="108" rx="16" fill="#C9F46A" filter="url(#sticker)"/><g transform="translate(60 1695) scale(0.7500)" fill="none" stroke="#24102F" color="#24102F" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h8.5L19 7.5V21H6z"/><path d="M14 3v5h5"/><path d="M9 13h7M9 16.5h5"/></g><text class="t" x="84" y="1709" font-size="14" font-weight="700" fill="#24102F">Fra CV-en din</text><text class="t" font-size="18" font-weight="700" fill="#24102F"><tspan x="62" y="1739.4">«Besøksvenn, Røde Kors</tspan><tspan x="62" y="1763.4">besøkstjeneste»</tspan></text></g><rect x="20" y="1830" width="350" height="258" rx="28" fill="#FFFDF9" filter="url(#lift)"/><rect x="20" y="1830" width="350" height="258" rx="28" fill="#FFFDF9" stroke="#E8D8C4" stroke-width="1.5"/><path d="M20 1894 V1858 a28 28 0 0 1 28 -28 H342 a28 28 0 0 1 28 28 V1894 z" fill="#E3F8C4"/><rect x="36" y="1844" width="161" height="36" rx="18" fill="#FFFDF9" stroke="#24102F" stroke-width="2"/><g transform="translate(48 1851) scale(0.9167)" fill="none" stroke="#4B1D63" color="#4B1D63" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5"/><path d="M7.8 12.4l3 3 5.6-6"/></g><text class="t" x="78" y="1867.6" font-size="16" font-weight="700" fill="#24102F">Dokumentert</text><text class="d" font-size="21" font-weight="800" fill="#24102F"><tspan x="42" y="1933.3">Gode samarbeidsevner</tspan></text><g transform="rotate(-1 192 2008)"><rect x="42" y="1954" width="300" height="108" rx="16" fill="#C9F46A" filter="url(#sticker)"/><g transform="translate(60 1969) scale(0.7500)" fill="none" stroke="#24102F" color="#24102F" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h8.5L19 7.5V21H6z"/><path d="M14 3v5h5"/><path d="M9 13h7M9 16.5h5"/></g><text class="t" x="84" y="1983" font-size="14" font-weight="700" fill="#24102F">Fra CV-en din</text><text class="t" font-size="18" font-weight="700" fill="#24102F"><tspan x="62" y="2013.4">«Gruppeprosjekt i</tspan><tspan x="62" y="2037.4">helsefremmende arbeid»</tspan></text></g><text class="d" font-size="24" font-weight="900" fill="#24102F"><tspan x="20" y="2145.2">Ansettelsesvilkår</tspan></text><rect x="20" y="2166" width="350" height="194" rx="28" fill="#FFF3E2" stroke="#8A7894" stroke-width="2" stroke-dasharray="8 6"/><circle cx="62" cy="2208" r="20" fill="#F6E6CF"/><g transform="translate(50 2196) scale(1.0000)" fill="none" stroke="#4B1D63" color="#4B1D63" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6v18h6"/><path d="M14 3l5 5v4"/><circle cx="17" cy="16.5" r="3.6"/><path d="M15.6 19.8l-.8 2.6M18.4 19.8l.8 2.6"/></g><text class="d" font-size="21" font-weight="800" fill="#24102F"><tspan x="92" y="2213.3">Politiattest</tspan></text><text class="t" font-size="17" font-weight="400" fill="#24102F"><tspan x="42" y="2255.6">Kan ikke dokumenteres i en CV, og er</tspan><tspan x="42" y="2280.6">ikke med i opptellingen av</tspan><tspan x="42" y="2305.6">kompetansekrav. Du trenger ikke laste</tspan><tspan x="42" y="2330.6">opp noe.</tspan></text><text class="d" font-size="24" font-weight="900" fill="#24102F"><tspan x="20" y="2417.2">Hva slags tekst vil du ha?</tspan></text><text class="t" font-size="16" font-weight="400" fill="#5C4868"><tspan x="20" y="2446.3">Velg én. Du kan bytte senere uten ny analyse.</tspan></text><rect x="20" y="2469" width="350" height="130" rx="24" fill="#FFFDF9" filter="url(#lift)"/><rect x="20" y="2469" width="350" height="130" rx="24" fill="#FFFDF9" stroke="#4B1D63" stroke-width="3"/><circle cx="58" cy="2508" r="13" fill="#FFFDF9" stroke="#4B1D63" stroke-width="2.5"/><circle cx="58" cy="2508" r="7" fill="#4B1D63"/><text class="d" font-size="19" font-weight="800" fill="#24102F"><tspan x="88" y="2514.2">Helt søknadsutkast</tspan></text><text class="t" font-size="17" font-weight="400" fill="#24102F"><tspan x="88" y="2542.6">Et sammenhengende brev du</tspan><tspan x="88" y="2567.6">redigerer selv.</tspan></text><rect x="291.77" y="2491" width="54.23" height="28" rx="14" fill="#C9F46A"/><text class="t" x="318.885" y="2510" font-size="14" font-weight="700" fill="#24102F" text-anchor="middle">Valgt</text><rect x="20" y="2613" width="350" height="130" rx="24" fill="#FFFDF9" stroke="#8A7894" stroke-width="2"/><circle cx="58" cy="2652" r="13" fill="#FFFDF9" stroke="#24102F" stroke-width="2.5"/><text class="d" font-size="19" font-weight="800" fill="#24102F"><tspan x="88" y="2658.2">Forslag til formuleringer</tspan></text><text class="t" font-size="17" font-weight="400" fill="#24102F"><tspan x="88" y="2686.6">Setninger du kan bruke i ditt eget</tspan><tspan x="88" y="2711.6">brev.</tspan></text><rect x="0" y="2779" width="390" height="146" fill="#FFFDF9" filter="url(#barShadow)"/><rect x="0" y="2779" width="390" height="146" fill="#FFFDF9"/><rect x="0" y="2779" width="390" height="2" fill="#E8D8C4"/><g><rect x="20" y="2799" width="350" height="58" rx="29" fill="#4B1D63" filter="url(#lift)"/><rect x="20" y="2799" width="350" height="58" rx="29" fill="#4B1D63"/><text class="t" x="141.5" y="2834.1" font-size="18" font-weight="700" fill="#FFFDF9">Lag tekst</text><g transform="translate(230.51 2818) scale(0.8333)" fill="none" stroke="#FFFDF9" color="#FFFDF9" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12h14.5"/><path d="M13 6l6 6-6 6"/></g></g><g><rect x="20" y="2865" width="350" height="44" rx="22" fill="none"/><text class="t" x="105.2" y="2892.4" font-size="16" font-weight="700" fill="#4B1D63">Endre CV eller annonse</text><rect x="105.2" y="2896.4" width="180" height="2" fill="#4B1D63"/></g>
</svg>
