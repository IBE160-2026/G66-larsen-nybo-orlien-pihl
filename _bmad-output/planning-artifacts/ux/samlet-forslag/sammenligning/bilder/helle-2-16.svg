<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="390" height="2250" viewBox="0 0 390 2250" role="img" aria-labelledby="t d" lang="nb">
<title id="t">Supersøker på mobil: gap-analysen</title>
<desc id="d">Gap-analysen på 390 piksler. Øverst modusstripen, Logg ut og bare det aktive steget, Steg 2 av 3. Fanene Krav, CV-tekst og Annonse erstatter kolonnene. Kravet som mangler dokumentasjon står først med utfylt svar, deretter dokumenterte krav med sitat, der K3 er åpnet og viser utdraget fra CV-teksten. Til slutt ansettelsesvilkår, omskrivingsvalg, Lag tekst og Endre CV eller annonse.</desc>
<style>text{font-family:'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;font-variant-numeric:tabular-nums}.m{font-family:Consolas,'Cascadia Mono','SF Mono',Menlo,'DejaVu Sans Mono',monospace}</style>
<rect width="390" height="2250" fill="#EDF0F4"/>
<rect x="0" y="0" width="390" height="62" fill="#19212F"/><rect x="16" y="9" width="100" height="20" rx="3" fill="none" stroke="#FFFFFF" stroke-width="1.2"/><text x="66" y="23" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.6">MOCK-MODUS</text><text font-size="12.5" fill="#FFFFFF"><tspan x="16" y="45.3">Ingen tekst sendes til en språkmodell.</tspan></text><rect x="0" y="62" width="390" height="56" fill="#FFFFFF"/><line x1="0" y1="117.5" x2="390" y2="117.5" stroke="#CDD3DC" stroke-width="1"/><g transform="translate(16 75) scale(1)" aria-hidden="true"><rect width="30" height="30" rx="6" fill="#1C3D8F"/><path d="M9 6.5h9l4.5 4.5v12.5H9z" fill="#FFFFFF"/><rect x="10.5" y="13" width="10.5" height="3.4" rx="0.8" fill="#FFE36E"/><path d="M11 19.5h8" stroke="#1C3D8F" stroke-width="1.4" stroke-linecap="round"/><path d="M11 10h4.5" stroke="#1C3D8F" stroke-width="1.4" stroke-linecap="round"/></g><text x="56" y="96.5" font-size="19" font-weight="700" fill="#121926">Supersøker</text><rect x="265" y="72" width="109" height="36" rx="6" fill="#FFFFFF" stroke="#1C3D8F" stroke-width="1.5"/><g transform="translate(281.5 82) scale(1)" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 2.5H3.5a1 1 0 0 0-1 1v9a1 1 0 0 0 1 1h3" stroke="#1C3D8F"/><path d="M10 4.8L13.2 8 10 11.2M13 8H6.2" stroke="#1C3D8F"/></g><text x="305.5" y="94.8" font-size="14" font-weight="600" fill="#1C3D8F">Logg ut</text><rect x="0" y="118" width="390" height="40" fill="#FFFFFF"/><line x1="0" y1="157.5" x2="390" y2="157.5" stroke="#CDD3DC" stroke-width="1"/><rect x="16" y="127" width="22" height="22" rx="4" fill="#1C3D8F"/><text x="27" y="142.5" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text font-size="14" fill="#121926"><tspan fill="#4B5565" x="46" y="142.8">Steg 2 av 3:</tspan><tspan font-weight="700"> Gap-analyse</tspan></text><text font-size="22" fill="#121926"><tspan font-weight="600" x="16" y="200">Gap-analyse: Sommervikar i</tspan><tspan font-weight="600" x="16" y="229">hjemmetjenesten, Testvik</tspan><tspan font-weight="600" x="16" y="258">kommune</tspan></text><text font-size="15" fill="#121926"><tspan font-weight="700" x="16" y="287.1">3 av 4</tspan><tspan > kompetansekrav er dokumentert i CV-en.</tspan><tspan x="16" y="309.1">Kravet som mangler dokumentasjon, står først.</tspan></text><rect x="16" y="331" width="358" height="46" rx="6" fill="#FFFFFF" stroke="#CDD3DC"/><text x="75.7" y="358.9" font-size="14.5" font-weight="700" fill="#1C3D8F" text-anchor="middle">Krav</text><rect x="26" y="373" width="99.3" height="3" fill="#1C3D8F"/><text x="195" y="358.9" font-size="14.5" font-weight="600" fill="#4B5565" text-anchor="middle">CV-tekst</text><line x1="135.3" y1="343" x2="135.3" y2="365" stroke="#CDD3DC" stroke-width="1"/><text x="314.3" y="358.9" font-size="14.5" font-weight="600" fill="#4B5565" text-anchor="middle">Annonse</text><line x1="254.7" y1="343" x2="254.7" y2="365" stroke="#CDD3DC" stroke-width="1"/><text font-size="12.5" fill="#4B5565"><tspan x="16" y="396.3">CV-teksten og annonsen ligger i egne faner. «Vis i CV-en»</tspan><tspan x="16" y="414.3">åpner sitatet her.</tspan></text><g transform="translate(16 442) scale(1)" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="1.2" y="1.2" width="13.6" height="13.6" rx="2.5" stroke="#8A4A0B" stroke-dasharray="2.6 2" stroke-width="1.6"/><path d="M5.5 8h5" stroke="#8A4A0B" stroke-width="1.8"/></g><text x="40" y="454" font-size="15" font-weight="600" fill="#121926">Mangler dokumentasjon i CV-en</text><text x="374" y="454" font-size="13" font-weight="600" fill="#4B5565" text-anchor="end">1 krav</text><rect x="16" y="473" width="358" height="289" rx="6" fill="#FFFFFF" stroke="#CDD3DC"/><rect x="30" y="489" width="28" height="18" rx="3" fill="#FFFFFF" stroke="#1C3D8F" stroke-width="1.2"/><text x="44" y="502" font-size="11" font-weight="700" fill="#1C3D8F" text-anchor="middle">K1</text><text font-size="15" fill="#121926"><tspan font-weight="600" x="70" y="503.1">Førerkort klasse B</tspan></text><rect x="70" y="515" width="187.4" height="24" rx="4" fill="#FBEEDB"/><g transform="translate(77 519) scale(1)" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="1.2" y="1.2" width="13.6" height="13.6" rx="2.5" stroke="#8A4A0B" stroke-dasharray="2.6 2" stroke-width="1.6"/><path d="M5.5 8h5" stroke="#8A4A0B" stroke-width="1.8"/></g><text x="98" y="531.4" font-size="13" font-weight="600" fill="#8A4A0B">Mangler dokumentasjon</text><text font-size="14" fill="#4B5565"><tspan x="30" y="564.3">Står ikke i CV-teksten. Det betyr ikke at du</tspan><tspan x="30" y="585.3">mangler det, bare at CV-en ikke viser det.</tspan></text><text font-size="14" fill="#121926"><tspan font-weight="600" x="30" y="619.8">Vil du si noe om førerkort klasse B?</tspan><tspan fill="#4B5565"> (valgfritt)</tspan></text><text font-size="13" fill="#4B5565"><tspan x="30" y="640.9">Svaret gjelder bare denne søknaden.</tspan></text><rect x="30" y="654" width="330" height="68" rx="5" fill="#FFFFFF" stroke="#737D8C"/><text font-size="15" fill="#121926"><tspan x="42" y="680.1">Jeg har ikke førerkort ennå. Jeg har</tspan><tspan x="42" y="702.1">oppkjøring i april.</tspan></text><text x="360" y="741" font-size="12.5" fill="#4B5565" text-anchor="end">56 / 1 000 tegn</text><g transform="translate(16 787) scale(1)" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="0.8" y="0.8" width="14.4" height="14.4" rx="2.5" fill="#1B6B43" stroke="none"/><path d="M4.2 8.3l2.5 2.5 5-5.6" stroke="#FFFFFF" stroke-width="1.9"/></g><text x="40" y="799" font-size="15" font-weight="600" fill="#121926">Dokumentert i CV-en</text><text x="374" y="799" font-size="13" font-weight="600" fill="#4B5565" text-anchor="end">3 krav</text><rect x="16" y="818" width="358" height="720" rx="6" fill="#FFFFFF" stroke="#CDD3DC"/><rect x="30" y="834" width="28" height="18" rx="3" fill="#FFFFFF" stroke="#1C3D8F" stroke-width="1.2"/><text x="44" y="847" font-size="11" font-weight="700" fill="#1C3D8F" text-anchor="middle">K2</text><text font-size="15" fill="#121926"><tspan font-weight="600" x="70" y="848.1">Gode norskkunnskaper, muntlig og</tspan><tspan font-weight="600" x="70" y="870.1">skriftlig</tspan></text><rect x="70" y="882" width="117.3" height="24" rx="4" fill="#E4F2EA"/><g transform="translate(77 886) scale(1)" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="0.8" y="0.8" width="14.4" height="14.4" rx="2.5" fill="#1B6B43" stroke="none"/><path d="M4.2 8.3l2.5 2.5 5-5.6" stroke="#FFFFFF" stroke-width="1.9"/></g><text x="98" y="898.4" font-size="13" font-weight="600" fill="#1B6B43">Dokumentert</text><rect x="67" y="916" width="119.4" height="22" rx="2" fill="#FFE36E"/><line x1="67" y1="938" x2="186.4" y2="938" stroke="#8F7200" stroke-width="1.5"/><text x="70" y="931.5" font-size="11.5" fill="#121926" class="m" textLength="113.4" lengthAdjust="spacing">«Norsk – morsmål»</text><text x="70" y="959" font-size="13" fill="#4B5565">CV-tekst, linje 25</text><rect x="70" y="970" width="290" height="40" rx="6" fill="#FFFFFF" stroke="#1C3D8F" stroke-width="1.5"/><g transform="translate(166.5 982) scale(1)" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6l4 4 4-4" stroke="#1C3D8F"/></g><text x="190.5" y="994.8" font-size="14" font-weight="600" fill="#1C3D8F">Vis i CV-en</text><line x1="30" y1="1022" x2="360" y2="1022" stroke="#CDD3DC" stroke-width="1"/><rect x="17" y="1022.5" width="356" height="333" fill="#F1F5FC"/><rect x="30" y="1038" width="28" height="18" rx="3" fill="#1C3D8F" stroke="#1C3D8F" stroke-width="1.2"/><text x="44" y="1051" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">K3</text><text font-size="15" fill="#121926"><tspan font-weight="600" x="70" y="1052.1">Erfaring med eller interesse for å jobbe</tspan><tspan font-weight="600" x="70" y="1074.1">med mennesker</tspan></text><rect x="70" y="1086" width="117.3" height="24" rx="4" fill="#E4F2EA"/><g transform="translate(77 1090) scale(1)" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="0.8" y="0.8" width="14.4" height="14.4" rx="2.5" fill="#1B6B43" stroke="none"/><path d="M4.2 8.3l2.5 2.5 5-5.6" stroke="#FFFFFF" stroke-width="1.9"/></g><text x="98" y="1102.4" font-size="13" font-weight="600" fill="#1B6B43">Dokumentert</text><rect x="67" y="1120" width="259.5" height="22" rx="2" fill="#FFE36E"/><line x1="67" y1="1142" x2="326.5" y2="1142" stroke="#8F7200" stroke-width="1.5"/><text x="70" y="1135.5" font-size="11.5" fill="#121926" class="m" textLength="253.5" lengthAdjust="spacing">«Besøksvenn, Røde Kors besøkstjeneste»</text><text x="70" y="1163" font-size="13" fill="#4B5565">CV-tekst, linje 17</text><rect x="70" y="1174" width="290" height="40" rx="6" fill="#FFFFFF" stroke="#1C3D8F" stroke-width="1.5"/><g transform="translate(128.4 1186) scale(1)" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10l4-4 4 4" stroke="#1C3D8F"/></g><text x="152.4" y="1198.8" font-size="14" font-weight="600" fill="#1C3D8F">Skjul utdrag fra CV-en</text><rect x="67" y="1171" width="296" height="46" rx="9" fill="none" stroke="#1C3D8F" stroke-width="2.5"/><rect x="30" y="1226" width="330" height="116" rx="5" fill="#F7F8FA" stroke="#CDD3DC"/><text x="46" y="1248.7" font-size="11" fill="#5C6675" text-anchor="end">16</text><text x="56" y="1248.7" font-size="11" font-weight="700" fill="#121926" class="m" textLength="102.1" lengthAdjust="spacing">FRIVILLIG ARBEID</text><rect x="117.8" y="1255.5" width="233.7" height="15" rx="2" fill="#FFE36E"/><line x1="117.8" y1="1270.5" x2="351.5" y2="1270.5" stroke="#8F7200" stroke-width="1.5"/><text x="46" y="1266.7" font-size="11" fill="#5C6675" text-anchor="end">17</text><text x="56" y="1266.7" font-size="11" fill="#121926" class="m" textLength="44.7" lengthAdjust="spacing">2024–nå</text><text x="119.8" y="1266.7" font-size="11" fill="#121926" class="m" textLength="229.7" lengthAdjust="spacing">Besøksvenn, Røde Kors besøkstjeneste</text><text x="46" y="1284.7" font-size="11" fill="#5C6675" text-anchor="end">18</text><text x="119.8" y="1284.7" font-size="11" fill="#121926" class="m" textLength="216.9" lengthAdjust="spacing">Besøker en eldre dame hver uke for</text><text x="119.8" y="1302.7" font-size="11" fill="#121926" class="m" textLength="108.5" lengthAdjust="spacing">samtale og turer.</text><text x="38" y="1330" font-size="12" fill="#4B5565">Utdrag fra CV-teksten, linje 16–18</text><line x1="30" y1="1356" x2="360" y2="1356" stroke="#CDD3DC" stroke-width="1"/><rect x="30" y="1372" width="28" height="18" rx="3" fill="#FFFFFF" stroke="#1C3D8F" stroke-width="1.2"/><text x="44" y="1385" font-size="11" font-weight="700" fill="#1C3D8F" text-anchor="middle">K4</text><text font-size="15" fill="#121926"><tspan font-weight="600" x="70" y="1386.1">Gode samarbeidsevner</tspan></text><rect x="70" y="1398" width="117.3" height="24" rx="4" fill="#E4F2EA"/><g transform="translate(77 1402) scale(1)" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="0.8" y="0.8" width="14.4" height="14.4" rx="2.5" fill="#1B6B43" stroke="none"/><path d="M4.2 8.3l2.5 2.5 5-5.6" stroke="#FFFFFF" stroke-width="1.9"/></g><text x="98" y="1414.4" font-size="13" font-weight="600" fill="#1B6B43">Dokumentert</text><rect x="67" y="1432" width="272.8" height="22" rx="2" fill="#FFE36E"/><line x1="67" y1="1454" x2="339.8" y2="1454" stroke="#8F7200" stroke-width="1.5"/><text x="70" y="1447.5" font-size="11.5" fill="#121926" class="m" textLength="266.8" lengthAdjust="spacing">«Gruppeprosjekt i helsefremmende arbeid»</text><text x="70" y="1475" font-size="13" fill="#4B5565">CV-tekst, linje 21</text><rect x="70" y="1486" width="290" height="40" rx="6" fill="#FFFFFF" stroke="#1C3D8F" stroke-width="1.5"/><g transform="translate(166.5 1498) scale(1)" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6l4 4 4-4" stroke="#1C3D8F"/></g><text x="190.5" y="1510.8" font-size="14" font-weight="600" fill="#1C3D8F">Vis i CV-en</text><g transform="translate(16 1563) scale(1)" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 1.6l5.6 2v4.2c0 3.4-2.4 5.8-5.6 6.8-3.2-1-5.6-3.4-5.6-6.8V3.6z" stroke="#4B5565"/></g><text x="40" y="1575" font-size="15" font-weight="600" fill="#121926">Ansettelsesvilkår</text><text x="374" y="1575" font-size="13" font-weight="600" fill="#4B5565" text-anchor="end">telles ikke med</text><rect x="16" y="1594" width="358" height="98" rx="6" fill="#FFFFFF" stroke="#CDD3DC"/><rect x="30" y="1610" width="28" height="18" rx="3" fill="#FFFFFF" stroke="#1C3D8F" stroke-width="1.2"/><text x="44" y="1623" font-size="11" font-weight="700" fill="#1C3D8F" text-anchor="middle">V1</text><text font-size="15" fill="#121926"><tspan font-weight="600" x="70" y="1624.1">Politiattest</tspan></text><text font-size="14" fill="#4B5565"><tspan x="30" y="1651.3">Kan ikke dokumenteres i en CV. Du trenger ikke</tspan><tspan x="30" y="1672.3">svare, og teksten påstår ikke at du har den.</tspan></text><rect x="16" y="1708" width="358" height="371" rx="6" fill="#FFFFFF" stroke="#CDD3DC"/><text font-size="16" fill="#121926"><tspan font-weight="600" x="36" y="1743.4">Hva vil du at Supersøker skal lage?</tspan></text><rect x="36" y="1762" width="318" height="86" rx="6" fill="#F1F5FC" stroke="#1C3D8F" stroke-width="2"/><circle cx="59" cy="1786" r="8.5" fill="#FFFFFF" stroke="#1C3D8F" stroke-width="1.6"/><circle cx="59" cy="1786" r="4.6" fill="#1C3D8F"/><text font-size="15" fill="#121926"><tspan font-weight="600" x="78" y="1791.1">Helt søknadsutkast</tspan></text><text font-size="13" fill="#4B5565"><tspan x="78" y="1810.9">Et sammenhengende brev du redigerer</tspan><tspan x="78" y="1829.9">selv.</tspan></text><rect x="36" y="1858" width="318" height="67" rx="6" fill="#FFFFFF" stroke="#737D8C" stroke-width="1"/><circle cx="59" cy="1882" r="8.5" fill="#FFFFFF" stroke="#737D8C" stroke-width="1.6"/><text font-size="15" fill="#121926"><tspan font-weight="600" x="78" y="1887.1">Forslag til formuleringer</tspan></text><text font-size="13" fill="#4B5565"><tspan x="78" y="1906.9">Setninger du kan bruke i ditt eget brev.</tspan></text><line x1="16" y1="1945" x2="374" y2="1945" stroke="#CDD3DC" stroke-width="1"/><rect x="36" y="1961" width="318" height="44" rx="6" fill="#1C3D8F" stroke="#1C3D8F" stroke-width="1.5"/><g transform="translate(152.6 1975) scale(1)" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8h9.8M9 4.2L12.8 8 9 11.8" stroke="#FFFFFF"/></g><text x="176.6" y="1987.8" font-size="14" font-weight="600" fill="#FFFFFF">Lag tekst</text><text font-size="13" fill="#4B5565"><tspan x="36" y="2030.9">Teksten bygger bare på CV-teksten, annonsen og</tspan><tspan x="36" y="2049.9">svarene dine.</tspan></text><rect x="16" y="2095" width="358" height="44" rx="6" fill="#FFFFFF" stroke="#1C3D8F" stroke-width="1.5"/><g transform="translate(105.2 2109) scale(1)" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.8 2.6l2.6 2.6-7.6 7.6-3.2.6.6-3.2z" stroke="#1C3D8F"/></g><text x="129.2" y="2121.8" font-size="14" font-weight="600" fill="#1C3D8F">Endre CV eller annonse</text><line x1="0" y1="2167.5" x2="390" y2="2167.5" stroke="#CDD3DC" stroke-width="1"/><g transform="translate(16 2181) scale(0.938)" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="8" r="6.8" stroke="#4B5565"/><path d="M8 4.3V8l2.6 1.6" stroke="#4B5565"/></g><text font-size="13" fill="#4B5565"><tspan x="40" y="2193.9">Økten avsluttes etter 30 minutter uten aktivitet.</tspan><tspan x="40" y="2212.9">CV-tekst, annonse, svar og tekst slettes når du logger</tspan><tspan x="40" y="2231.9">ut.</tspan></text>
