<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1250" viewBox="0 0 1440 1250" role="img" aria-labelledby="tittel beskrivelse" xml:lang="nb">
<title id="tittel">Supersøker – Analyserer</title>
<desc id="beskrivelse">Venting under analysen: statusmeldingen Analyserer …, knappen er deaktivert og viser Analyserer …, og CV-tekst og annonse er fortsatt synlige og beholdt.</desc>
<style>.t{font-family:'Segoe UI Variable Text','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Roboto,Arial,sans-serif}.d{font-family:'Segoe UI Variable Display','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Roboto,Arial,sans-serif}</style>
<defs><filter id="lift" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#24102F" flood-opacity="0.13"/></filter><filter id="sticker" x="-10%" y="-20%" width="120%" height="150%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#24102F" flood-opacity="0.22"/></filter><filter id="barShadow" x="-5%" y="-60%" width="110%" height="200%"><feDropShadow dx="0" dy="-4" stdDeviation="8" flood-color="#24102F" flood-opacity="0.14"/></filter></defs>
<rect width="1440" height="1250" fill="#FFF3E2"/>
<rect x="0" y="0" width="1440" height="76" rx="0" fill="#4B1D63"/><g transform="translate(40 19) scale(1)"><rect x="0" y="2" width="34" height="34" rx="10" fill="#C9F46A" transform="rotate(-8 17 19)"/><g transform="translate(5 7) scale(1.0000)" fill="none" stroke="#24102F" color="#24102F" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></g><text class="d" x="46" y="29" font-size="26" font-weight="900" fill="#FFF3E2">Supersøker</text></g><g><rect x="1275" y="15" width="125" height="46" rx="23" fill="none" stroke="#FFF3E2" stroke-width="2.5"/><g transform="translate(1295.172 29) scale(0.7500)" fill="none" stroke="#FFF3E2" color="#FFF3E2" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h3.5"/><path d="M15.5 8l4 4-4 4"/><path d="M19.5 12H10"/></g><text class="t" x="1321.2" y="43.4" font-size="16" font-weight="700" fill="#FFF3E2">Logg ut</text></g><rect x="0" y="76" width="1440" height="44" rx="0" fill="#C9F46A"/><g transform="translate(48 87) scale(0.9167)" fill="none" stroke="#24102F" color="#24102F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v5.8c0 4.6-3.4 8.2-8 9.2-4.6-1-8-4.6-8-9.2V6z"/><path d="M8.3 12.2l2.6 2.6 4.8-5"/></g><text class="t" font-size="16" font-weight="600" fill="#24102F"><tspan x="84" y="102.8">Mock-modus er på – ingen tekst sendes til en språkmodell. Svarene er ferdiglagde eksempler.</tspan></text><rect x="200" y="156" width="336" height="60" rx="30" fill="#4B1D63"/><circle cx="232" cy="186" r="16" fill="#C9F46A"/><text class="t" x="232" y="192" font-size="17" font-weight="800" fill="#24102F" text-anchor="middle">1</text><text class="t" x="260" y="192" font-size="18" font-weight="800" fill="#FFF3E2">CV og annonse</text><text class="t" x="510" y="192" font-size="15" font-weight="700" fill="#C9F46A" text-anchor="end">Du er her</text><rect x="552" y="156" width="336" height="60" rx="30" fill="#FFF3E2" stroke="#8A7894" stroke-width="2" stroke-dasharray="6 5"/><circle cx="584" cy="186" r="15" fill="none" stroke="#8A7894" stroke-width="2"/><text class="t" x="584" y="192" font-size="17" font-weight="700" fill="#5C4868" text-anchor="middle">2</text><text class="t" x="612" y="192" font-size="18" font-weight="700" fill="#5C4868">Gap-analyse</text><rect x="904" y="156" width="336" height="60" rx="30" fill="#FFF3E2" stroke="#8A7894" stroke-width="2" stroke-dasharray="6 5"/><circle cx="936" cy="186" r="15" fill="none" stroke="#8A7894" stroke-width="2"/><text class="t" x="936" y="192" font-size="17" font-weight="700" fill="#5C4868" text-anchor="middle">3</text><text class="t" x="964" y="192" font-size="18" font-weight="700" fill="#5C4868">Teksten</text><text class="d" font-size="52" font-weight="900" fill="#24102F"><tspan x="200" y="307.6">CV-en din og annonsen</tspan></text><text class="t" font-size="19" font-weight="400" fill="#24102F"><tspan x="200" y="356.2">Lim inn eller last opp CV-en, og lim inn stillingsannonsen. Du ser teksten vi leste, og</tspan><tspan x="200" y="385.2">kan rette den før analysen.</tspan></text><rect x="200" y="430" width="1040" height="98" rx="22" fill="#E9E1F2"/><g transform="translate(222 452) scale(1.1667)" fill="none" stroke="#4B1D63" color="#4B1D63" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 1 1-9 9"/></g><text class="t" font-size="19" font-weight="700" fill="#24102F"><tspan x="266" y="470.2">Analyserer …</tspan></text><text class="t" font-size="17" font-weight="400" fill="#24102F"><tspan x="266" y="498.6">Vi sammenligner kravene i annonsen med CV-en din. Det kan ta opptil et halvt minutt. Inndataene dine er beholdt.</tspan></text><rect x="200" y="556" width="508" height="542" rx="28" fill="#FFFDF9" filter="url(#lift)"/><rect x="200" y="556" width="508" height="542" rx="28" fill="#FFFDF9" stroke="#E8D8C4" stroke-width="1.5"/><rect x="732" y="556" width="508" height="542" rx="28" fill="#FFFDF9" filter="url(#lift)"/><rect x="732" y="556" width="508" height="542" rx="28" fill="#FFFDF9" stroke="#E8D8C4" stroke-width="1.5"/><circle cx="245" cy="599.6" r="17" fill="#C9F46A"/><g transform="translate(234 588.6) scale(0.9167)" fill="none" stroke="#24102F" color="#24102F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h8.5L19 7.5V21H6z"/><path d="M14 3v5h5"/><path d="M9 13h7M9 16.5h5"/></g><text class="d" font-size="26" font-weight="900" fill="#24102F"><tspan x="272" y="607.3">Din CV</tspan></text><rect x="228" y="633" width="452" height="52" rx="26" fill="#F6E6CF" stroke="#8A7894" stroke-width="2"/><rect x="232" y="637" width="222" height="44" rx="22" fill="#4B1D63"/><g transform="translate(279.656 648) scale(0.8333)" fill="none" stroke="#FFFDF9" color="#FFFDF9" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l1.2-4.6L15.6 5l3.4 3.4L8.6 18.8z"/><path d="M13.6 7l3.4 3.4"/></g><text class="t" x="307.656" y="664.5" font-size="16" font-weight="700" fill="#FFFDF9">Lim inn tekst</text><g transform="translate(508.328 648) scale(0.8333)" fill="none" stroke="#24102F" color="#24102F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15.5V4"/><path d="M7 8.8L12 4l5 4.8"/><path d="M4 15v3.5A1.5 1.5 0 0 0 5.5 20h13a1.5 1.5 0 0 0 1.5-1.5V15"/></g><text class="t" x="536.328" y="664.5" font-size="16" font-weight="700" fill="#24102F">Last opp fil</text><text class="t" font-size="17" font-weight="700" fill="#24102F"><tspan x="228" y="724.6">CV-tekst</tspan></text><rect x="228" y="740" width="452" height="300" rx="16" fill="#FFF3E2" stroke="#8A7894" stroke-width="2"/><text class="t" font-size="17" font-weight="400" fill="#5C4868"><tspan x="246" y="772.1">Ida Testesen</tspan><tspan x="246" y="798.1">Testveien 1, 0000 Testvik</tspan><tspan x="246" y="824.1">E-post: ida.testesen@example.com</tspan><tspan x="246" y="850.1"></tspan><tspan x="246" y="876.1">PROFIL</tspan><tspan x="246" y="902.1">Sykepleierstudent på 2. år som trives med å jobbe</tspan><tspan x="246" y="928.1">med mennesker. Pålitelig, blid og vant til å</tspan><tspan x="246" y="954.1">samarbeide i team.</tspan><tspan x="246" y="980.1"></tspan><tspan x="246" y="1006.1">UTDANNING</tspan></text><rect x="667" y="750" width="5" height="280" rx="2.5" fill="#E8D8C4"/><rect x="667" y="750" width="5" height="76" rx="2.5" fill="#8A7894"/><text class="t" font-size="15" font-weight="400" fill="#5C4868" text-anchor="end"><tspan x="680" y="1063.5">895 / 10 000 tegn</tspan></text><circle cx="777" cy="599.6" r="17" fill="#C9F46A"/><g transform="translate(766 588.6) scale(0.9167)" fill="none" stroke="#24102F" color="#24102F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></g><text class="d" font-size="26" font-weight="900" fill="#24102F"><tspan x="804" y="607.3">Stillingsannonsen</tspan></text><text class="t" font-size="17" font-weight="700" fill="#24102F"><tspan x="760" y="650.6">Stillingsannonse</tspan></text><text class="t" font-size="15" font-weight="400" fill="#5C4868"><tspan x="760" y="675.5">Ta med stillingstittel og navnet på arbeidsgiveren.</tspan></text><rect x="760" y="690" width="452" height="300" rx="16" fill="#FFF3E2" stroke="#8A7894" stroke-width="2"/><text class="t" font-size="17" font-weight="400" fill="#5C4868"><tspan x="778" y="722.1">Sommervikar i hjemmetjenesten – Testvik kommune</tspan><tspan x="778" y="748.1"></tspan><tspan x="778" y="774.1">Hjemmetjenesten i Testvik kommune søker</tspan><tspan x="778" y="800.1">sommervikarer for perioden juni–august. Du vil bistå</tspan><tspan x="778" y="826.1">brukere i eget hjem med praktisk hjelp, personlig</tspan><tspan x="778" y="852.1">stell og sosial kontakt. Arbeidet foregår i turnus med</tspan><tspan x="778" y="878.1">dag- og kveldsvakter.</tspan><tspan x="778" y="904.1"></tspan><tspan x="778" y="930.1">Vi ser etter deg som:</tspan><tspan x="778" y="956.1">- har førerkort klasse B (krav, du kjører kommunens</tspan></text><rect x="1199" y="700" width="5" height="280" rx="2.5" fill="#E8D8C4"/><rect x="1199" y="700" width="5" height="117" rx="2.5" fill="#8A7894"/><text class="t" font-size="15" font-weight="400" fill="#5C4868" text-anchor="end"><tspan x="1212" y="1013.5">685 / 10 000 tegn</tspan></text><rect x="0" y="1146" width="1440" height="104" fill="#FFFDF9" filter="url(#barShadow)"/><rect x="0" y="1146" width="1440" height="104" fill="#FFFDF9"/><rect x="0" y="1146" width="1440" height="2" fill="#E8D8C4"/><g><rect x="1040" y="1168" width="200" height="60" rx="30" fill="#E4DCE6"/><g transform="translate(1067.977 1188) scale(0.8333)" fill="none" stroke="#6E6277" color="#6E6277" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 1 1-9 9"/></g><text class="t" x="1096.0" y="1204.1" font-size="18" font-weight="700" fill="#6E6277">Analyserer …</text></g>
</svg>
