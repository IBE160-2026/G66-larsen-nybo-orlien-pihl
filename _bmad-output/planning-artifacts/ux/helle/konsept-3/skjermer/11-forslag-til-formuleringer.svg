<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1372" viewBox="0 0 1440 1372" role="img" aria-labelledby="tittel beskrivelse" xml:lang="nb">
<title id="tittel">Supersøker – Forslag til formuleringer</title>
<desc id="beskrivelse">Steg 3 med forslag til formuleringer som liste, veiledning utenfor teksten merket Veiledning – ikke del av søknaden, og listen Teksten bygger på.</desc>
<style>.t{font-family:'Segoe UI Variable Text','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Roboto,Arial,sans-serif}.d{font-family:'Segoe UI Variable Display','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Roboto,Arial,sans-serif}</style>
<defs><filter id="lift" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#24102F" flood-opacity="0.13"/></filter><filter id="sticker" x="-10%" y="-20%" width="120%" height="150%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#24102F" flood-opacity="0.22"/></filter><filter id="barShadow" x="-5%" y="-60%" width="110%" height="200%"><feDropShadow dx="0" dy="-4" stdDeviation="8" flood-color="#24102F" flood-opacity="0.14"/></filter></defs>
<rect width="1440" height="1372" fill="#FFF3E2"/>
<rect x="0" y="0" width="1440" height="76" rx="0" fill="#4B1D63"/><g transform="translate(40 19) scale(1)"><rect x="0" y="2" width="34" height="34" rx="10" fill="#C9F46A" transform="rotate(-8 17 19)"/><g transform="translate(5 7) scale(1.0000)" fill="none" stroke="#24102F" color="#24102F" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></g><text class="d" x="46" y="29" font-size="26" font-weight="900" fill="#FFF3E2">Supersøker</text></g><g><rect x="1275" y="15" width="125" height="46" rx="23" fill="none" stroke="#FFF3E2" stroke-width="2.5"/><g transform="translate(1295.172 29) scale(0.7500)" fill="none" stroke="#FFF3E2" color="#FFF3E2" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h3.5"/><path d="M15.5 8l4 4-4 4"/><path d="M19.5 12H10"/></g><text class="t" x="1321.2" y="43.4" font-size="16" font-weight="700" fill="#FFF3E2">Logg ut</text></g><rect x="0" y="76" width="1440" height="44" rx="0" fill="#C9F46A"/><g transform="translate(48 87) scale(0.9167)" fill="none" stroke="#24102F" color="#24102F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v5.8c0 4.6-3.4 8.2-8 9.2-4.6-1-8-4.6-8-9.2V6z"/><path d="M8.3 12.2l2.6 2.6 4.8-5"/></g><text class="t" font-size="16" font-weight="600" fill="#24102F"><tspan x="84" y="102.8">Mock-modus er på – ingen tekst sendes til en språkmodell. Svarene er ferdiglagde eksempler.</tspan></text><rect x="200" y="156" width="336" height="60" rx="30" fill="#FFFDF9" stroke="#4B1D63" stroke-width="2"/><circle cx="232" cy="186" r="16" fill="#4B1D63"/><g transform="translate(222 176) scale(0.8333)" fill="none" stroke="#FFFDF9" color="#FFFDF9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></g><text class="t" x="260" y="192" font-size="18" font-weight="700" fill="#4B1D63">CV og annonse</text><text class="t" x="510" y="192" font-size="15" font-weight="700" fill="#5C4868" text-anchor="end">Ferdig</text><rect x="552" y="156" width="336" height="60" rx="30" fill="#FFFDF9" stroke="#4B1D63" stroke-width="2"/><circle cx="584" cy="186" r="16" fill="#4B1D63"/><g transform="translate(574 176) scale(0.8333)" fill="none" stroke="#FFFDF9" color="#FFFDF9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></g><text class="t" x="612" y="192" font-size="18" font-weight="700" fill="#4B1D63">Gap-analyse</text><text class="t" x="862" y="192" font-size="15" font-weight="700" fill="#5C4868" text-anchor="end">Ferdig</text><rect x="904" y="156" width="336" height="60" rx="30" fill="#4B1D63"/><circle cx="936" cy="186" r="16" fill="#C9F46A"/><text class="t" x="936" y="192" font-size="17" font-weight="800" fill="#24102F" text-anchor="middle">3</text><text class="t" x="964" y="192" font-size="18" font-weight="800" fill="#FFF3E2">Teksten</text><text class="t" x="1214" y="192" font-size="15" font-weight="700" fill="#C9F46A" text-anchor="end">Du er her</text><text class="d" font-size="52" font-weight="900" fill="#24102F"><tspan x="200" y="307.6">Forslag til formuleringer</tspan></text><text class="t" font-size="19" font-weight="400" fill="#24102F"><tspan x="200" y="356.2">Setninger du kan bruke i ditt eget brev. Plukk ut, endre og sett dem sammen med egne</tspan><tspan x="200" y="385.2">ord.</tspan></text><rect x="200" y="430" width="620" height="656" rx="28" fill="#FFFDF9" filter="url(#lift)"/><rect x="200" y="430" width="620" height="656" rx="28" fill="#FFFDF9" stroke="#E8D8C4" stroke-width="1.5"/><circle cx="245" cy="472.4" r="17" fill="#C9F46A"/><g transform="translate(234 461.4) scale(0.9167)" fill="none" stroke="#24102F" color="#24102F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 7h11M9 12h11M9 17h11"/><circle cx="4.6" cy="7" r="1.2" fill="currentColor" stroke="none"/><circle cx="4.6" cy="12" r="1.2" fill="currentColor" stroke="none"/><circle cx="4.6" cy="17" r="1.2" fill="currentColor" stroke="none"/></g><text class="d" font-size="24" font-weight="900" fill="#24102F"><tspan x="272" y="479.7">Forslag</tspan></text><text class="t" font-size="17" font-weight="700" fill="#24102F"><tspan x="228" y="520.6">Forslag (du kan redigere)</tspan></text><rect x="228" y="536" width="564" height="325" rx="16" fill="#FFFDF9" stroke="#8A7894" stroke-width="2"/><circle cx="254" cy="566.5" r="5" fill="#4B1D63"/><text class="t" font-size="17" font-weight="400" fill="#24102F"><tspan x="274" y="571.6">Jeg søker sommerjobb i hjemmetjenesten i Testvik kommune</tspan><tspan x="274" y="596.6">fordi jeg trives med å jobbe med mennesker.</tspan></text><circle cx="254" cy="632.5" r="5" fill="#4B1D63"/><text class="t" font-size="17" font-weight="400" fill="#24102F"><tspan x="274" y="637.6">Som besøksvenn i Røde Kors besøkstjeneste besøker jeg en</tspan><tspan x="274" y="662.6">eldre dame hver uke for samtale og turer.</tspan></text><circle cx="254" cy="698.5" r="5" fill="#4B1D63"/><text class="t" font-size="17" font-weight="400" fill="#24102F"><tspan x="274" y="703.6">I et gruppeprosjekt i helsefremmende arbeid planla vi et kurs</tspan><tspan x="274" y="728.6">om fallforebygging for eldre, og jeg koordinerte gruppens</tspan><tspan x="274" y="753.6">møter.</tspan></text><circle cx="254" cy="789.5" r="5" fill="#4B1D63"/><text class="t" font-size="17" font-weight="400" fill="#24102F"><tspan x="274" y="794.6">Norsk er morsmålet mitt.</tspan></text><circle cx="254" cy="830.5" r="5" fill="#4B1D63"/><text class="t" font-size="17" font-weight="400" fill="#24102F"><tspan x="274" y="835.6">Jeg har ikke førerkort ennå, men jeg har oppkjøring i april.</tspan></text><rect x="228" y="885" width="564" height="173" rx="20" fill="#FFF3E2" stroke="#4B1D63" stroke-width="2" stroke-dasharray="7 6"/><g transform="translate(248 905) scale(1.0000)" fill="none" stroke="#4B1D63" color="#4B1D63" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></g><text class="d" font-size="19" font-weight="800" fill="#24102F"><tspan x="282" y="924.7">Veiledning – ikke del av søknaden</tspan></text><text class="t" font-size="16" font-weight="400" fill="#24102F"><tspan x="248" y="955.3">Førerkort klasse B er et krav i annonsen. Forslagene sier det du skrev:</tspan><tspan x="248" y="978.3">at du ikke har førerkort ennå og har oppkjøring i april. De påstår ikke at</tspan><tspan x="248" y="1001.3">kravet er oppfylt.</tspan></text><text class="t" font-size="15" font-weight="600" fill="#5C4868"><tspan x="248" y="1031.5">«Kopier tekst» kopierer bare forslagene, ikke denne veiledningen.</tspan></text><rect x="844" y="430" width="396" height="635" rx="28" fill="#FFFDF9" filter="url(#lift)"/><rect x="844" y="430" width="396" height="635" rx="28" fill="#FFFDF9" stroke="#E8D8C4" stroke-width="1.5"/><circle cx="887" cy="470.4" r="17" fill="#C9F46A"/><g transform="translate(876 459.4) scale(0.9167)" fill="none" stroke="#24102F" color="#24102F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/></g><text class="d" font-size="24" font-weight="900" fill="#24102F"><tspan x="914" y="477.7">Teksten bygger på</tspan></text><text class="t" font-size="15" font-weight="400" fill="#5C4868"><tspan x="870" y="508.5">Grunnlag for den genererte teksten. Egne</tspan><tspan x="870" y="530.5">redigeringer kontrolleres ikke automatisk.</tspan></text><text class="t" font-size="15" font-weight="700" fill="#24102F"><tspan x="870" y="570.5">Stilling og arbeidsgiver</tspan></text><text class="t" font-size="17" font-weight="400" fill="#24102F"><tspan x="870" y="596.6">Sommervikar i hjemmetjenesten, Testvik</tspan><tspan x="870" y="621.6">kommune</tspan></text><text class="t" font-size="15" font-weight="700" fill="#24102F"><tspan x="870" y="662.5">Sitater fra CV-en</tspan></text><rect x="870" y="677" width="344" height="38" rx="12" fill="#C9F46A"/><g transform="translate(882 687) scale(0.7500)" fill="none" stroke="#24102F" color="#24102F" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h8.5L19 7.5V21H6z"/><path d="M14 3v5h5"/><path d="M9 13h7M9 16.5h5"/></g><text class="t" font-size="16" font-weight="700" fill="#24102F"><tspan x="910" y="700.8">«Norsk – morsmål»</tspan></text><rect x="870" y="723" width="344" height="60" rx="12" fill="#C9F46A"/><g transform="translate(882 744) scale(0.7500)" fill="none" stroke="#24102F" color="#24102F" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h8.5L19 7.5V21H6z"/><path d="M14 3v5h5"/><path d="M9 13h7M9 16.5h5"/></g><text class="t" font-size="16" font-weight="700" fill="#24102F"><tspan x="910" y="746.8">«Besøksvenn, Røde Kors</tspan><tspan x="910" y="768.8">besøkstjeneste»</tspan></text><rect x="870" y="791" width="344" height="60" rx="12" fill="#C9F46A"/><g transform="translate(882 812) scale(0.7500)" fill="none" stroke="#24102F" color="#24102F" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h8.5L19 7.5V21H6z"/><path d="M14 3v5h5"/><path d="M9 13h7M9 16.5h5"/></g><text class="t" font-size="16" font-weight="700" fill="#24102F"><tspan x="910" y="814.8">«Gruppeprosjekt i helsefremmende</tspan><tspan x="910" y="836.8">arbeid»</tspan></text><text class="t" font-size="15" font-weight="700" fill="#24102F"><tspan x="870" y="884.5">Ditt svar</tspan></text><rect x="870" y="899" width="344" height="140" rx="14" fill="#FFF0CC" stroke="#FFC247" stroke-width="2"/><text class="t" font-size="15" font-weight="700" fill="#24102F"><tspan x="886" y="926.5">Førerkort klasse B</tspan></text><text class="t" font-size="16" font-weight="400" fill="#24102F"><tspan x="886" y="951.3">«Jeg har ikke førerkort ennå. Jeg har</tspan><tspan x="886" y="974.3">oppkjøring i april.»</tspan></text><text class="t" font-size="14" font-weight="400" fill="#5C4868"><tspan x="886" y="1001.2">Oppgitt av deg. Supersøker har ikke kontrollert</tspan><tspan x="886" y="1021.2">det.</tspan></text><rect x="844" y="1085" width="396" height="135" rx="22" fill="#E9E1F2"/><g transform="translate(864 1105) scale(1.0000)" fill="none" stroke="#4B1D63" color="#4B1D63" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="10.5" width="14" height="10" rx="2.2"/><path d="M8.3 10.5V7.8a3.7 3.7 0 0 1 7.4 0v2.7"/></g><text class="t" font-size="17" font-weight="700" fill="#24102F"><tspan x="904" y="1121.1">Slettes når du logger ut</tspan></text><text class="t" font-size="16" font-weight="400" fill="#24102F"><tspan x="904" y="1147.3">Teksten tas vare på mens du er innlogget,</tspan><tspan x="904" y="1170.3">og slettes ved utlogging. Kopier den før du</tspan><tspan x="904" y="1193.3">logger ut.</tspan></text><rect x="0" y="1268" width="1440" height="104" fill="#FFFDF9" filter="url(#barShadow)"/><rect x="0" y="1268" width="1440" height="104" fill="#FFFDF9"/><rect x="0" y="1268" width="1440" height="2" fill="#E8D8C4"/><g><rect x="1052" y="1290" width="188" height="60" rx="30" fill="#4B1D63" filter="url(#lift)"/><rect x="1052" y="1290" width="188" height="60" rx="30" fill="#4B1D63"/><g transform="translate(1079.989 1310) scale(0.8333)" fill="none" stroke="#FFFDF9" color="#FFFDF9" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="8.5" y="8.5" width="12" height="12" rx="2"/><path d="M15.5 8.5V5a1.5 1.5 0 0 0-1.5-1.5H5A1.5 1.5 0 0 0 3.5 5v9A1.5 1.5 0 0 0 5 15.5h3.5"/></g><text class="t" x="1108.0" y="1326.1" font-size="18" font-weight="700" fill="#FFFDF9">Kopier tekst</text></g><g><rect x="200" y="1290" width="302" height="60" rx="30" fill="#FFFDF9" stroke="#4B1D63" stroke-width="2.5"/><g transform="translate(227.947 1310) scale(0.8333)" fill="none" stroke="#4B1D63" color="#4B1D63" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19.5 12H5"/><path d="M11 6l-6 6 6 6"/></g><text class="t" x="255.9" y="1326.1" font-size="18" font-weight="700" fill="#4B1D63">Endre svar eller tekstvalg</text></g>
</svg>
