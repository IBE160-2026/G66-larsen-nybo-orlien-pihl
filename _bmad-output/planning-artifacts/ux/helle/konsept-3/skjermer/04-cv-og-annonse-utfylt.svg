<title id="tittel">Supersøker – Steg 1, utfylt etter opplasting</title>
<desc id="beskrivelse">Steg 1 etter opplasting av cv-ida.pdf: innlest tekst i redigerbart felt med tegnteller, påminnelse om å sjekke kolonner og overskrifter i PDF, og annonsen utfylt. Analyser kravene har fokus.</desc>
