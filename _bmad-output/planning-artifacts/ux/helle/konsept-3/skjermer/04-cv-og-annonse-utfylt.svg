<rect x="0" y="0" width="1440" height="76" rx="0" fill="#4B1D63"/><g transform="translate(40 19) scale(1)"><rect x="0" y="2" width="34" height="34" rx="10" fill="#C9F46A" transform="rotate(-8 17 19)"/><g transform="translate(5 7) scale(1.0000)" fill="none" stroke="#24102F" color="#24102F" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></g><text class="d" x="46" y="29" font-size="26" font-weight="900" fill="#FFF3E2">Supersøker</text></g><g><rect x="1275" y="15" width="125" height="46" rx="23" fill="none" stroke="#FFF3E2" stroke-width="2.5"/><g transform="translate(1295.172 29) scale(0.7500)" fill="none" stroke="#FFF3E2" color="#FFF3E2" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h3.5"/><path d="M15.5 8l4 4-4 4"/><path d="M19.5 12H10"/></g><text class="t" x="1321.2" y="43.4" font-size="16" font-weight="700" fill="#FFF3E2">Logg ut</text></g><rect x="0" y="76" width="1440" height="44" rx="0" fill="#C9F46A"/><g transform="translate(48 87) scale(0.9167)" fill="none" stroke="#24102F" color="#24102F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v5.8c0 4.6-3.4 8.2-8 9.2-4.6-1-8-4.6-8-9.2V6z"/><path d="M8.3 12.2l2.6 2.6 4.8-5"/></g><text class="t" font-size="16" font-weight="600" fill="#24102F"><tspan x="84" y="102.8">Mock-modus er på – ingen tekst sendes til en språkmodell. Svarene er ferdiglagde eksempler.</tspan></text><rect x="200" y="156" width="336" height="60" rx="30" fill="#4B1D63"/><circle cx="232" cy="186" r="16" fill="#C9F46A"/><text class="t" x="232" y="192" font-size="17" font-weight="800" fill="#24102F" text-anchor="middle">1</text><text class="t" x="260" y="192" font-size="18" font-weight="800" fill="#FFF3E2">CV og annonse</text><text class="t" x="510" y="192" font-size="15" font-weight="700" fill="#C9F46A" text-anchor="end">Du er her</text><rect x="552" y="156" width="336" height="60" rx="30" fill="#FFF3E2" stroke="#8A7894" stroke-width="2" stroke-dasharray="6 5"/><circle cx="584" cy="186" r="15" fill="none" stroke="#8A7894" stroke-width="2"/><text class="t" x="584" y="192" font-size="17" font-weight="700" fill="#5C4868" text-anchor="middle">2</text><text class="t" x="612" y="192" font-size="18" font-weight="700" fill="#5C4868">Gap-analyse</text><rect x="904" y="156" width="336" height="60" rx="30" fill="#FFF3E2" stroke="#8A7894" stroke-width="2" stroke-dasharray="6 5"/><circle cx="936" cy="186" r="15" fill="none" stroke="#8A7894" stroke-width="2"/><text class="t" x="936" y="192" font-size="17" font-weight="700" fill="#5C4868" text-anchor="middle">3</text><text class="t" x="964" y="192" font-size="18" font-weight="700" fill="#5C4868">Teksten</text><text class="d" font-size="52" font-weight="900" fill="#24102F"><tspan x="200" y="307.6">CV-en din og annonsen</tspan></text><text class="t" font-size="19" font-weight="400" fill="#24102F"><tspan x="200" y="356.2">Lim inn eller last opp CV-en, og lim inn stillingsannonsen. Du ser teksten vi leste, og</tspan><tspan x="200" y="385.2">kan rette den før analysen.</tspan></text><rect x="200" y="430" width="508" height="839" rx="28" fill="#FFFDF9" filter="url(#lift)"/><rect x="200" y="430" width="508" height="839" rx="28" fill="#FFFDF9" stroke="#E8D8C4" stroke-width="1.5"/><rect x="732" y="430" width="508" height="839" rx="28" fill="#FFFDF9" filter="url(#lift)"/><rect x="732" y="430" width="508" height="839" rx="28" fill="#FFFDF9" stroke="#E8D8C4" stroke-width="1.5"/><circle cx="245" cy="473.6" r="17" fill="#C9F46A"/><g transform="translate(234 462.6) scale(0.9167)" fill="none" stroke="#24102F" color="#24102F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h8.5L19 7.5V21H6z"/><path d="M14 3v5h5"/><path d="M9 13h7M9 16.5h5"/></g><text class="d" font-size="26" font-weight="900" fill="#24102F"><tspan x="272" y="481.3">Din CV</tspan></text><rect x="228" y="507" width="452" height="52" rx="26" fill="#F6E6CF" stroke="#8A7894" stroke-width="2"/><g transform="translate(279.656 522) scale(0.8333)" fill="none" stroke="#24102F" color="#24102F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l1.2-4.6L15.6 5l3.4 3.4L8.6 18.8z"/><path d="M13.6 7l3.4 3.4"/></g><text class="t" x="307.656" y="538.5" font-size="16" font-weight="700" fill="#24102F">Lim inn tekst</text><rect x="454" y="511" width="222" height="44" rx="22" fill="#4B1D63"/><g transform="translate(508.328 522) scale(0.8333)" fill="none" stroke="#FFFDF9" color="#FFFDF9" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15.5V4"/><path d="M7 8.8L12 4l5 4.8"/><path d="M4 15v3.5A1.5 1.5 0 0 0 5.5 20h13a1.5 1.5 0 0 0 1.5-1.5V15"/></g><text class="t" x="536.328" y="538.5" font-size="16" font-weight="700" fill="#FFFDF9">Last opp fil</text><rect x="228" y="581" width="452" height="64" rx="18" fill="#FFF3E2" stroke="#8A7894" stroke-width="2"/><g transform="translate(244 601) scale(1.0000)" fill="none" stroke="#4B1D63" color="#4B1D63" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h8.5L19 7.5V21H6z"/><path d="M14 3v5h5"/><path d="M9 13h7M9 16.5h5"/></g><text class="t" x="280" y="609" font-size="17" font-weight="700" fill="#24102F">cv-ida.pdf</text><text class="t" x="280" y="630" font-size="15" fill="#5C4868">Teksten er lest inn</text><g><rect x="519" y="591" width="151" height="44" rx="22" fill="#FFFDF9" stroke="#4B1D63" stroke-width="2.5"/><text class="t" x="534.9" y="618.1" font-size="15" font-weight="700" fill="#4B1D63">Velg en annen fil</text></g><rect x="228" y="663" width="452" height="131" rx="22" fill="#FFF0CC" stroke="#FFC247" stroke-width="2"/><g transform="translate(246 681) scale(1.0000)" fill="none" stroke="#4B1D63" color="#4B1D63" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5"/><path d="M12 11v5.8"/><circle cx="12" cy="7.8" r="1.2" fill="currentColor" stroke="none"/></g><text class="t" font-size="17" font-weight="700" fill="#24102F"><tspan x="286" y="697.1">Sjekk rekkefølgen</tspan></text><text class="t" font-size="16" font-weight="400" fill="#24102F"><tspan x="286" y="723.3">PDF-er med kolonner kan bli lest i feil rekkefølge.</tspan><tspan x="286" y="746.3">Se at overskrifter og avsnitt står riktig, og rett i</tspan><tspan x="286" y="769.3">feltet.</tspan></text><text class="t" font-size="17" font-weight="700" fill="#24102F"><tspan x="228" y="831.6">CV-tekst (lest fra cv-ida.pdf)</tspan></text><text class="t" font-size="15" font-weight="400" fill="#5C4868"><tspan x="228" y="856.5">Du kan rette teksten. Analysen bruker det som står her.</tspan></text><rect x="228" y="871" width="452" height="340" rx="16" fill="#FFFDF9" stroke="#8A7894" stroke-width="2"/><text class="t" font-size="17" font-weight="400" fill="#24102F"><tspan x="246" y="903.1">Ida Testesen</tspan><tspan x="246" y="929.1">Testveien 1, 0000 Testvik</tspan><tspan x="246" y="955.1">E-post: ida.testesen@example.com</tspan><tspan x="246" y="981.1"></tspan><tspan x="246" y="1007.1">PROFIL</tspan><tspan x="246" y="1033.1">Sykepleierstudent på 2. år som trives med å jobbe</tspan><tspan x="246" y="1059.1">med mennesker. Pålitelig, blid og vant til å</tspan><tspan x="246" y="1085.1">samarbeide i team.</tspan><tspan x="246" y="1111.1"></tspan><tspan x="246" y="1137.1">UTDANNING</tspan><tspan x="246" y="1163.1">2025–nå Bachelor i sykepleie, Høgskolen i Testvik</tspan><tspan x="246" y="1189.1">(2. år)</tspan></text><rect x="667" y="881" width="5" height="320" rx="2.5" fill="#E8D8C4"/><rect x="667" y="881" width="5" height="104" rx="2.5" fill="#8A7894"/><text class="t" font-size="15" font-weight="400" fill="#5C4868" text-anchor="end"><tspan x="680" y="1234.5">895 / 10 000 tegn</tspan></text><circle cx="777" cy="473.6" r="17" fill="#C9F46A"/><g transform="translate(766 462.6) scale(0.9167)" fill="none" stroke="#24102F" color="#24102F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></g><text class="d" font-size="26" font-weight="900" fill="#24102F"><tspan x="804" y="481.3">Stillingsannonsen</tspan></text><text class="t" font-size="17" font-weight="700" fill="#24102F"><tspan x="760" y="524.6">Stillingsannonse</tspan></text><text class="t" font-size="15" font-weight="400" fill="#5C4868"><tspan x="760" y="549.5">Ta med stillingstittel og navnet på arbeidsgiveren.</tspan></text><rect x="760" y="564" width="452" height="560" rx="16" fill="#FFFDF9" stroke="#8A7894" stroke-width="2"/><text class="t" font-size="17" font-weight="400" fill="#24102F"><tspan x="778" y="596.1">Sommervikar i hjemmetjenesten – Testvik kommune</tspan><tspan x="778" y="622.1"></tspan><tspan x="778" y="648.1">Hjemmetjenesten i Testvik kommune søker</tspan><tspan x="778" y="674.1">sommervikarer for perioden juni–august. Du vil bistå</tspan><tspan x="778" y="700.1">brukere i eget hjem med praktisk hjelp, personlig</tspan><tspan x="778" y="726.1">stell og sosial kontakt. Arbeidet foregår i turnus med</tspan><tspan x="778" y="752.1">dag- og kveldsvakter.</tspan><tspan x="778" y="778.1"></tspan><tspan x="778" y="804.1">Vi ser etter deg som:</tspan><tspan x="778" y="830.1">- har førerkort klasse B (krav, du kjører kommunens</tspan><tspan x="778" y="856.1">biler mellom brukerne)</tspan><tspan x="778" y="882.1">- har gode norskkunnskaper, muntlig og skriftlig</tspan><tspan x="778" y="908.1">- har erfaring med eller interesse for å jobbe med</tspan><tspan x="778" y="934.1">mennesker</tspan><tspan x="778" y="960.1">- har gode samarbeidsevner</tspan><tspan x="778" y="986.1"></tspan><tspan x="778" y="1012.1">Vi tilbyr:</tspan><tspan x="778" y="1038.1">- opplæring første uke</tspan><tspan x="778" y="1064.1">- lønn etter tariff</tspan><tspan x="778" y="1090.1">- et godt og inkluderende arbeidsmiljø</tspan></text><rect x="1199" y="574" width="5" height="540" rx="2.5" fill="#E8D8C4"/><rect x="1199" y="574" width="5" height="450" rx="2.5" fill="#8A7894"/><text class="t" font-size="15" font-weight="400" fill="#5C4868" text-anchor="end"><tspan x="1212" y="1147.5">685 / 10 000 tegn</tspan></text><rect x="0" y="1317" width="1440" height="104" fill="#FFFDF9" filter="url(#barShadow)"/><rect x="0" y="1317" width="1440" height="104" fill="#FFFDF9"/><rect x="0" y="1317" width="1440" height="2" fill="#E8D8C4"/><g><rect x="1007" y="1339" width="233" height="60" rx="30" fill="#4B1D63" filter="url(#lift)"/><rect x="1007" y="1339" width="233" height="60" rx="30" fill="#4B1D63"/><text class="t" x="1035.0" y="1375.1" font-size="18" font-weight="700" fill="#FFFDF9">Analyser kravene</text><g transform="translate(1194.038 1359) scale(0.8333)" fill="none" stroke="#FFFDF9" color="#FFFDF9" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12h14.5"/><path d="M13 6l6 6-6 6"/></g><rect x="1002" y="1334" width="243" height="70" rx="35" fill="none" stroke="#24102F" stroke-width="3"/></g>
</svg>
