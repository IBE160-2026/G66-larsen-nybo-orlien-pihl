<rect x="0" y="0" width="1440" height="76" rx="0" fill="#4B1D63"/><g transform="translate(40 19) scale(1)"><rect x="0" y="2" width="34" height="34" rx="10" fill="#C9F46A" transform="rotate(-8 17 19)"/><g transform="translate(5 7) scale(1.0000)" fill="none" stroke="#24102F" color="#24102F" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></g><text class="d" x="46" y="29" font-size="26" font-weight="900" fill="#FFF3E2">Supersøker</text></g><g><rect x="1275" y="15" width="125" height="46" rx="23" fill="none" stroke="#FFF3E2" stroke-width="2.5"/><g transform="translate(1295.172 29) scale(0.7500)" fill="none" stroke="#FFF3E2" color="#FFF3E2" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h3.5"/><path d="M15.5 8l4 4-4 4"/><path d="M19.5 12H10"/></g><text class="t" x="1321.2" y="43.4" font-size="16" font-weight="700" fill="#FFF3E2">Logg ut</text></g><rect x="0" y="76" width="1440" height="44" rx="0" fill="#C9F46A"/><g transform="translate(48 87) scale(0.9167)" fill="none" stroke="#24102F" color="#24102F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v5.8c0 4.6-3.4 8.2-8 9.2-4.6-1-8-4.6-8-9.2V6z"/><path d="M8.3 12.2l2.6 2.6 4.8-5"/></g><text class="t" font-size="16" font-weight="600" fill="#24102F"><tspan x="84" y="102.8">Mock-modus er på – ingen tekst sendes til en språkmodell. Svarene er ferdiglagde eksempler.</tspan></text><rect x="200" y="156" width="336" height="60" rx="30" fill="#FFFDF9" stroke="#4B1D63" stroke-width="2"/><circle cx="232" cy="186" r="16" fill="#4B1D63"/><g transform="translate(222 176) scale(0.8333)" fill="none" stroke="#FFFDF9" color="#FFFDF9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></g><text class="t" x="260" y="192" font-size="18" font-weight="700" fill="#4B1D63">CV og annonse</text><text class="t" x="510" y="192" font-size="15" font-weight="700" fill="#5C4868" text-anchor="end">Ferdig</text><rect x="552" y="156" width="336" height="60" rx="30" fill="#4B1D63"/><circle cx="584" cy="186" r="16" fill="#C9F46A"/><text class="t" x="584" y="192" font-size="17" font-weight="800" fill="#24102F" text-anchor="middle">2</text><text class="t" x="612" y="192" font-size="18" font-weight="800" fill="#FFF3E2">Gap-analyse</text><text class="t" x="862" y="192" font-size="15" font-weight="700" fill="#C9F46A" text-anchor="end">Du er her</text><rect x="904" y="156" width="336" height="60" rx="30" fill="#FFF3E2" stroke="#8A7894" stroke-width="2" stroke-dasharray="6 5"/><circle cx="936" cy="186" r="15" fill="none" stroke="#8A7894" stroke-width="2"/><text class="t" x="936" y="192" font-size="17" font-weight="700" fill="#5C4868" text-anchor="middle">3</text><text class="t" x="964" y="192" font-size="18" font-weight="700" fill="#5C4868">Teksten</text><g><rect x="200" y="256" width="508" height="44" rx="10" fill="none" stroke="#8A7894" stroke-width="1.5" stroke-dasharray="6 5"/><text class="t" x="218" y="284" font-size="16" font-weight="700" fill="#5C4868">Variant A – alle krav dokumentert (testpar 4)</text></g><text class="d" font-size="36" font-weight="900" fill="#24102F"><tspan x="200" y="354.3">Sommervikar –</tspan><tspan x="200" y="393.3">barnehageassistent –</tspan><tspan x="200" y="432.3">Testvik barnehage</tspan></text><rect x="200" y="465" width="508" height="150" rx="22" fill="#E3F8C4"/><g transform="translate(222 487) scale(1.1667)" fill="none" stroke="#4B1D63" color="#4B1D63" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5"/><path d="M7.8 12.4l3 3 5.6-6"/></g><text class="t" font-size="20" font-weight="700" fill="#24102F"><tspan x="266" y="506.0">Alle kompetansekrav i annonsen er</tspan><tspan x="266" y="532.0">dokumentert i CV-en.</tspan></text><text class="t" font-size="17" font-weight="400" fill="#24102F"><tspan x="266" y="560.6">Du kan gå rett videre og velge hva slags tekst du vil</tspan><tspan x="266" y="585.6">ha.</tspan></text><text class="d" font-size="26" font-weight="900" fill="#24102F"><tspan x="200" y="669.8">Dokumentert i CV-en</tspan></text><rect x="200" y="693" width="508" height="234" rx="28" fill="#FFFDF9" filter="url(#lift)"/><rect x="200" y="693" width="508" height="234" rx="28" fill="#FFFDF9" stroke="#E8D8C4" stroke-width="1.5"/><path d="M200 757 V721 a28 28 0 0 1 28 -28 H680 a28 28 0 0 1 28 28 V757 z" fill="#E3F8C4"/><rect x="222" y="707" width="161" height="36" rx="18" fill="#FFFDF9" stroke="#24102F" stroke-width="2"/><g transform="translate(234 714) scale(0.9167)" fill="none" stroke="#4B1D63" color="#4B1D63" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5"/><path d="M7.8 12.4l3 3 5.6-6"/></g><text class="t" x="264" y="730.6" font-size="16" font-weight="700" fill="#24102F">Dokumentert</text><text class="d" font-size="21" font-weight="800" fill="#24102F"><tspan x="228" y="796.3">Erfaring med arbeid med barn</tspan></text><g transform="rotate(-1.4 418 859)"><rect x="228" y="817" width="380" height="84" rx="16" fill="#C9F46A" filter="url(#sticker)"/><g transform="translate(246 832) scale(0.7500)" fill="none" stroke="#24102F" color="#24102F" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h8.5L19 7.5V21H6z"/><path d="M14 3v5h5"/><path d="M9 13h7M9 16.5h5"/></g><text class="t" x="270" y="846" font-size="14" font-weight="700" fill="#24102F">Fra CV-en din</text><text class="t" font-size="18" font-weight="700" fill="#24102F"><tspan x="248" y="876.4">«Tilkallingsvikar, Testvik barnehage»</tspan></text></g><rect x="200" y="943" width="508" height="284" rx="28" fill="#FFFDF9" filter="url(#lift)"/><rect x="200" y="943" width="508" height="284" rx="28" fill="#FFFDF9" stroke="#E8D8C4" stroke-width="1.5"/><path d="M200 1007 V971 a28 28 0 0 1 28 -28 H680 a28 28 0 0 1 28 28 V1007 z" fill="#E3F8C4"/><rect x="222" y="957" width="161" height="36" rx="18" fill="#FFFDF9" stroke="#24102F" stroke-width="2"/><g transform="translate(234 964) scale(0.9167)" fill="none" stroke="#4B1D63" color="#4B1D63" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5"/><path d="M7.8 12.4l3 3 5.6-6"/></g><text class="t" x="264" y="980.6" font-size="16" font-weight="700" fill="#24102F">Dokumentert</text><text class="d" font-size="21" font-weight="800" fill="#24102F"><tspan x="228" y="1046.3">Utdanning innen pedagogikk, gjerne</tspan><tspan x="228" y="1072.3">påbegynt</tspan></text><g transform="rotate(1.2 418 1147)"><rect x="228" y="1093" width="380" height="108" rx="16" fill="#C9F46A" filter="url(#sticker)"/><g transform="translate(246 1108) scale(0.7500)" fill="none" stroke="#24102F" color="#24102F" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h8.5L19 7.5V21H6z"/><path d="M14 3v5h5"/><path d="M9 13h7M9 16.5h5"/></g><text class="t" x="270" y="1122" font-size="14" font-weight="700" fill="#24102F">Fra CV-en din</text><text class="t" font-size="18" font-weight="700" fill="#24102F"><tspan x="248" y="1152.4">«Bachelor i</tspan><tspan x="248" y="1176.4">barnehagelærerutdanning»</tspan></text></g><rect x="200" y="1243" width="508" height="234" rx="28" fill="#FFFDF9" filter="url(#lift)"/><rect x="200" y="1243" width="508" height="234" rx="28" fill="#FFFDF9" stroke="#E8D8C4" stroke-width="1.5"/><path d="M200 1307 V1271 a28 28 0 0 1 28 -28 H680 a28 28 0 0 1 28 28 V1307 z" fill="#E3F8C4"/><rect x="222" y="1257" width="161" height="36" rx="18" fill="#FFFDF9" stroke="#24102F" stroke-width="2"/><g transform="translate(234 1264) scale(0.9167)" fill="none" stroke="#4B1D63" color="#4B1D63" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5"/><path d="M7.8 12.4l3 3 5.6-6"/></g><text class="t" x="264" y="1280.6" font-size="16" font-weight="700" fill="#24102F">Dokumentert</text><text class="d" font-size="21" font-weight="800" fill="#24102F"><tspan x="228" y="1346.3">Gjennomført førstehjelpskurs</tspan></text><g transform="rotate(-1.4 418 1409)"><rect x="228" y="1367" width="380" height="84" rx="16" fill="#C9F46A" filter="url(#sticker)"/><g transform="translate(246 1382) scale(0.7500)" fill="none" stroke="#24102F" color="#24102F" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h8.5L19 7.5V21H6z"/><path d="M14 3v5h5"/><path d="M9 13h7M9 16.5h5"/></g><text class="t" x="270" y="1396" font-size="14" font-weight="700" fill="#24102F">Fra CV-en din</text><text class="t" font-size="18" font-weight="700" fill="#24102F"><tspan x="248" y="1426.4">«Førstehjelpskurs for barn og unge»</tspan></text></g><rect x="200" y="1493" width="508" height="234" rx="28" fill="#FFFDF9" filter="url(#lift)"/><rect x="200" y="1493" width="508" height="234" rx="28" fill="#FFFDF9" stroke="#E8D8C4" stroke-width="1.5"/><path d="M200 1557 V1521 a28 28 0 0 1 28 -28 H680 a28 28 0 0 1 28 28 V1557 z" fill="#E3F8C4"/><rect x="222" y="1507" width="161" height="36" rx="18" fill="#FFFDF9" stroke="#24102F" stroke-width="2"/><g transform="translate(234 1514) scale(0.9167)" fill="none" stroke="#4B1D63" color="#4B1D63" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5"/><path d="M7.8 12.4l3 3 5.6-6"/></g><text class="t" x="264" y="1530.6" font-size="16" font-weight="700" fill="#24102F">Dokumentert</text><text class="d" font-size="21" font-weight="800" fill="#24102F"><tspan x="228" y="1596.3">Interesse for friluftsliv</tspan></text><g transform="rotate(1.2 418 1659)"><rect x="228" y="1617" width="380" height="84" rx="16" fill="#C9F46A" filter="url(#sticker)"/><g transform="translate(246 1632) scale(0.7500)" fill="none" stroke="#24102F" color="#24102F" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h8.5L19 7.5V21H6z"/><path d="M14 3v5h5"/><path d="M9 13h7M9 16.5h5"/></g><text class="t" x="270" y="1646" font-size="14" font-weight="700" fill="#24102F">Fra CV-en din</text><text class="t" font-size="18" font-weight="700" fill="#24102F"><tspan x="248" y="1676.4">«helgeturer i skog og fjell»</tspan></text></g><text class="d" font-size="26" font-weight="900" fill="#24102F"><tspan x="200" y="1785.8">Hva slags tekst vil du ha?</tspan></text><text class="t" font-size="16" font-weight="400" fill="#5C4868"><tspan x="200" y="1815.3">Velg én. Du kan bytte senere uten ny analyse.</tspan></text><rect x="200" y="1838" width="508" height="109" rx="24" fill="#FFFDF9" filter="url(#lift)"/><rect x="200" y="1838" width="508" height="109" rx="24" fill="#FFFDF9" stroke="#4B1D63" stroke-width="3"/><circle cx="238" cy="1877" r="13" fill="#FFFDF9" stroke="#4B1D63" stroke-width="2.5"/><circle cx="238" cy="1877" r="7" fill="#4B1D63"/><text class="d" font-size="22" font-weight="800" fill="#24102F"><tspan x="268" y="1884.6">Helt søknadsutkast</tspan></text><text class="t" font-size="17" font-weight="400" fill="#24102F"><tspan x="268" y="1915.6">Et sammenhengende brev du redigerer selv.</tspan></text><rect x="629.77" y="1860" width="54.23" height="28" rx="14" fill="#C9F46A"/><text class="t" x="656.885" y="1879" font-size="14" font-weight="700" fill="#24102F" text-anchor="middle">Valgt</text><rect x="200" y="1961" width="508" height="109" rx="24" fill="#FFFDF9" stroke="#8A7894" stroke-width="2"/><circle cx="238" cy="2000" r="13" fill="#FFFDF9" stroke="#24102F" stroke-width="2.5"/><text class="d" font-size="22" font-weight="800" fill="#24102F"><tspan x="268" y="2007.6">Forslag til formuleringer</tspan></text><text class="t" font-size="17" font-weight="400" fill="#24102F"><tspan x="268" y="2038.6">Setninger du kan bruke i ditt eget brev.</tspan></text><g><rect x="200" y="2094" width="508" height="60" rx="30" fill="#4B1D63" filter="url(#lift)"/><rect x="200" y="2094" width="508" height="60" rx="30" fill="#4B1D63"/><text class="t" x="400.5" y="2130.1" font-size="18" font-weight="700" fill="#FFFDF9">Lag tekst</text><g transform="translate(489.51 2114) scale(0.8333)" fill="none" stroke="#FFFDF9" color="#FFFDF9" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12h14.5"/><path d="M13 6l6 6-6 6"/></g></g><g><rect x="732" y="256" width="508" height="44" rx="10" fill="none" stroke="#8A7894" stroke-width="1.5" stroke-dasharray="6 5"/><text class="t" x="750" y="284" font-size="16" font-weight="700" fill="#5C4868">Variant B – ingen tydelige krav i annonsen</text></g><text class="d" font-size="36" font-weight="900" fill="#24102F"><tspan x="732" y="354.3">Sommervikar i</tspan><tspan x="732" y="393.3">hjemmetjenesten – Testvik</tspan><tspan x="732" y="432.3">kommune</tspan></text><rect x="732" y="465" width="508" height="192" rx="22" fill="#FFF0CC" stroke="#FFC247" stroke-width="2"/><g transform="translate(754 487) scale(1.1667)" fill="none" stroke="#4B1D63" color="#4B1D63" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></g><text class="t" font-size="20" font-weight="700" fill="#24102F"><tspan x="798" y="506.0">Vi fant ingen tydelige krav i annonsen.</tspan></text><text class="t" font-size="17" font-weight="400" fill="#24102F"><tspan x="798" y="534.6">Du kan rette annonsen eller lage tekst basert på</tspan><tspan x="798" y="559.6">CV-en og opplysningene du har gitt.</tspan></text><g><rect x="798" y="583" width="274" height="52" rx="26" fill="#FFFDF9" stroke="#4B1D63" stroke-width="2.5"/><g transform="translate(826.079 599.5) scale(0.7917)" fill="none" stroke="#4B1D63" color="#4B1D63" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l1.2-4.6L15.6 5l3.4 3.4L8.6 18.8z"/><path d="M13.6 7l3.4 3.4"/></g><text class="t" x="853.1" y="614.8" font-size="17" font-weight="700" fill="#4B1D63">Endre CV eller annonse</text></g><text class="t" font-size="17" font-weight="400" fill="#5C4868"><tspan x="732" y="694.6">Teksten bygger da bare på CV-en din og stillingstittelen. Vi</tspan><tspan x="732" y="719.6">legger ikke til krav som ikke står i annonsen.</tspan></text><text class="d" font-size="26" font-weight="900" fill="#24102F"><tspan x="732" y="781.8">Hva slags tekst vil du ha?</tspan></text><text class="t" font-size="16" font-weight="400" fill="#5C4868"><tspan x="732" y="811.3">Velg én. Du kan bytte senere uten ny analyse.</tspan></text><rect x="732" y="834" width="508" height="109" rx="24" fill="#FFFDF9" filter="url(#lift)"/><rect x="732" y="834" width="508" height="109" rx="24" fill="#FFFDF9" stroke="#4B1D63" stroke-width="3"/><circle cx="770" cy="873" r="13" fill="#FFFDF9" stroke="#4B1D63" stroke-width="2.5"/><circle cx="770" cy="873" r="7" fill="#4B1D63"/><circle cx="770" cy="873" r="19" fill="none" stroke="#24102F" stroke-width="3"/><text class="d" font-size="22" font-weight="800" fill="#24102F"><tspan x="800" y="880.6">Helt søknadsutkast</tspan></text><text class="t" font-size="17" font-weight="400" fill="#24102F"><tspan x="800" y="911.6">Et sammenhengende brev du redigerer selv.</tspan></text><rect x="1161.77" y="856" width="54.23" height="28" rx="14" fill="#C9F46A"/><text class="t" x="1188.885" y="875" font-size="14" font-weight="700" fill="#24102F" text-anchor="middle">Valgt</text><rect x="732" y="957" width="508" height="109" rx="24" fill="#FFFDF9" stroke="#8A7894" stroke-width="2"/><circle cx="770" cy="996" r="13" fill="#FFFDF9" stroke="#24102F" stroke-width="2.5"/><text class="d" font-size="22" font-weight="800" fill="#24102F"><tspan x="800" y="1003.6">Forslag til formuleringer</tspan></text><text class="t" font-size="17" font-weight="400" fill="#24102F"><tspan x="800" y="1034.6">Setninger du kan bruke i ditt eget brev.</tspan></text><g><rect x="732" y="1090" width="508" height="60" rx="30" fill="#4B1D63" filter="url(#lift)"/><rect x="732" y="1090" width="508" height="60" rx="30" fill="#4B1D63"/><text class="t" x="932.5" y="1126.1" font-size="18" font-weight="700" fill="#FFFDF9">Lag tekst</text><g transform="translate(1021.51 1110) scale(0.8333)" fill="none" stroke="#FFFDF9" color="#FFFDF9" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12h14.5"/><path d="M13 6l6 6-6 6"/></g></g><rect x="719" y="256" width="2" height="1898" fill="#E8D8C4"/>
