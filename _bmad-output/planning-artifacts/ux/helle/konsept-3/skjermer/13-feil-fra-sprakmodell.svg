ikar i hjemmetjenesten – Testvik kommune</tspan><tspan x="246" y="1268.1"></tspan><tspan x="246" y="1294.1">Hjemmetjenesten i Testvik kommune søker</tspan><tspan x="246" y="1320.1">sommervikarer for perioden juni–august. Du vil bistå</tspan><tspan x="246" y="1346.1">brukere i eget hjem med praktisk hjelp, personlig</tspan></text><rect x="667" y="1220" width="5" height="150" rx="2.5" fill="#E8D8C4"/><rect x="667" y="1220" width="5" height="31" rx="2.5" fill="#8A7894"/><text class="t" font-size="15" font-weight="400" fill="#5C4868" text-anchor="end"><tspan x="680" y="1403.5">685 / 10 000 tegn</tspan></text><g><rect x="732" y="256" width="508" height="44" rx="10" fill="none" stroke="#8A7894" stroke-width="1.5" stroke-dasharray="6 5"/><text class="t" x="750" y="284" font-size="16" font-weight="700" fill="#5C4868">Variant B – analysen kunne ikke brukes</text></g><text class="d" font-size="40" font-weight="900" fill="#24102F"><tspan x="732" y="357.5">CV-en din og annonsen</tspan></text><rect x="732" y="391" width="508" height="217" rx="22" fill="#FDE7E4" stroke="#B3261E" stroke-width="2"/><g transform="translate(754 413) scale(1.1667)" fill="none" stroke="#B3261E" color="#B3261E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.6L21.6 20H2.4z"/><path d="M12 9.8v4.6"/><circle cx="12" cy="17.1" r="1.1" fill="currentColor" stroke="none"/></g><text class="t" font-size="20" font-weight="700" fill="#24102F"><tspan x="798" y="432.0">Vi kunne ikke bekrefte analysen</tspan></text><text class="t" font-size="17" font-weight="400" fill="#24102F"><tspan x="798" y="460.6">Analysen kunne ikke brukes fordi dokumentasjonen</tspan><tspan x="798" y="485.6">ikke kunne bekreftes i CV-teksten. CV og annonse er</tspan><tspan x="798" y="510.6">beholdt. Prøv analysen på nytt.</tspan></text><g><rect x="798" y="534" width="165" height="52" rx="26" fill="#4B1D63" filter="url(#lift)"/><rect x="798" y="534" width="165" height="52" rx="26" fill="#4B1D63"/><g transform="t