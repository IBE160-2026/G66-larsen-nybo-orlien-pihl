<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1343" viewBox="0 0 1440 1343" role="img" aria-labelledby="tittel beskrivelse" xml:lang="nb">
<title id="tittel">Supersøker – Søknadsutkast</title>
<desc id="beskrivelse">Steg 3 med helt søknadsutkast i redigerbart felt, listen Teksten bygger på ved siden av, melding om at teksten slettes ved utlogging, og bekreftelsen Kopiert. Lim inn teksten der du skriver søknaden. ved knappen Kopier tekst.</desc>
<style>.t{font-family:'Segoe UI Variable Text','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Roboto,Arial,sans-serif}.d{font-family:'Segoe UI Variable Display','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Roboto,Arial,sans-serif}</style>
<defs><filter id="lift" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#24102F" flood-opacity="0.13"/></filter><filter id="sticker" x="-10%" y="-20%" width="120%" height="150%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#24102F" flood-opacity="0.22"/></filter><filter id="barShadow" x="-5%" y="-60%" width="110%" height="200%"><feDropShadow dx="0" dy="-4" stdDeviation="8" flood-color="#24102F" flood-opacity="0.14"/></filter></defs>
<rect width="1440" height="1343" fill="#FFF3E2"/>
<rect x="0" y="0" width="1440" height="76" rx="0" fill="#4B1D63"/><g transform="translate(40 19) scale(1)"><rect x="0" y="2" width="34" height="34" rx="10" fill="#C9F46A" transform="rotate(-8 17 19)"/><g transform="translate(5 7) scale(1.0000)" fill="none" stroke="#24102F" color="#24102F" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></g><text class="d" x="46" y="29" font-size="26" font-weight="900" fill="#FFF3E2">Supersøker</text></g><g><rect x="1275" y="15" width="125" height="46" rx="23" fill="none" stroke="#FFF3E2" stroke-width="2.5"/><g transform="translate(1295.172 29) scale(0.7500)" fill="none" stroke="#FFF3E2" color="#FFF3E2" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h3.5"/><path d="M15.5 8l4 4-4 4"/><path d="M19.5 12H10"/></g><text class="t" x="1321.2" y="43.4" font-size="16" font-weight="700" fill="#FFF3E2">Logg ut</text></g><rect x="0" y="76" width="1440" height="44" rx="0" fill="#C9F46A"/><g transform="translate(48 87) scale(0.9167)" fill="none" stroke="#24102F" color="#24102F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v5.8c0 4.6-3.4 8.2-8 9.2-4.6-1-8-4.6-8-9.2V6z"/><path d="M8.3 12.2l2.6 2.6 4.8-5"/></g><text class="t" font-size="16" font-weight="600" fill="#24102F"><tspan x="84" y="102.8">Mock-modus er på – ingen tekst sendes til en språkmodell. Svarene er ferdiglagde eksempler.</tspan></text><rect x="200" y="156" width="336" height="60" rx="30" fill="#FFFDF9" stroke="#4B1D63" stroke-width="2"/><circle cx="232" cy="186" r="16" fill="#4B1D63"/><g transform="translate(222 176) scale(0.8333)" fill="none" stroke="#FFFDF9" color="#FFFDF9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></g><text class="t" x="260" y="192" font-size="18" font-weight="700" fill="#4B1D63">CV og annonse</text><text class="t" x="510" y="192" font-size="15" font-weight="700" fill="#5C4868" text-anchor="end">Ferdig</text><rect x="552" y="156" width="336" height="60" rx="30" fill="#FFFDF9" stroke="#4B1D63" stroke-width="2"/><circle cx="584" cy="186" r="16" fill="#4B1D63"/><g transform="translate(574 176) scale(0.8333)" fill="none" stroke="#FFFDF9" color="#FFFDF9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></g><text class="t" x="612" y="192" font-size="18" font-weight="700" fill="#4B1D63">Gap-analyse</text><text class="t" x="862" y="192" font-size="15" font-weight="700" fill="#5C4868" text-anchor="end">Ferdig</text><rect x="904" y="156" width="336" height="60" rx="30" fill="#4B1D63"/><circle cx="936" cy="186" r="16" fill="#C9F46A"/><text class="t" x="936" y="192" font-size="17" font-weight="800" fill="#24102F" text-anchor="middle">3</text><text class="t" x="964" y="192" font-size="18" font-weight="800" fill="#FFF3E2">Teksten</text><text class="t" x="1214" y="192" font-size="15" font-weight="700" fill="#C9F46A" text-anchor="end">Du er her</text><text class="d" font-size="52" font-weight="900" fill="#24102F"><tspan x="200" y="307.6">Søknadsutkastet ditt</tspan></text><text class="t" font-size="19" font-weight="400" fill="#24102F"><tspan x="200" y="356.2">Det er ditt brev: rediger så mye du vil, og sjekk at alt stemmer før du kopierer det.</tspan></text><rect x="200" y="401" width="620" height="788" rx="28" fill="#FFFDF9" filter="url(#lift)"/><rect x="200" y="401" width="620" height="788" rx="28" fill="#FFFDF9" stroke="#E8D8C4" stroke-width="1.5"/><circle cx="245" cy="443.4" r="17" fill="#C9F46A"/><g transform="translate(234 432.4) scale(0.9167)" fill="none" stroke="#24102F" color="#24102F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></g><text class="d" font-size="24" font-weight="900" fill="#24102F"><tspan x="272" y="450.7">Helt søknadsutkast</tspan></text><text class="t" font-size="17" font-weight="700" fill="#24102F"><tspan x="228" y="491.6">Søknadsbrev (du kan redigere)</tspan></text><rect x="228" y="507" width="564" height="654" rx="16" fill="#FFFDF9" stroke="#8A7894" stroke-width="2"/><text class="t" font-size="17" font-weight="400" fill="#24102F"><tspan x="246" y="539.1">Søknad på stilling som sommervikar i hjemmetjenesten</tspan><tspan x="246" y="565.1"></tspan><tspan x="246" y="591.1">Hei,</tspan><tspan x="246" y="617.1"></tspan><tspan x="246" y="643.1">Jeg søker på stillingen som sommervikar i hjemmetjenesten i</tspan><tspan x="246" y="669.1">Testvik kommune for perioden juni–august. Jeg studerer sykepleie</tspan><tspan x="246" y="695.1">på 2. år ved Høgskolen i Testvik, og jeg trives med å jobbe med</tspan><tspan x="246" y="721.1">mennesker.</tspan><tspan x="246" y="747.1"></tspan><tspan x="246" y="773.1">Som besøksvenn i Røde Kors besøkstjeneste besøker jeg en eldre</tspan><tspan x="246" y="799.1">dame hver uke for samtale og turer. Der har jeg lært å lytte og å</tspan><tspan x="246" y="825.1">gjøre besøket trygt og hyggelig for henne.</tspan><tspan x="246" y="851.1"></tspan><tspan x="246" y="877.1">I et gruppeprosjekt i helsefremmende arbeid planla jeg og fire</tspan><tspan x="246" y="903.1">medstudenter et kurs om fallforebygging for eldre. Jeg hadde</tspan><tspan x="246" y="929.1">ansvaret for å koordinere gruppens møter.</tspan><tspan x="246" y="955.1"></tspan><tspan x="246" y="981.1">Norsk er morsmålet mitt. Jeg har ikke førerkort ennå, men jeg har</tspan><tspan x="246" y="1007.1">oppkjøring i april.</tspan><tspan x="246" y="1033.1"></tspan><tspan x="246" y="1059.1">Jeg ser fram til å høre fra dere.</tspan><tspan x="246" y="1085.1"></tspan><tspan x="246" y="1111.1">Vennlig hilsen</tspan><tspan x="246" y="1137.1">Ida Testesen</tspan></text><rect x="844" y="401" width="396" height="635" rx="28" fill="#FFFDF9" filter="url(#lift)"/><rect x="844" y="401" width="396" height="635" rx="28" fill="#FFFDF9" stroke="#E8D8C4" stroke-width="1.5"/><circle cx="887" cy="441.4" r="17" fill="#C9F46A"/><g transform="translate(876 430.4) scale(0.9167)" fill="none" stroke="#24102F" color="#24102F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/></g><text class="d" font-size="24" font-weight="900" fill="#24102F"><tspan x="914" y="448.7">Teksten bygger på</tspan></text><text class="t" font-size="15" font-weight="400" fill="#5C4868"><tspan x="870" y="479.5">Grunnlag for den genererte teksten. Egne</tspan><tspan x="870" y="501.5">redigeringer kontrolleres ikke automatisk.</tspan></text><text class="t" font-size="15" font-weight="700" fill="#24102F"><tspan x="870" y="541.5">Stilling og arbeidsgiver</tspan></text><text class="t" font-size="17" font-weight="400" fill="#24102F"><tspan x="870" y="567.6">Sommervikar i hjemmetjenesten, Testvik</tspan><tspan x="870" y="592.6">kommune</tspan></text><text class="t" font-size="15" font-weight="700" fill="#24102F"><tspan x="870" y="633.5">Sitater fra CV-en</tspan></text><rect x="870" y="648" width="344" height="38" rx="12" fill="#C9F46A"/><g transform="translate(882 658) scale(0.7500)" fill="none" stroke="#24102F" color="#24102F" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h8.5L19 7.5V21H6z"/><path d="M14 3v5h5"/><path d="M9 13h7M9 16.5h5"/></g><text class="t" font-size="16" font-weight="700" fill="#24102F"><tspan x="910" y="671.8">«Norsk – morsmål»</tspan></text><rect x="870" y="694" width="344" height="60" rx="12" fill="#C9F46A"/><g transform="translate(882 715) scale(0.7500)" fill="none" stroke="#24102F" color="#24102F" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h8.5L19 7.5V21H6z"/><path d="M14 3v5h5"/><path d="M9 13h7M9 16.5h5"/></g><text class="t" font-size="16" font-weight="700" fill="#24102F"><tspan x="910" y="717.8">«Besøksvenn, Røde Kors</tspan><tspan x="910" y="739.8">besøkstjeneste»</tspan></text><rect x="870" y="762" width="344" height="60" rx="12" fill="#C9F46A"/><g transform="translate(882 783) scale(0.7500)" fill="none" stroke="#24102F" color="#24102F" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h8.5L19 7.5V21H6z"/><path d="M14 3v5h5"/><path d="M9 13h7M9 16.5h5"/></g><text class="t" font-size="16" font-weight="700" fill="#24102F"><tspan x="910" y="785.8">«Gruppeprosjekt i helsefremmende</tspan><tspan x="910" y="807.8">arbeid»</tspan></text><text class="t" font-size="15" font-weight="700" fill="#24102F"><tspan x="870" y="855.5">Ditt svar</tspan></text><rect x="870" y="870" width="344" height="140" rx="14" fill="#FFF0CC" stroke="#FFC247" stroke-width="2"/><text class="t" font-size="15" font-weight="700" fill="#24102F"><tspan x="886" y="897.5">Førerkort klasse B</tspan></text><text class="t" font-size="16" font-weight="400" fill="#24102F"><tspan x="886" y="922.3">«Jeg har ikke førerkort ennå. Jeg har</tspan><tspan x="886" y="945.3">oppkjøring i april.»</tspan></text><text class="t" font-size="14" font-weight="400" fill="#5C4868"><tspan x="886" y="972.2">Oppgitt av deg. Supersøker har ikke kontrollert</tspan><tspan x="886" y="992.2">det.</tspan></text><rect x="844" y="1056" width="396" height="135" rx="22" fill="#E9E1F2"/><g transform="translate(864 1076) scale(1.0000)" fill="none" stroke="#4B1D63" color="#4B1D63" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="10.5" width="14" height="10" rx="2.2"/><path d="M8.3 10.5V7.8a3.7 3.7 0 0 1 7.4 0v2.7"/></g><text class="t" font-size="17" font-weight="700" fill="#24102F"><tspan x="904" y="1092.1">Slettes når du logger ut</tspan></text><text class="t" font-size="16" font-weight="400" fill="#24102F"><tspan x="904" y="1118.3">Teksten tas vare på mens du er innlogget,</tspan><tspan x="904" y="1141.3">og slettes ved utlogging. Kopier den før du</tspan><tspan x="904" y="1164.3">logger ut.</tspan></text><rect x="0" y="1239" width="1440" height="104" fill="#FFFDF9" filter="url(#barShadow)"/><rect x="0" y="1239" width="1440" height="104" fill="#FFFDF9"/><rect x="0" y="1239" width="1440" height="2" fill="#E8D8C4"/><g><rect x="1052" y="1261" width="188" height="60" rx="30" fill="#4B1D63" filter="url(#lift)"/><rect x="1052" y="1261" width="188" height="60" rx="30" fill="#4B1D63"/><g transform="translate(1079.989 1281) scale(0.8333)" fill="none" stroke="#FFFDF9" color="#FFFDF9" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="8.5" y="8.5" width="12" height="12" rx="2"/><path d="M15.5 8.5V5a1.5 1.5 0 0 0-1.5-1.5H5A1.5 1.5 0 0 0 3.5 5v9A1.5 1.5 0 0 0 5 15.5h3.5"/></g><text class="t" x="1108.0" y="1297.1" font-size="18" font-weight="700" fill="#FFFDF9">Kopier tekst</text><rect x="1047" y="1256" width="198" height="70" rx="35" fill="none" stroke="#24102F" stroke-width="3"/></g><g><rect x="200" y="1261" width="302" height="60" rx="30" fill="#FFFDF9" stroke="#4B1D63" stroke-width="2.5"/><g transform="translate(227.947 1281) scale(0.8333)" fill="none" stroke="#4B1D63" color="#4B1D63" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19.5 12H5"/><path d="M11 6l-6 6 6 6"/></g><text class="t" x="255.9" y="1297.1" font-size="18" font-weight="700" fill="#4B1D63">Endre svar eller tekstvalg</text></g><rect x="750.4" y="1259" width="281.6" height="64" rx="32" fill="#E3F8C4"/><g transform="translate(766.4 1279) scale(1.0000)" fill="none" stroke="#4B1D63" color="#4B1D63" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5"/><path d="M7.8 12.4l3 3 5.6-6"/></g><text class="t" font-size="16" font-weight="600" fill="#24102F"><tspan x="800.4" y="1284.8">Kopiert. Lim inn teksten der</tspan><tspan x="800.4" y="1306.8">du skriver søknaden.</tspan></text>
</svg>
