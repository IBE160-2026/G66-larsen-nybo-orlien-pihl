<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="390" height="2241" viewBox="0 0 390 2241" role="img" aria-labelledby="tittel beskrivelse" xml:lang="nb">
<title id="tittel">Supersøker – Søknadsutkast på mobil</title>
<desc id="beskrivelse">Søknadsutkastet på 390 px: redigerbart brev, melding om sletting ved utlogging, Teksten bygger på under brevet, og handlingslinjen med bekreftelsen Kopiert og knappen Kopier tekst.</desc>
<style>.t{font-family:'Segoe UI Variable Text','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Roboto,Arial,sans-serif}.d{font-family:'Segoe UI Variable Display','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Roboto,Arial,sans-serif}</style>
<defs><filter id="lift" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#24102F" flood-opacity="0.13"/></filter><filter id="sticker" x="-10%" y="-20%" width="120%" height="150%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#24102F" flood-opacity="0.22"/></filter><filter id="barShadow" x="-5%" y="-60%" width="110%" height="200%"><feDropShadow dx="0" dy="-4" stdDeviation="8" flood-color="#24102F" flood-opacity="0.14"/></filter></defs>
<rect width="390" height="2241" fill="#FFF3E2"/>
<rect x="0" y="0" width="390" height="64" rx="0" fill="#4B1D63"/><g transform="translate(18 13) scale(0.9)"><rect x="0" y="2" width="34" height="34" rx="10" fill="#C9F46A" transform="rotate(-8 17 19)"/><g transform="translate(5 7) scale(1.0000)" fill="none" stroke="#24102F" color="#24102F" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></g><text class="d" x="46" y="29" font-size="26" font-weight="900" fill="#FFF3E2">Supersøker</text></g><g><rect x="266" y="10" width="108" height="44" rx="22" fill="none" stroke="#FFF3E2" stroke-width="2.5"/><g transform="translate(280.005 23.5) scale(0.7083)" fill="none" stroke="#FFF3E2" color="#FFF3E2" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h3.5"/><path d="M15.5 8l4 4-4 4"/><path d="M19.5 12H10"/></g><text class="t" x="305.0" y="37.1" font-size="15" font-weight="700" fill="#FFF3E2">Logg ut</text></g><rect x="0" y="64" width="390" height="60" rx="0" fill="#C9F46A"/><g transform="translate(18 83) scale(0.9167)" fill="none" stroke="#24102F" color="#24102F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v5.8c0 4.6-3.4 8.2-8 9.2-4.6-1-8-4.6-8-9.2V6z"/><path d="M8.3 12.2l2.6 2.6 4.8-5"/></g><text class="t" font-size="14" font-weight="600" fill="#24102F"><tspan x="50" y="88.2">Mock-modus er på – ingen tekst sendes til en</tspan><tspan x="50" y="108.2">språkmodell.</tspan></text><text class="t" font-size="14" font-weight="700" fill="#5C4868"><tspan x="20" y="162.2">Steg 3 av 3</tspan></text><text class="d" font-size="20" font-weight="800" fill="#24102F"><tspan x="20" y="188.5">Teksten</tspan></text><rect x="20" y="206" width="112.66666666666667" height="10" rx="5" fill="#4B1D63"/><rect x="138.66666666666669" y="206" width="112.66666666666667" height="10" rx="5" fill="#4B1D63"/><rect x="257.33333333333337" y="206" width="112.66666666666667" height="10" rx="5" fill="#4B1D63"/><circle cx="361.00000000000006" cy="211" r="9" fill="#C9F46A" stroke="#4B1D63" stroke-width="3"/><text class="d" font-size="32" font-weight="900" fill="#24102F"><tspan x="20" y="277.1">Søknadsutkastet ditt</tspan></text><text class="t" font-size="16" font-weight="400" fill="#24102F"><tspan x="20" y="317.8">Det er ditt brev: rediger så mye du vil, og sjekk</tspan><tspan x="20" y="341.8">at alt stemmer.</tspan></text><text class="t" font-size="17" font-weight="700" fill="#24102F"><tspan x="20" y="390.6">Søknadsbrev (du kan redigere)</tspan></text><rect x="20" y="406" width="350" height="798" rx="16" fill="#FFFDF9" stroke="#8A7894" stroke-width="2"/><text class="t" font-size="16" font-weight="400" fill="#24102F"><tspan x="38" y="436.8">Søknad på stilling som sommervikar i</tspan><tspan x="38" y="460.8">hjemmetjenesten</tspan><tspan x="38" y="484.8"></tspan><tspan x="38" y="508.8">Hei,</tspan><tspan x="38" y="532.8"></tspan><tspan x="38" y="556.8">Jeg søker på stillingen som sommervikar i</tspan><tspan x="38" y="580.8">hjemmetjenesten i Testvik kommune for</tspan><tspan x="38" y="604.8">perioden juni–august. Jeg studerer</tspan><tspan x="38" y="628.8">sykepleie på 2. år ved Høgskolen i</tspan><tspan x="38" y="652.8">Testvik, og jeg trives med å jobbe med</tspan><tspan x="38" y="676.8">mennesker.</tspan><tspan x="38" y="700.8"></tspan><tspan x="38" y="724.8">Som besøksvenn i Røde Kors</tspan><tspan x="38" y="748.8">besøkstjeneste besøker jeg en eldre</tspan><tspan x="38" y="772.8">dame hver uke for samtale og turer. Der</tspan><tspan x="38" y="796.8">har jeg lært å lytte og å gjøre besøket</tspan><tspan x="38" y="820.8">trygt og hyggelig for henne.</tspan><tspan x="38" y="844.8"></tspan><tspan x="38" y="868.8">I et gruppeprosjekt i helsefremmende</tspan><tspan x="38" y="892.8">arbeid planla jeg og fire medstudenter et</tspan><tspan x="38" y="916.8">kurs om fallforebygging for eldre. Jeg</tspan><tspan x="38" y="940.8">hadde ansvaret for å koordinere gruppens</tspan><tspan x="38" y="964.8">møter.</tspan><tspan x="38" y="988.8"></tspan><tspan x="38" y="1012.8">Norsk er morsmålet mitt. Jeg har ikke</tspan><tspan x="38" y="1036.8">førerkort ennå, men jeg har oppkjøring i</tspan><tspan x="38" y="1060.8">april.</tspan><tspan x="38" y="1084.8"></tspan><tspan x="38" y="1108.8">Jeg ser fram til å høre fra dere.</tspan><tspan x="38" y="1132.8"></tspan><tspan x="38" y="1156.8">Vennlig hilsen</tspan><tspan x="38" y="1180.8">Ida Testesen</tspan></text><rect x="20" y="1224" width="350" height="101" rx="22" fill="#E9E1F2"/><g transform="translate(36 1240) scale(0.9167)" fill="none" stroke="#4B1D63" color="#4B1D63" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="10.5" width="14" height="10" rx="2.2"/><path d="M8.3 10.5V7.8a3.7 3.7 0 0 1 7.4 0v2.7"/></g><text class="t" font-size="16" font-weight="700" fill="#24102F"><tspan x="74" y="1255.3">Slettes når du logger ut</tspan></text><text class="t" font-size="15" font-weight="400" fill="#24102F"><tspan x="74" y="1280.5">Teksten tas vare på mens du er</tspan><tspan x="74" y="1302.5">innlogget. Kopier den før du logger ut.</tspan></text><rect x="20" y="1349" width="350" height="624" rx="28" fill="#FFFDF9" filter="url(#lift)"/><rect x="20" y="1349" width="350" height="624" rx="28" fill="#FFFDF9" stroke="#E8D8C4" stroke-width="1.5"/><circle cx="59" cy="1384.2" r="17" fill="#C9F46A"/><g transform="translate(48 1373.2) scale(0.9167)" fill="none" stroke="#24102F" color="#24102F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/></g><text class="d" font-size="22" font-weight="900" fill="#24102F"><tspan x="86" y="1390.6">Teksten bygger på</tspan></text><text class="t" font-size="15" font-weight="400" fill="#5C4868"><tspan x="42" y="1420.5">Grunnlag for den genererte teksten. Egne</tspan><tspan x="42" y="1442.5">redigeringer kontrolleres ikke automatisk.</tspan></text><text class="t" font-size="15" font-weight="700" fill="#24102F"><tspan x="42" y="1482.5">Stilling og arbeidsgiver</tspan></text><text class="t" font-size="17" font-weight="400" fill="#24102F"><tspan x="42" y="1508.6">Sommervikar i hjemmetjenesten,</tspan><tspan x="42" y="1533.6">Testvik kommune</tspan></text><text class="t" font-size="15" font-weight="700" fill="#24102F"><tspan x="42" y="1574.5">Sitater fra CV-en</tspan></text><rect x="42" y="1589" width="306" height="38" rx="12" fill="#C9F46A"/><g transform="translate(54 1599) scale(0.7500)" fill="none" stroke="#24102F" color="#24102F" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h8.5L19 7.5V21H6z"/><path d="M14 3v5h5"/><path d="M9 13h7M9 16.5h5"/></g><text class="t" font-size="16" font-weight="700" fill="#24102F"><tspan x="82" y="1612.8">«Norsk – morsmål»</tspan></text><rect x="42" y="1635" width="306" height="60" rx="12" fill="#C9F46A"/><g transform="translate(54 1656) scale(0.7500)" fill="none" stroke="#24102F" color="#24102F" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h8.5L19 7.5V21H6z"/><path d="M14 3v5h5"/><path d="M9 13h7M9 16.5h5"/></g><text class="t" font-size="16" font-weight="700" fill="#24102F"><tspan x="82" y="1658.8">«Besøksvenn, Røde Kors</tspan><tspan x="82" y="1680.8">besøkstjeneste»</tspan></text><rect x="42" y="1703" width="306" height="60" rx="12" fill="#C9F46A"/><g transform="translate(54 1724) scale(0.7500)" fill="none" stroke="#24102F" color="#24102F" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h8.5L19 7.5V21H6z"/><path d="M14 3v5h5"/><path d="M9 13h7M9 16.5h5"/></g><text class="t" font-size="16" font-weight="700" fill="#24102F"><tspan x="82" y="1726.8">«Gruppeprosjekt i</tspan><tspan x="82" y="1748.8">helsefremmende arbeid»</tspan></text><text class="t" font-size="15" font-weight="700" fill="#24102F"><tspan x="42" y="1796.5">Ditt svar</tspan></text><rect x="42" y="1811" width="306" height="140" rx="14" fill="#FFF0CC" stroke="#FFC247" stroke-width="2"/><text class="t" font-size="15" font-weight="700" fill="#24102F"><tspan x="58" y="1838.5">Førerkort klasse B</tspan></text><text class="t" font-size="16" font-weight="400" fill="#24102F"><tspan x="58" y="1863.3">«Jeg har ikke førerkort ennå. Jeg har</tspan><tspan x="58" y="1886.3">oppkjøring i april.»</tspan></text><text class="t" font-size="14" font-weight="400" fill="#5C4868"><tspan x="58" y="1913.2">Oppgitt av deg. Supersøker har ikke</tspan><tspan x="58" y="1933.2">kontrollert det.</tspan></text><g><rect x="20" y="1997" width="350" height="52" rx="26" fill="#FFFDF9" stroke="#4B1D63" stroke-width="2.5"/><g transform="translate(85.064 2014) scale(0.7500)" fill="none" stroke="#4B1D63" color="#4B1D63" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19.5 12H5"/><path d="M11 6l-6 6 6 6"/></g><text class="t" x="111.1" y="2028.4" font-size="16" font-weight="700" fill="#4B1D63">Endre svar eller tekstvalg</text></g><rect x="0" y="2081" width="390" height="160" fill="#FFFDF9" filter="url(#barShadow)"/><rect x="0" y="2081" width="390" height="160" fill="#FFFDF9"/><rect x="0" y="2081" width="390" height="2" fill="#E8D8C4"/><rect x="20" y="2101" width="350" height="56" rx="18" fill="#E3F8C4"/><g transform="translate(30 2119) scale(0.8333)" fill="none" stroke="#4B1D63" color="#4B1D63" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5"/><path d="M7.8 12.4l3 3 5.6-6"/></g><text class="t" font-size="15" font-weight="600" fill="#24102F"><tspan x="58" y="2123.5">Kopiert. Lim inn teksten der du skriver</tspan><tspan x="58" y="2143.5">søknaden.</tspan></text><g><rect x="20" y="2167" width="350" height="58" rx="29" fill="#4B1D63" filter="url(#lift)"/><rect x="20" y="2167" width="350" height="58" rx="29" fill="#4B1D63"/><g transform="translate(128.989 2186) scale(0.8333)" fill="none" stroke="#FFFDF9" color="#FFFDF9" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="8.5" y="8.5" width="12" height="12" rx="2"/><path d="M15.5 8.5V5a1.5 1.5 0 0 0-1.5-1.5H5A1.5 1.5 0 0 0 3.5 5v9A1.5 1.5 0 0 0 5 15.5h3.5"/></g><text class="t" x="157.0" y="2202.1" font-size="18" font-weight="700" fill="#FFFDF9">Kopier tekst</text><rect x="15" y="2162" width="360" height="68" rx="34" fill="none" stroke="#24102F" stroke-width="3"/></g>
</svg>
