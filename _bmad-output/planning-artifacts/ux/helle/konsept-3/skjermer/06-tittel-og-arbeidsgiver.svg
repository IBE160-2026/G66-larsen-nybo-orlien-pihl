<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="949" viewBox="0 0 1440 949" role="img" aria-labelledby="tittel beskrivelse" xml:lang="nb">
<title id="tittel">Supersøker – Stillingstittel og arbeidsgiver</title>
<desc id="beskrivelse">Før gap-analysen: stillingstittelen som ble funnet vises i et redigerbart felt, mens arbeidsgiver ikke ble funnet og etterspørres i et obligatorisk felt med forklaring og fokus.</desc>
<style>.t{font-family:'Segoe UI Variable Text','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Roboto,Arial,sans-serif}.d{font-family:'Segoe UI Variable Display','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Roboto,Arial,sans-serif}</style>
<defs><filter id="lift" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#24102F" flood-opacity="0.13"/></filter><filter id="sticker" x="-10%" y="-20%" width="120%" height="150%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#24102F" flood-opacity="0.22"/></filter><filter id="barShadow" x="-5%" y="-60%" width="110%" height="200%"><feDropShadow dx="0" dy="-4" stdDeviation="8" flood-color="#24102F" flood-opacity="0.14"/></filter></defs>
<rect width="1440" height="949" fill="#FFF3E2"/>
<rect x="0" y="0" width="1440" height="76" rx="0" fill="#4B1D63"/><g transform="translate(40 19) scale(1)"><rect x="0" y="2" width="34" height="34" rx="10" fill="#C9F46A" transform="rotate(-8 17 19)"/><g transform="translate(5 7) scale(1.0000)" fill="none" stroke="#24102F" color="#24102F" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></g><text class="d" x="46" y="29" font-size="26" font-weight="900" fill="#FFF3E2">Supersøker</text></g><g><rect x="1275" y="15" width="125" height="46" rx="23" fill="none" stroke="#FFF3E2" stroke-width="2.5"/><g transform="translate(1295.172 29) scale(0.7500)" fill="none" stroke="#FFF3E2" color="#FFF3E2" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h3.5"/><path d="M15.5 8l4 4-4 4"/><path d="M19.5 12H10"/></g><text class="t" x="1321.2" y="43.4" font-size="16" font-weight="700" fill="#FFF3E2">Logg ut</text></g><rect x="0" y="76" width="1440" height="44" rx="0" fill="#C9F46A"/><g transform="translate(48 87) scale(0.9167)" fill="none" stroke="#24102F" color="#24102F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v5.8c0 4.6-3.4 8.2-8 9.2-4.6-1-8-4.6-8-9.2V6z"/><path d="M8.3 12.2l2.6 2.6 4.8-5"/></g><text class="t" font-size="16" font-weight="600" fill="#24102F"><tspan x="84" y="102.8">Mock-modus er på – ingen tekst sendes til en språkmodell. Svarene er ferdiglagde eksempler.</tspan></text><rect x="200" y="156" width="336" height="60" rx="30" fill="#4B1D63"/><circle cx="232" cy="186" r="16" fill="#C9F46A"/><text class="t" x="232" y="192" font-size="17" font-weight="800" fill="#24102F" text-anchor="middle">1</text><text class="t" x="260" y="192" font-size="18" font-weight="800" fill="#FFF3E2">CV og annonse</text><text class="t" x="510" y="192" font-size="15" font-weight="700" fill="#C9F46A" text-anchor="end">Du er her</text><rect x="552" y="156" width="336" height="60" rx="30" fill="#FFF3E2" stroke="#8A7894" stroke-width="2" stroke-dasharray="6 5"/><circle cx="584" cy="186" r="15" fill="none" stroke="#8A7894" stroke-width="2"/><text class="t" x="584" y="192" font-size="17" font-weight="700" fill="#5C4868" text-anchor="middle">2</text><text class="t" x="612" y="192" font-size="18" font-weight="700" fill="#5C4868">Gap-analyse</text><rect x="904" y="156" width="336" height="60" rx="30" fill="#FFF3E2" stroke="#8A7894" stroke-width="2" stroke-dasharray="6 5"/><circle cx="936" cy="186" r="15" fill="none" stroke="#8A7894" stroke-width="2"/><text class="t" x="936" y="192" font-size="17" font-weight="700" fill="#5C4868" text-anchor="middle">3</text><text class="t" x="964" y="192" font-size="18" font-weight="700" fill="#5C4868">Teksten</text><text class="d" font-size="52" font-weight="900" fill="#24102F"><tspan x="200" y="307.6">Hvem søker du hos?</tspan></text><text class="t" font-size="19" font-weight="400" fill="#24102F"><tspan x="200" y="356.2">Vi bruker stillingstittel og arbeidsgiver i overskriften på gap-analysen og i teksten. Vi</tspan><tspan x="200" y="385.2">gjetter aldri – rett det som ikke stemmer.</tspan></text><rect x="200" y="430" width="508" height="367" rx="28" fill="#FFFDF9" filter="url(#lift)"/><rect x="200" y="430" width="508" height="367" rx="28" fill="#FFFDF9" stroke="#E8D8C4" stroke-width="1.5"/><path d="M200 494 V458 a28 28 0 0 1 28 -28 H680 a28 28 0 0 1 28 28 V494 z" fill="#E3F8C4"/><rect x="222" y="444" width="204.24" height="36" rx="18" fill="#FFFDF9" stroke="#24102F" stroke-width="2"/><g transform="translate(234 451) scale(0.9167)" fill="none" stroke="#4B1D63" color="#4B1D63" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5"/><path d="M7.8 12.4l3 3 5.6-6"/></g><text class="t" x="264" y="467.6" font-size="16" font-weight="700" fill="#24102F">Funnet i annonsen</text><text class="d" font-size="26" font-weight="900" fill="#24102F"><tspan x="228" y="542.8">Stillingstittel</tspan></text><text class="t" font-size="17" font-weight="400" fill="#24102F"><tspan x="228" y="577.6">Vi fant denne i annonsen.</tspan></text><text class="t" font-size="17" font-weight="700" fill="#24102F"><tspan x="228" y="620.6">Stillingstittel</tspan></text><rect x="228" y="636" width="452" height="56" rx="16" fill="#FFFDF9" stroke="#8A7894" stroke-width="2"/><text class="t" font-size="17" font-weight="400" fill="#24102F"><tspan x="246" y="668.1">Sommervikar i hjemmetjenesten</tspan></text><text class="t" font-size="15" font-weight="400" fill="#5C4868"><tspan x="228" y="715.5">Rett hvis tittelen ikke stemmer.</tspan></text><rect x="732" y="430" width="508" height="367" rx="28" fill="#FFFDF9" filter="url(#lift)"/><rect x="732" y="430" width="508" height="367" rx="28" fill="#FFFDF9" stroke="#E8D8C4" stroke-width="1.5"/><path d="M732 494 V458 a28 28 0 0 1 28 -28 H1212 a28 28 0 0 1 28 28 V494 z" fill="#FFC247"/><rect x="754" y="444" width="146.464" height="36" rx="18" fill="#FFFDF9" stroke="#24102F" stroke-width="2"/><g transform="translate(766 451) scale(0.9167)" fill="none" stroke="#4B1D63" color="#4B1D63" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5" stroke-dasharray="3.2 2.6"/><path d="M9.4 9.6a2.6 2.6 0 1 1 3.7 2.4c-.8.4-1.1.9-1.1 1.7v.6"/><circle cx="12" cy="17.2" r="1.1" fill="currentColor" stroke="none"/></g><text class="t" x="796" y="467.6" font-size="16" font-weight="700" fill="#24102F">Ikke funnet</text><text class="d" font-size="26" font-weight="900" fill="#24102F"><tspan x="760" y="542.8">Arbeidsgiver</tspan></text><text class="t" font-size="17" font-weight="400" fill="#24102F"><tspan x="760" y="577.6">Vi fant ikke navnet på arbeidsgiveren i annonsen. Skriv</tspan><tspan x="760" y="602.6">det inn, så blir overskriften og søknaden riktig.</tspan></text><text class="t" font-size="17" font-weight="700" fill="#24102F"><tspan x="760" y="645.6">Arbeidsgiver (må fylles ut)</tspan></text><rect x="760" y="661" width="452" height="56" rx="16" fill="#FFFDF9" stroke="#24102F" stroke-width="2"/><rect x="755" y="656" width="462" height="66" rx="21" fill="none" stroke="#24102F" stroke-width="3"/><rect x="778" y="677" width="2" height="20" fill="#24102F"/><text class="t" font-size="15" font-weight="400" fill="#5C4868"><tspan x="760" y="740.5">Skriv navnet slik det står i annonsen, for eksempel kommunen</tspan><tspan x="760" y="762.5">eller bedriften.</tspan></text><rect x="0" y="845" width="1440" height="104" fill="#FFFDF9" filter="url(#barShadow)"/><rect x="0" y="845" width="1440" height="104" fill="#FFFDF9"/><rect x="0" y="845" width="1440" height="2" fill="#E8D8C4"/><g><rect x="1007" y="867" width="233" height="60" rx="30" fill="#4B1D63" filter="url(#lift)"/><rect x="1007" y="867" width="233" height="60" rx="30" fill="#4B1D63"/><text class="t" x="1035.0" y="903.1" font-size="18" font-weight="700" fill="#FFFDF9">Analyser kravene</text><g transform="translate(1194.038 887) scale(0.8333)" fill="none" stroke="#FFFDF9" color="#FFFDF9" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12h14.5"/><path d="M13 6l6 6-6 6"/></g></g><g><rect x="200" y="867" width="303" height="60" rx="30" fill="#FFFDF9" stroke="#4B1D63" stroke-width="2.5"/><g transform="translate(227.97 887) scale(0.8333)" fill="none" stroke="#4B1D63" color="#4B1D63" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19.5 12H5"/><path d="M11 6l-6 6 6 6"/></g><text class="t" x="256.0" y="903.1" font-size="18" font-weight="700" fill="#4B1D63">Tilbake til CV og annonse</text></g>
</svg>
