<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1199" viewBox="0 0 1440 1199" role="img" aria-labelledby="tittel beskrivelse" xml:lang="nb">
<title id="tittel">Supersøker – Steg 1, feiltilstander</title>
<desc id="beskrivelse">To feil i steg 1: filen cv-ida-skannet.pdf kunne ikke leses, med tilbud om ny fil eller innliming, og tomt annonsefelt merket ugyldig med melding ved feltet og fokus der.</desc>
<style>.t{font-family:'Segoe UI Variable Text','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Roboto,Arial,sans-serif}.d{font-family:'Segoe UI Variable Display','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Roboto,Arial,sans-serif}</style>
<defs><filter id="lift" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#24102F" flood-opacity="0.13"/></filter><filter id="sticker" x="-10%" y="-20%" width="120%" height="150%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#24102F" flood-opacity="0.22"/></filter><filter id="barShadow" x="-5%" y="-60%" width="110%" height="200%"><feDropShadow dx="0" dy="-4" stdDeviation="8" flood-color="#24102F" flood-opacity="0.14"/></filter></defs>
<rect width="1440" height="1199" fill="#FFF3E2"/>
<rect x="0" y="0" width="1440" height="76" rx="0" fill="#4B1D63"/><g transform="translate(40 19) scale(1)"><rect x="0" y="2" width="34" height="34" rx="10" fill="#C9F46A" transform="rotate(-8 17 19)"/><g transform="translate(5 7) scale(1.0000)" fill="none" stroke="#24102F" color="#24102F" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></g><text class="d" x="46" y="29" font-size="26" font-weight="900" fill="#FFF3E2">Supersøker</text></g><g><rect x="1275" y="15" width="125" height="46" rx="23" fill="none" stroke="#FFF3E2" stroke-width="2.5"/><g transform="translate(1295.172 29) scale(0.7500)" fill="none" stroke="#FFF3E2" color="#FFF3E2" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h3.5"/><path d="M15.5 8l4 4-4 4"/><path d="M19.5 12H10"/></g><text class="t" x="1321.2" y="43.4" font-size="16" font-weight="700" fill="#FFF3E2">Logg ut</text></g><rect x="0" y="76" width="1440" height="44" rx="0" fill="#C9F46A"/><g transform="translate(48 87) scale(0.9167)" fill="none" stroke="#24102F" color="#24102F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v5.8c0 4.6-3.4 8.2-8 9.2-4.6-1-8-4.6-8-9.2V6z"/><path d="M8.3 12.2l2.6 2.6 4.8-5"/></g><text class="t" font-size="16" font-weight="600" fill="#24102F"><tspan x="84" y="102.8">Mock-modus er på – ingen tekst sendes til en språkmodell. Svarene er ferdiglagde eksempler.</tspan></text><rect x="200" y="156" width="336" height="60" rx="30" fill="#4B1D63"/><circle cx="232" cy="186" r="16" fill="#C9F46A"/><text class="t" x="232" y="192" font-size="17" font-weight="800" fill="#24102F" text-anchor="middle">1</text><text class="t" x="260" y="192" font-size="18" font-weight="800" fill="#FFF3E2">CV og annonse</text><text class="t" x="510" y="192" font-size="15" font-weight="700" fill="#C9F46A" text-anchor="end">Du er her</text><rect x="552" y="156" width="336" height="60" rx="30" fill="#FFF3E2" stroke="#8A7894" stroke-width="2" stroke-dasharray="6 5"/><circle cx="584" cy="186" r="15" fill="none" stroke="#8A7894" stroke-width="2"/><text class="t" x="584" y="192" font-size="17" font-weight="700" fill="#5C4868" text-anchor="middle">2</text><text class="t" x="612" y="192" font-size="18" font-weight="700" fill="#5C4868">Gap-analyse</text><rect x="904" y="156" width="336" height="60" rx="30" fill="#FFF3E2" stroke="#8A7894" stroke-width="2" stroke-dasharray="6 5"/><circle cx="936" cy="186" r="15" fill="none" stroke="#8A7894" stroke-width="2"/><text class="t" x="936" y="192" font-size="17" font-weight="700" fill="#5C4868" text-anchor="middle">3</text><text class="t" x="964" y="192" font-size="18" font-weight="700" fill="#5C4868">Teksten</text><text class="d" font-size="52" font-weight="900" fill="#24102F"><tspan x="200" y="307.6">CV-en din og annonsen</tspan></text><text class="t" font-size="19" font-weight="400" fill="#24102F"><tspan x="200" y="356.2">Lim inn eller last opp CV-en, og lim inn stillingsannonsen. Du ser teksten vi leste, og</tspan><tspan x="200" y="385.2">kan rette den før analysen.</tspan></text><rect x="200" y="430" width="508" height="617" rx="28" fill="#FFFDF9" filter="url(#lift)"/><rect x="200" y="430" width="508" height="617" rx="28" fill="#FFFDF9" stroke="#E8D8C4" stroke-width="1.5"/><rect x="732" y="430" width="508" height="617" rx="28" fill="#FFFDF9" filter="url(#lift)"/><rect x="732" y="430" width="508" height="617" rx="28" fill="#FFFDF9" stroke="#E8D8C4" stroke-width="1.5"/><circle cx="245" cy="473.6" r="17" fill="#C9F46A"/><g transform="translate(234 462.6) scale(0.9167)" fill="none" stroke="#24102F" color="#24102F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h8.5L19 7.5V21H6z"/><path d="M14 3v5h5"/><path d="M9 13h7M9 16.5h5"/></g><text class="d" font-size="26" font-weight="900" fill="#24102F"><tspan x="272" y="481.3">Din CV</tspan></text><rect x="228" y="507" width="452" height="52" rx="26" fill="#F6E6CF" stroke="#8A7894" stroke-width="2"/><g transform="translate(279.656 522) scale(0.8333)" fill="none" stroke="#24102F" color="#24102F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l1.2-4.6L15.6 5l3.4 3.4L8.6 18.8z"/><path d="M13.6 7l3.4 3.4"/></g><text class="t" x="307.656" y="538.5" font-size="16" font-weight="700" fill="#24102F">Lim inn tekst</text><rect x="454" y="511" width="222" height="44" rx="22" fill="#4B1D63"/><g transform="translate(508.328 522) scale(0.8333)" fill="none" stroke="#FFFDF9" color="#FFFDF9" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15.5V4"/><path d="M7 8.8L12 4l5 4.8"/><path d="M4 15v3.5A1.5 1.5 0 0 0 5.5 20h13a1.5 1.5 0 0 0 1.5-1.5V15"/></g><text class="t" x="536.328" y="538.5" font-size="16" font-weight="700" fill="#FFFDF9">Last opp fil</text><rect x="228" y="581" width="452" height="195" rx="22" fill="#FDE7E4" stroke="#B3261E" stroke-width="2"/><g transform="translate(246 599) scale(1.0000)" fill="none" stroke="#B3261E" color="#B3261E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.6L21.6 20H2.4z"/><path d="M12 9.8v4.6"/><circle cx="12" cy="17.1" r="1.1" fill="currentColor" stroke="none"/></g><text class="t" font-size="17" font-weight="700" fill="#24102F"><tspan x="286" y="615.1">Vi kunne ikke lese filen cv-ida-skannet.pdf</tspan></text><text class="t" font-size="16" font-weight="400" fill="#24102F"><tspan x="286" y="641.3">Den ser ut til å være skannet som bilde, så vi finner</tspan><tspan x="286" y="664.3">ingen tekst i den. Velg en TXT-fil eller tekstbasert</tspan><tspan x="286" y="687.3">PDF, eller lim inn teksten.</tspan></text><g><rect x="286" y="710" width="189" height="48" rx="24" fill="#FFFDF9" stroke="#4B1D63" stroke-width="2.5"/><g transform="translate(303.924 725) scale(0.7500)" fill="none" stroke="#4B1D63" color="#4B1D63" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15.5V4"/><path d="M7 8.8L12 4l5 4.8"/><path d="M4 15v3.5A1.5 1.5 0 0 0 5.5 20h13a1.5 1.5 0 0 0 1.5-1.5V15"/></g><text class="t" x="329.9" y="739.4" font-size="16" font-weight="700" fill="#4B1D63">Velg en annen fil</text></g><g><rect x="489" y="710" width="167" height="48" rx="24" fill="none"/><text class="t" x="492.9" y="739.4" font-size="16" font-weight="700" fill="#4B1D63">Lim inn tekst i stedet</text><rect x="492.9" y="743.4" width="159" height="2" fill="#4B1D63"/></g><text class="t" font-size="17" font-weight="700" fill="#24102F"><tspan x="228" y="813.6">CV-tekst</tspan></text><rect x="228" y="829" width="452" height="160" rx="16" fill="#FFFDF9" stroke="#8A7894" stroke-width="2"/><text class="t" font-size="17" font-weight="400" fill="#5C4868"><tspan x="246" y="861.1">Ingen CV-tekst ennå.</tspan></text><text class="t" font-size="15" font-weight="400" fill="#5C4868" text-anchor="end"><tspan x="680" y="1012.5">0 / 10 000 tegn</tspan></text><text class="t" font-size="15" font-weight="400" fill="#5C4868"><tspan x="228" y="1012.5">Fil: TXT eller tekstbasert PDF, høyst 2 MB.</tspan></text><circle cx="777" cy="473.6" r="17" fill="#C9F46A"/><g transform="translate(766 462.6) scale(0.9167)" fill="none" stroke="#24102F" color="#24102F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></g><text class="d" font-size="26" font-weight="900" fill="#24102F"><tspan x="804" y="481.3">Stillingsannonsen</tspan></text><text class="t" font-size="17" font-weight="700" fill="#24102F"><tspan x="760" y="524.6">Stillingsannonse</tspan></text><text class="t" font-size="15" font-weight="400" fill="#5C4868"><tspan x="760" y="549.5">Ta med stillingstittel og navnet på arbeidsgiveren.</tspan></text><rect x="760" y="564" width="452" height="300" rx="16" fill="#FFFDF9" stroke="#B3261E" stroke-width="3"/><rect x="755" y="559" width="462" height="310" rx="21" fill="none" stroke="#24102F" stroke-width="3"/><text class="t" font-size="17" font-weight="400" fill="#5C4868"><tspan x="778" y="596.1">Lim inn hele annonseteksten her.</tspan></text><g transform="translate(760 874) scale(0.9167)" fill="none" stroke="#B3261E" color="#B3261E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.6L21.6 20H2.4z"/><path d="M12 9.8v4.6"/><circle cx="12" cy="17.1" r="1.1" fill="currentColor" stroke="none"/></g><text class="t" font-size="16" font-weight="600" fill="#B3261E"><tspan x="790" y="890.3">Lim inn stillingsannonsen. Feltet kan ikke være tomt</tspan><tspan x="790" y="913.3">når du skal analysere kravene.</tspan></text><text class="t" font-size="15" font-weight="400" fill="#5C4868" text-anchor="end"><tspan x="1212" y="943.5">0 / 10 000 tegn</tspan></text><rect x="0" y="1095" width="1440" height="104" fill="#FFFDF9" filter="url(#barShadow)"/><rect x="0" y="1095" width="1440" height="104" fill="#FFFDF9"/><rect x="0" y="1095" width="1440" height="2" fill="#E8D8C4"/><g><rect x="1007" y="1117" width="233" height="60" rx="30" fill="#4B1D63" filter="url(#lift)"/><rect x="1007" y="1117" width="233" height="60" rx="30" fill="#4B1D63"/><text class="t" x="1035.0" y="1153.1" font-size="18" font-weight="700" fill="#FFFDF9">Analyser kravene</text><g transform="translate(1194.038 1137) scale(0.8333)" fill="none" stroke="#FFFDF9" color="#FFFDF9" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12h14.5"/><path d="M13 6l6 6-6 6"/></g></g>
</svg>
