<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1093" viewBox="0 0 1440 1093" role="img" aria-labelledby="t d" font-family="Seravek, 'Gill Sans Nova', Ubuntu, 'Segoe UI', Calibri, 'DejaVu Sans', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Steg 1 – sjekk stillingstittel og arbeidsgiver</title>
<desc id="d">Stillingstittelen Sommervikar i hjemmetjenesten er funnet og kan rettes. Arbeidsgiver ble ikke funnet; en markert blokk forklarer hvorfor den trengs, og feltet har fokus. Analyser kravene nederst.</desc>
<rect width="1440" height="1093" fill="#F4EFE6"/>
<rect x="0" y="0" width="1440" height="72" fill="#F4EFE6"/><rect x="0" y="71" width="1440" height="1" fill="#D9CFBE"/><g aria-hidden="true"><rect x="48" y="21" width="30" height="30" rx="9" fill="#34557A"/><path d="M56 37l4.5 4.5 9.5-10" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></g><text x="90" y="44" font-size="22" font-weight="600" fill="#2A2520">Supersøker</text><rect x="1269" y="16" width="123" height="40" rx="10" fill="#FFFDF9" stroke="#857A69" stroke-width="1.5"/><g transform="translate(1287.4140625 26) scale(0.8333)" fill="none" stroke="#2A2520" color="#2A2520" stroke-width="2.16" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h4"/><path d="M15 8l4 4-4 4M19 12H9.5"/></g><text x="1317.4" y="41.6" font-size="16" font-weight="600" fill="#2A2520">Logg ut</text><text x="1249" y="41" font-size="15" fill="#5B5247" text-anchor="end">Innlogget som ida.testesen@example.com</text>
<rect x="0" y="72" width="1440" height="48" fill="#EAE2D3"/><rect x="0" y="119" width="1440" height="1" fill="#D9CFBE"/><g transform="translate(360 85) scale(0.9167)" fill="none" stroke="#2A2520" color="#2A2520" stroke-width="1.96" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.2l7.3 2.8v5.5c0 4.5-3 8-7.3 9.3-4.3-1.3-7.3-4.8-7.3-9.3V6z"/><path d="M8.6 12l2.4 2.4 4.4-4.5"/></g><text x="392" y="100.8" font-size="16" font-weight="400" fill="#2A2520"><tspan x="392"><tspan font-weight="600">Mock-modus er på.</tspan> Svarene er ferdiglagde eksempler, og ingen tekst sendes til en språkmodell.</tspan></text>
<line x1="414" y1="192" x2="692" y2="192" stroke="#857A69" stroke-width="2" stroke-dasharray="2 7" stroke-linecap="round"/><line x1="748" y1="192" x2="1026" y2="192" stroke="#857A69" stroke-width="2" stroke-dasharray="2 7" stroke-linecap="round"/><circle cx="386" cy="192" r="27" fill="#E2E8EF"/><circle cx="386" cy="192" r="20" fill="#34557A"/><text x="386" y="198.5" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="360" y="246" font-size="18" font-weight="700" fill="#2A2520" text-anchor="start">CV og annonse</text><text x="360" y="268" font-size="14" font-weight="600" fill="#34557A" text-anchor="start">Du er her</text><circle cx="720" cy="192" r="20" fill="#FFFDF9" stroke="#857A69" stroke-width="2"/><text x="720" y="198.5" font-size="18" font-weight="600" fill="#5B5247" text-anchor="middle">2</text><text x="720" y="246" font-size="18" font-weight="400" fill="#5B5247" text-anchor="middle">Gap-analyse</text><circle cx="1054" cy="192" r="20" fill="#FFFDF9" stroke="#857A69" stroke-width="2"/><text x="1054" y="198.5" font-size="18" font-weight="600" fill="#5B5247" text-anchor="middle">3</text><text x="1080" y="246" font-size="18" font-weight="400" fill="#5B5247" text-anchor="end">Teksten</text>
<text x="360" y="347.2" font-size="34" font-weight="400" fill="#2A2520"><tspan x="360"><tspan font-weight="600">Sjekk stillingstittel og arbeidsgiver</tspan></tspan></text>
<text x="360" y="391.2" font-size="19" font-weight="400" fill="#2A2520"><tspan x="360">Vi bruker dem i overskriften på gap-analysen og i teksten. Vi gjetter aldri: det vi</tspan><tspan x="360" dy="31">ikke fant i annonsen, ber vi deg fylle inn.</tspan></text>
<text x="360" y="486.1" font-size="17" font-weight="400" fill="#2A2520"><tspan x="360"><tspan font-weight="600">Stillingstittel</tspan><tspan fill="#5B5247"> (må fylles ut)</tspan></tspan></text>
<rect x="360" y="502" width="720" height="50" rx="8" fill="#FFFDF9" stroke="#857A69" stroke-width="1.5"/><text x="374" y="532.95" font-size="17" fill="#2A2520">Sommervikar i hjemmetjenesten</text>
<g transform="translate(360 564) scale(0.7500)" fill="none" stroke="#2D6644" color="#2D6644" stroke-width="2.67" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9.2"/><path d="M7.8 12.3l2.9 2.9 5.5-5.6"/></g><text x="386" y="578.0" font-size="15" font-weight="400" fill="#2A2520"><tspan x="386"><tspan fill="#2D6644">Funnet i annonsen. Rett tittelen hvis den ikke stemmer.</tspan></tspan></text>
<rect x="336" y="621" width="768" height="230" rx="14" fill="#F6E9CF" stroke="#D6B475"/><rect x="360" y="645" width="218" height="30" rx="15" fill="#FFFDF9" stroke="#D6B475"/><g transform="translate(369 650) scale(0.8333)" fill="none" stroke="#855000" color="#855000" stroke-width="2.40" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9.2" stroke-dasharray="3.2 2.6"/><path d="M12 8v8M8 12h8"/></g><text x="395" y="665" font-size="15" font-weight="600" fill="#855000">Ikke funnet i annonsen</text><text x="360" y="707.1" font-size="17" font-weight="400" fill="#2A2520"><tspan x="360"><tspan font-weight="600">Arbeidsgiver</tspan></tspan></text><text x="463.62548828125" y="708" font-size="17" fill="#5B5247">(må fylles ut)</text><text x="360" y="735.0" font-size="15" font-weight="400" fill="#2A2520"><tspan x="360">Vi fant ikke arbeidsgiveren i annonsen. Skriv navnet på arbeidsgiveren, så kan teksten nevne hvem</tspan><tspan x="360" dy="23">du søker hos.</tspan></text><rect x="360" y="775" width="720" height="50" rx="8" fill="#FFFDF9" stroke="#34557A" stroke-width="2"/><rect x="355.5" y="770.5" width="729" height="59" rx="12.5" fill="none" stroke="#34557A" stroke-width="3"/><rect x="374" y="788" width="1.6" height="24" fill="#2A2520"/>
<rect x="360" y="899" width="720" height="1" fill="#D9CFBE"/><g transform="translate(360 924) scale(0.8333)" fill="none" stroke="#34557A" color="#34557A" stroke-width="2.16" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h13M13 6.5l5.5 5.5-5.5 5.5"/></g><text x="390" y="939.8" font-size="16" font-weight="400" fill="#2A2520"><tspan x="390"><tspan font-weight="600">Neste: </tspan>Når begge feltene er fylt inn, analyserer vi kravene.</tspan></text><rect x="840" y="965" width="240" height="56" rx="10" fill="#34557A"/><text x="894.3" y="999.0" font-size="17" font-weight="600" fill="#FFFFFF">Analyser kravene</text><rect x="360" y="967" width="290" height="52" rx="10" fill="#FFFDF9" stroke="#857A69" stroke-width="1.5"/><g transform="translate(391.971923828125 983) scale(0.8333)" fill="none" stroke="#2A2520" color="#2A2520" stroke-width="2.16" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H6M11 6.5L5.5 12l5.5 5.5"/></g><text x="422.0" y="999.0" font-size="17" font-weight="600" fill="#2A2520">Tilbake til CV og annonse</text>
</svg>
