<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="789" viewBox="0 0 1440 789" role="img" aria-labelledby="t d" font-family="Seravek, 'Gill Sans Nova', Ubuntu, 'Segoe UI', Calibri, 'DejaVu Sans', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Opprett konto – for kort passord</title>
<desc id="d">Skjema for ny konto. E-postadressen er beholdt. Passordfeltet er tømt, merket ugyldig med rød kant og ikon, og har fokus. Meldingen sier at passordet må ha minst 8 tegn.</desc>
<rect width="1440" height="789" fill="#F4EFE6"/>
<rect x="0" y="0" width="1440" height="72" fill="#F4EFE6"/><rect x="0" y="71" width="1440" height="1" fill="#D9CFBE"/><g aria-hidden="true"><rect x="48" y="21" width="30" height="30" rx="9" fill="#34557A"/><path d="M56 37l4.5 4.5 9.5-10" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></g><text x="90" y="44" font-size="22" font-weight="600" fill="#2A2520">Supersøker</text>
<rect x="0" y="72" width="1440" height="48" fill="#EAE2D3"/><rect x="0" y="119" width="1440" height="1" fill="#D9CFBE"/><g transform="translate(360 85) scale(0.9167)" fill="none" stroke="#2A2520" color="#2A2520" stroke-width="1.96" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.2l7.3 2.8v5.5c0 4.5-3 8-7.3 9.3-4.3-1.3-7.3-4.8-7.3-9.3V6z"/><path d="M8.6 12l2.4 2.4 4.4-4.5"/></g><text x="392" y="100.8" font-size="16" font-weight="400" fill="#2A2520"><tspan x="392"><tspan font-weight="600">Mock-modus er på.</tspan> Svarene er ferdiglagde eksempler, og ingen tekst sendes til en språkmodell.</tspan></text>
<text x="480" y="195.2" font-size="34" font-weight="400" fill="#2A2520"><tspan x="480"><tspan font-weight="600">Opprett konto</tspan></tspan></text>
<text x="480" y="239.2" font-size="19" font-weight="400" fill="#2A2520"><tspan x="480">Du trenger bare e-post og passord. Navnet ditt</tspan><tspan x="480" dy="31">lagres ikke – det hentes fra CV-en når teksten lages.</tspan></text>
<text x="480" y="326.1" font-size="17" font-weight="400" fill="#2A2520"><tspan x="480"><tspan font-weight="600">E-post</tspan></tspan></text>
<rect x="480" y="342" width="480" height="50" rx="8" fill="#FFFDF9" stroke="#857A69" stroke-width="1.5"/><text x="494" y="372.95" font-size="17" fill="#2A2520">ida.testesen@example.com</text>
<text x="480" y="434.1" font-size="17" font-weight="400" fill="#2A2520"><tspan x="480"><tspan font-weight="600">Passord</tspan></tspan></text><text x="480" y="460.0" font-size="15" font-weight="400" fill="#5B5247"><tspan x="480">Minst 8 tegn.</tspan></text>
<g transform="translate(480 476) scale(0.8333)" fill="none" stroke="#A0392A" color="#A0392A" stroke-width="2.16" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5l9.5 16.5h-19z"/><path d="M12 10v4.5"/><circle cx="12" cy="17.3" r=".6" fill="currentColor"/></g><text x="508" y="491.8" font-size="16" font-weight="400" fill="#2A2520"><tspan x="508"><tspan font-weight="600" fill="#A0392A">Passordet er for kort. Skriv et passord på minst 8 tegn –</tspan></tspan><tspan x="508" dy="24"><tspan font-weight="600" fill="#A0392A">vi har tømt feltet.</tspan></tspan></text>
<rect x="480" y="533" width="480" height="50" rx="8" fill="#FFFDF9" stroke="#A0392A" stroke-width="2"/><rect x="475.5" y="528.5" width="489" height="59" rx="12.5" fill="none" stroke="#34557A" stroke-width="3"/><rect x="494" y="546" width="1.6" height="24" fill="#2A2520"/>
<rect x="480" y="615" width="480" height="56" rx="10" fill="#34557A"/><text x="664.5" y="649.0" font-size="17" font-weight="600" fill="#FFFFFF">Opprett konto</text>
<text x="480" y="713.1" font-size="17" font-weight="400" fill="#2A2520"><tspan x="480">Har du allerede konto?</tspan></text>
<text x="657.0791015625" y="710.6" font-size="17" font-weight="600" fill="#34557A" text-decoration="underline">Logg inn</text>
</svg>
