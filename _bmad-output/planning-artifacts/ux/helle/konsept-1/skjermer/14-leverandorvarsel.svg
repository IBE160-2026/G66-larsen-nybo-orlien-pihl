<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1630" viewBox="0 0 1440 1630" role="img" aria-labelledby="t d" font-family="Seravek, 'Gill Sans Nova', Ubuntu, 'Segoe UI', Calibri, 'DejaVu Sans', 'Helvetica Neue', Arial, sans-serif">
<title id="t">API-modus – varsel før data sendes til språkmodell</title>
<desc id="d">Banneret øverst viser at API-modus er på. En dialog over steg 1 navngir leverandøren OpenAI og modellen gpt-5-mini, sier at ingenting sendes før brukeren bekrefter, og har knappene Avbryt og Send og analyser.</desc>
<rect width="1440" height="1630" fill="#F4EFE6"/>
<rect x="0" y="0" width="1440" height="72" fill="#F4EFE6"/><rect x="0" y="71" width="1440" height="1" fill="#D9CFBE"/><g aria-hidden="true"><rect x="48" y="21" width="30" height="30" rx="9" fill="#34557A"/><path d="M56 37l4.5 4.5 9.5-10" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></g><text x="90" y="44" font-size="22" font-weight="600" fill="#2A2520">Supersøker</text><rect x="1269" y="16" width="123" height="40" rx="10" fill="#FFFDF9" stroke="#857A69" stroke-width="1.5"/><g transform="translate(1287.4140625 26) scale(0.8333)" fill="none" stroke="#2A2520" color="#2A2520" stroke-width="2.16" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h4"/><path d="M15 8l4 4-4 4M19 12H9.5"/></g><text x="1317.4" y="41.6" font-size="16" font-weight="600" fill="#2A2520">Logg ut</text><text x="1249" y="41" font-size="15" fill="#5B5247" text-anchor="end">Innlogget som ida.testesen@example.com</text>
<rect x="0" y="72" width="1440" height="48" fill="#F6E9CF"/><rect x="0" y="119" width="1440" height="1" fill="#D6B475"/><g transform="translate(360 85) scale(0.9167)" fill="none" stroke="#855000" color="#855000" stroke-width="1.96" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12l16-7.5-5.5 16-3-6.5z"/><path d="M11.5 14L20 4.5"/></g><text x="392" y="100.8" font-size="16" font-weight="400" fill="#2A2520"><tspan x="392"><tspan font-weight="600">API-modus er på.</tspan> Når du bekrefter, sendes CV-teksten, annonsen og svarene dine til en ekstern språkmodell.</tspan></text>
<line x1="414" y1="192" x2="692" y2="192" stroke="#857A69" stroke-width="2" stroke-dasharray="2 7" stroke-linecap="round"/><line x1="748" y1="192" x2="1026" y2="192" stroke="#857A69" stroke-width="2" stroke-dasharray="2 7" stroke-linecap="round"/><circle cx="386" cy="192" r="27" fill="#E2E8EF"/><circle cx="386" cy="192" r="20" fill="#34557A"/><text x="386" y="198.5" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="360" y="246" font-size="18" font-weight="700" fill="#2A2520" text-anchor="start">CV og annonse</text><text x="360" y="268" font-size="14" font-weight="600" fill="#34557A" text-anchor="start">Du er her</text><circle cx="720" cy="192" r="20" fill="#FFFDF9" stroke="#857A69" stroke-width="2"/><text x="720" y="198.5" font-size="18" font-weight="600" fill="#5B5247" text-anchor="middle">2</text><text x="720" y="246" font-size="18" font-weight="400" fill="#5B5247" text-anchor="middle">Gap-analyse</text><circle cx="1054" cy="192" r="20" fill="#FFFDF9" stroke="#857A69" stroke-width="2"/><text x="1054" y="198.5" font-size="18" font-weight="600" fill="#5B5247" text-anchor="middle">3</text><text x="1080" y="246" font-size="18" font-weight="400" fill="#5B5247" text-anchor="end">Teksten</text>
<text x="360" y="347.2" font-size="34" font-weight="400" fill="#2A2520"><tspan x="360"><tspan font-weight="600">Legg inn CV og stillingsannonse</tspan></tspan></text>
<text x="360" y="391.2" font-size="19" font-weight="400" fill="#2A2520"><tspan x="360">Vi sammenligner CV-en med annonsen og viser hvilke krav CV-en</tspan><tspan x="360" dy="31">dokumenterer. Alt du legger inn, slettes når du logger ut.</tspan></text>
<text x="360" y="482.9" font-size="23" font-weight="400" fill="#2A2520"><tspan x="360"><tspan font-weight="600">CV-en din</tspan></tspan></text>
<rect x="360" y="506" width="328" height="44" rx="10" fill="#FFFDF9" stroke="#857A69" stroke-width="1.5"/><rect x="363" y="509" width="165" height="38" rx="8" fill="#34557A"/><g transform="translate(378 518) scale(0.8333)" fill="none" stroke="#FFFFFF" color="#FFFFFF" stroke-width="2.16" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 19.5l1-4.2L15.8 5a1.9 1.9 0 0 1 2.7 0l.5.5a1.9 1.9 0 0 1 0 2.7L8.7 18.5z"/><path d="M14 6.8l3.2 3.2"/></g><text x="406" y="534" font-size="16" font-weight="600" fill="#FFFFFF">Lim inn tekst</text><g transform="translate(549 518) scale(0.8333)" fill="none" stroke="#2A2520" color="#2A2520" stroke-width="2.16" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V4M7.5 8.5L12 4l4.5 4.5"/><path d="M4.5 15v3.5a1.5 1.5 0 0 0 1.5 1.5h12a1.5 1.5 0 0 0 1.5-1.5V15"/></g><text x="577" y="534" font-size="16" font-weight="600" fill="#2A2520">Last opp fil</text>
<text x="360" y="590.1" font-size="17" font-weight="400" fill="#2A2520"><tspan x="360"><tspan font-weight="600">CV-tekst</tspan></tspan></text><text x="360" y="616.0" font-size="15" font-weight="400" fill="#5B5247"><tspan x="360">Lim inn hele CV-en: utdanning, erfaring og ferdigheter.</tspan></text>
<rect x="360" y="633" width="720" height="300" rx="8" fill="#FFFDF9" stroke="#857A69" stroke-width="1.5"/><text x="376" y="664.8" font-size="16" font-weight="400" fill="#2A2520"><tspan x="376">Ida Testesen</tspan><tspan x="376" dy="26">Testveien 1, 0000 Testvik</tspan><tspan x="376" dy="26">E-post: ida.testesen@example.com</tspan><tspan x="376" dy="26"> </tspan><tspan x="376" dy="26">PROFIL</tspan><tspan x="376" dy="26">Sykepleierstudent på 2. år som trives med å jobbe med mennesker. Pålitelig, blid og</tspan><tspan x="376" dy="26">vant til å samarbeide i team.</tspan><tspan x="376" dy="26"> </tspan><tspan x="376" dy="26">UTDANNING</tspan><tspan x="376" dy="26">2025–nå  Bachelor i sykepleie, Høgskolen i Testvik (2. år)</tspan></text><rect x="1069" y="641" width="5" height="284" rx="2.5" fill="#EAE2D3"/><rect x="1069" y="641" width="5" height="94.7" rx="2.5" fill="#857A69"/>
<text x="1080" y="954" font-size="14" fill="#5B5247" text-anchor="end" style="font-variant-numeric: tabular-nums">961 / 10 000 tegn</text>
<text x="360" y="1023.9" font-size="23" font-weight="400" fill="#2A2520"><tspan x="360"><tspan font-weight="600">Stillingsannonsen</tspan></tspan></text>
<text x="360" y="1065.1" font-size="17" font-weight="400" fill="#2A2520"><tspan x="360"><tspan font-weight="600">Annonsetekst</tspan></tspan></text><text x="360" y="1091.0" font-size="15" font-weight="400" fill="#5B5247"><tspan x="360">Ta med stillingstittel og arbeidsgiver, så kan teksten nevne dem.</tspan></text>
<rect x="360" y="1108" width="720" height="260" rx="8" fill="#FFFDF9" stroke="#857A69" stroke-width="1.5"/><text x="376" y="1139.8" font-size="16" font-weight="400" fill="#2A2520"><tspan x="376">Sommervikar i hjemmetjenesten – Testvik kommune</tspan><tspan x="376" dy="26"> </tspan><tspan x="376" dy="26">Hjemmetjenesten i Testvik kommune søker sommervikarer for perioden juni–august. Du</tspan><tspan x="376" dy="26">vil bistå brukere i eget hjem med praktisk hjelp, personlig stell og sosial kontakt.</tspan><tspan x="376" dy="26">Arbeidet foregår i turnus med dag- og kveldsvakter.</tspan><tspan x="376" dy="26"> </tspan><tspan x="376" dy="26">Vi ser etter deg som:</tspan><tspan x="376" dy="26">– har førerkort klasse B (krav, du kjører kommunens biler mellom brukerne)</tspan></text><rect x="1069" y="1116" width="5" height="244" rx="2.5" fill="#EAE2D3"/><rect x="1069" y="1116" width="5" height="177.5" rx="2.5" fill="#857A69"/>
<text x="1080" y="1389" font-size="14" fill="#5B5247" text-anchor="end" style="font-variant-numeric: tabular-nums">701 / 10 000 tegn</text>
<rect x="360" y="1436" width="720" height="1" fill="#D9CFBE"/><g transform="translate(360 1461) scale(0.8333)" fill="none" stroke="#34557A" color="#34557A" stroke-width="2.16" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h13M13 6.5l5.5 5.5-5.5 5.5"/></g><text x="390" y="1476.8" font-size="16" font-weight="400" fill="#2A2520"><tspan x="390"><tspan font-weight="600">Neste: </tspan>Vi finner kravene i annonsen og sjekker dem mot CV-en. Det tar noen sekunder.</tspan></text><rect x="840" y="1502" width="240" height="56" rx="10" fill="#34557A"/><text x="894.3" y="1536.0" font-size="17" font-weight="600" fill="#FFFFFF">Analyser kravene</text><rect x="0" y="0" width="1440" height="1630" fill="#2A2520" fill-opacity=".55"/><defs><filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#2A2520" flood-opacity=".28"/></filter></defs><rect x="400" y="380" width="640" height="402" rx="16" fill="#FFFDF9" filter="url(#sh)"/><circle cx="460" cy="438" r="24" fill="#F6E9CF"/><g transform="translate(448 426) scale(1.0000)" fill="none" stroke="#855000" color="#855000" stroke-width="1.80" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12l16-7.5-5.5 16-3-6.5z"/><path d="M11.5 14L20 4.5"/></g><text x="436" y="502.8" font-size="26" font-weight="400" fill="#2A2520"><tspan x="436"><tspan font-weight="600">Teksten din sendes til OpenAI</tspan></tspan></text><text x="436" y="541.1" font-size="17" font-weight="400" fill="#2A2520"><tspan x="436">For å analysere kravene sender Supersøker CV-teksten, annonsen og</tspan><tspan x="436" dy="28">svarene dine til språkmodellen gpt-5-mini hos OpenAI.</tspan></text><rect x="436" y="592" width="568" height="74" rx="10" fill="#EAE2D3" stroke="#D9CFBE" stroke-width="1"/><g transform="translate(450 608) scale(0.9167)" fill="none" stroke="#2A2520" color="#2A2520" stroke-width="1.96" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.2l7.3 2.8v5.5c0 4.5-3 8-7.3 9.3-4.3-1.3-7.3-4.8-7.3-9.3V6z"/><path d="M8.6 12l2.4 2.4 4.4-4.5"/></g><text x="484" y="622.0" font-size="15" font-weight="400" fill="#2A2520"><tspan x="484"><tspan font-weight="600">Ingenting sendes før du bekrefter.</tspan> Du får dette spørsmålet én gang</tspan><tspan x="484" dy="23">per innlogging. Avbryter du, beholdes alt du har skrevet.</tspan></text><rect x="784" y="696" width="220" height="52" rx="10" fill="#34557A"/><g transform="translate(813.203857421875 712) scale(0.8333)" fill="none" stroke="#FFFFFF" color="#FFFFFF" stroke-width="2.16" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12l16-7.5-5.5 16-3-6.5z"/><path d="M11.5 14L20 4.5"/></g><text x="843.2" y="728.0" font-size="17" font-weight="600" fill="#FFFFFF">Send og analyser</text><rect x="779.5" y="691.5" width="229" height="61" rx="14.5" fill="none" stroke="#34557A" stroke-width="3"/><rect x="661" y="696" width="111" height="52" rx="10" fill="#FFFDF9" stroke="#857A69" stroke-width="1.5"/><text x="690.8" y="728.0" font-size="17" font-weight="600" fill="#2A2520">Avbryt</text>
</svg>
