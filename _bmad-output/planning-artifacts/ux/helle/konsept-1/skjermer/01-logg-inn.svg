<rect x="480" y="814.25" width="480" height="110" rx="10" fill="#EAE2D3" stroke="#D9CFBE" stroke-width="1"/><g transform="translate(498 834.25) scale(0.9167)" fill="none" stroke="#2A2520" color="#2A2520" stroke-width="1.96" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="14.5" r="4.3"/><path d="M11.2 11.5L19.5 3.5M16 7l2.8 2.8M14 9l2 2"/></g><text x="532" y="850.4" font-size="17" font-weight="400" fill="#2A2520"><tspan x="532"><tspan font-weight="600">Skal du teste appen?</tspan></tspan></text><text x="532" y="876.3" font-size="15" font-weight="400" fill="#2A2520"><tspan x="532">Logg inn med testbrukeren. E-post og passord står i</tspan><tspan x="532" dy="23">README, under «Testbruker».</tspan></text>
