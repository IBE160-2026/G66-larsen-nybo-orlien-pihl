<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="997" viewBox="0 0 1440 997" role="img" aria-labelledby="t d" font-family="Seravek, 'Gill Sans Nova', Ubuntu, 'Segoe UI', Calibri, 'DejaVu Sans', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Logg inn – feil e-post eller passord</title>
<desc id="d">Innloggingsside med e-post og passord. Feilmeldingen «E-post eller passord er feil» vises over skjemaet, e-posten er beholdt, og passordfeltet har fokus. Lenke til Opprett konto og hint om testbrukeren i README. Mock-modus vises øverst.</desc>
<rect width="1440" height="997" fill="#F4EFE6"/>
<rect x="0" y="0" width="1440" height="72" fill="#F4EFE6"/><rect x="0" y="71" width="1440" height="1" fill="#D9CFBE"/><g aria-hidden="true"><rect x="48" y="21" width="30" height="30" rx="9" fill="#34557A"/><path d="M56 37l4.5 4.5 9.5-10" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></g><text x="90" y="44" font-size="22" font-weight="600" fill="#2A2520">Supersøker</text>
<rect x="0" y="72" width="1440" height="48" fill="#EAE2D3"/><rect x="0" y="119" width="1440" height="1" fill="#D9CFBE"/><g transform="translate(360 85) scale(0.9167)" fill="none" stroke="#2A2520" color="#2A2520" stroke-width="1.96" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.2l7.3 2.8v5.5c0 4.5-3 8-7.3 9.3-4.3-1.3-7.3-4.8-7.3-9.3V6z"/><path d="M8.6 12l2.4 2.4 4.4-4.5"/></g><text x="392" y="100.8" font-size="16" font-weight="400" fill="#2A2520"><tspan x="392"><tspan font-weight="600">Mock-modus er på.</tspan> Svarene er ferdiglagde eksempler, og ingen tekst sendes til en språkmodell.</tspan></text>
<text x="480" y="195.2" font-size="34" font-weight="400" fill="#2A2520"><tspan x="480"><tspan font-weight="600">Logg inn</tspan></tspan></text>
<text x="480" y="239.2" font-size="19" font-weight="400" fill="#2A2520"><tspan x="480">Supersøker hjelper deg å skrive en søknad som</tspan><tspan x="480" dy="31">stemmer med CV-en din.</tspan></text>
<rect x="480" y="308" width="480" height="89" rx="10" fill="#F8E3DD" stroke="#DDA79C" stroke-width="1"/><g transform="translate(498 328) scale(0.9167)" fill="none" stroke="#A0392A" color="#A0392A" stroke-width="1.96" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5l9.5 16.5h-19z"/><path d="M12 10v4.5"/><circle cx="12" cy="17.3" r=".6" fill="currentColor"/></g><text x="532" y="344.1" font-size="17" font-weight="400" fill="#2A2520"><tspan x="532"><tspan font-weight="600" fill="#A0392A">E-post eller passord er feil</tspan></tspan></text><text x="532" y="371.3" font-size="16" font-weight="400" fill="#2A2520"><tspan x="532">Sjekk at du har skrevet riktig, og prøv igjen.</tspan></text>
<text x="480" y="443.1" font-size="17" font-weight="400" fill="#2A2520"><tspan x="480"><tspan font-weight="600">E-post</tspan></tspan></text>
<rect x="480" y="459" width="480" height="50" rx="8" fill="#FFFDF9" stroke="#857A69" stroke-width="1.5"/><text x="494" y="489.95" font-size="17" fill="#2A2520">ida.testesen@example.com</text>
<text x="480" y="551.1" font-size="17" font-weight="400" fill="#2A2520"><tspan x="480"><tspan font-weight="600">Passord</tspan></tspan></text>
