<rect x="480" y="649" width="480" height="56" rx="10" fill="#34557A"/><text x="686.0" y="683.0" font-size="17" font-weight="600" fill="#FFFFFF">Logg inn</text>
<text x="480" y="747.1" font-size="17" font-weight="400" fill="#2A2520"><tspan x="480">Har du ikke konto?</tspan></text>
<text x="627.51171875" y="744.6" font-size="17" font-weight="600" fill="#34557A" text-decoration="underline">Opprett konto</text>
