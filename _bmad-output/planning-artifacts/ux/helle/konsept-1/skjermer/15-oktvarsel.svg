<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="3393" viewBox="0 0 1440 3393" role="img" aria-labelledby="t d" font-family="Seravek, 'Gill Sans Nova', Ubuntu, 'Segoe UI', Calibri, 'DejaVu Sans', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Øktvarsel og automatisk utlogging</title>
<desc id="d">Variant A: varsel etter 25 minutter uten aktivitet, med Fortsett økten i fokus og Logg ut nå. Variant B: innloggingssiden etter automatisk utlogging, med forklaring om at CV, annonse, svar og tekst er slettet.</desc>
<rect width="1440" height="3393" fill="#F4EFE6"/>
<g aria-hidden="false"><rect x="0" y="0" width="1440" height="56" fill="#2A2520"/><text x="48" y="36" font-size="18" font-weight="600" fill="#FFFFFF">Variant A – varsel etter 25 minutter uten aktivitet</text></g><g transform="translate(0 56)"><rect width="1440" height="2234" fill="#F4EFE6"/><rect x="0" y="0" width="1440" height="72" fill="#F4EFE6"/><rect x="0" y="71" width="1440" height="1" fill="#D9CFBE"/><g aria-hidden="true"><rect x="48" y="21" width="30" height="30" rx="9" fill="#34557A"/><path d="M56 37l4.5 4.5 9.5-10" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></g><text x="90" y="44" font-size="22" font-weight="600" fill="#2A2520">Supersøker</text><rect x="1269" y="16" width="123" height="40" rx="10" fill="#FFFDF9" stroke="#857A69" stroke-width="1.5"/><g transform="translate(1287.4140625 26) scale(0.8333)" fill="none" stroke="#2A2520" color="#2A2520" stroke-width="2.16" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h4"/><path d="M15 8l4 4-4 4M19 12H9.5"/></g><text x="1317.4" y="41.6" font-size="16" font-weight="600" fill="#2A2520">Logg ut</text><text x="1249" y="41" font-size="15" fill="#5B5247" text-anchor="end">Innlogget som ida.testesen@example.com</text>
<rect x="0" y="72" width="1440" height="48" fill="#EAE2D3"/><rect x="0" y="119" width="1440" height="1" fill="#D9CFBE"/><g transform="translate(360 85) scale(0.9167)" fill="none" stroke="#2A2520" color="#2A2520" stroke-width="1.96" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.2l7.3 2.8v5.5c0 4.5-3 8-7.3 9.3-4.3-1.3-7.3-4.8-7.3-9.3V6z"/><path d="M8.6 12l2.4 2.4 4.4-4.5"/></g><text x="392" y="100.8" font-size="16" font-weight="400" fill="#2A2520"><tspan x="392"><tspan font-weight="600">Mock-modus er på.</tspan> Svarene er ferdiglagde eksempler, og ingen tekst sendes til en språkmodell.</tspan></text>
<rect x="414" y="190.5" width="278" height="3" rx="1.5" fill="#34557A"/><line x1="748" y1="192" x2="1026" y2="192" stroke="#857A69" stroke-width="2" stroke-dasharray="2 7" stroke-linecap="round"/><circle cx="386" cy="192" r="20" fill="#34557A"/><path d="M378 192l5.5 5.5 10.5-11" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="360" y="246" font-size="18" font-weight="400" fill="#2A2520" text-anchor="start">CV og annonse</text><text x="360" y="268" font-size="14" font-weight="400" fill="#5B5247" text-anchor="start">Ferdig</text><circle cx="720" cy="192" r="27" fill="#E2E8EF"/><circle cx="720" cy="192" r="20" fill="#34557A"/><text x="720" y="198.5" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="720" y="246" font-size="18" font-weight="700" fill="#2A2520" text-anchor="middle">Gap-analyse</text><text x="720" y="268" font-size="14" font-weight="600" fill="#34557A" text-anchor="middle">Du er her</text><circle cx="1054" cy="192" r="20" fill="#FFFDF9" stroke="#857A69" stroke-width="2"/><text x="1054" y="198.5" font-size="18" font-weight="600" fill="#5B5247" text-anchor="middle">3</text><text x="1080" y="246" font-size="18" font-weight="400" fill="#5B5247" text-anchor="end">Teksten</text>
<text x="360" y="347.2" font-size="34" font-weight="400" fill="#2A2520"><tspan x="360"><tspan font-weight="600">Gap-analyse: Sommervikar i</tspan></tspan><tspan x="360" dy="42"><tspan font-weight="600">hjemmetjenesten, Testvik kommune</tspan></tspan></text>
<text x="360" y="433.0" font-size="20" font-weight="400" fill="#2A2520"><tspan x="360"><tspan font-weight="700">3 av 4 kompetansekrav</tspan> er dokumentert i CV-en.</tspan></text>
<text x="360" y="467.1" font-size="17" font-weight="400" fill="#5B5247"><tspan x="360">Ett krav mangler dokumentasjon. Svar gjerne på det før vi lager teksten – det er valgfritt.</tspan></text>
<text x="360" y="534.9" font-size="23" font-weight="400" fill="#2A2520"><tspan x="360"><tspan font-weight="600">Mangler dokumentasjon (1)</tspan></tspan></text>
<rect x="332" y="558" width="776" height="421" rx="14" fill="#F6E9CF" stroke="#D6B475"/><rect x="360" y="586" width="230" height="30" rx="15" fill="#FFFDF9" stroke="#D6B475"/><g transform="translate(369 591) scale(0.8333)" fill="none" stroke="#855000" color="#855000" stroke-width="2.40" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9.2" stroke-dasharray="3.2 2.6"/><path d="M12 8v8M8 12h8"/></g><text x="395" y="606" font-size="15" font-weight="600" fill="#855000">Mangler dokumentasjon</text><text x="360" y="651.6" font-size="22" font-weight="400" fill="#2A2520"><tspan x="360"><tspan font-weight="600">Førerkort klasse B</tspan></tspan></text><text x="360" y="684.6" font-size="17" font-weight="400" fill="#2A2520"><tspan x="360">Annonsen krever dette, men det står ikke i CV-en. Det betyr ikke at du mangler det.</tspan></text><g transform="translate(360 713) scale(0.8333)" fill="none" stroke="#855000" color="#855000" stroke-width="2.16" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 19.5l1-4.2L15.8 5a1.9 1.9 0 0 1 2.7 0l.5.5a1.9 1.9 0 0 1 0 2.7L8.7 18.5z"/><path d="M14 6.8l3.2 3.2"/></g><text x="388" y="729.1" font-size="17" font-weight="400" fill="#2A2520"><tspan x="388"><tspan font-weight="700" fill="#855000">Gjør dette nå: </tspan><tspan font-weight="600">fortell kort hva du har</tspan></tspan></text><text x="360" y="767.1" font-size="17" font-weight="400" fill="#2A2520"><tspan x="360"><tspan font-weight="600">Ditt svar om førerkort</tspan><tspan fill="#5B5247"> (valgfritt)</tspan></tspan></text><text x="360" y="793.0" font-size="15" font-weight="400" fill="#5B5247"><tspan x="360">Svaret brukes bare i denne søknaden. Skriv det slik det er – også hvis du ikke har det ennå. Teksten</tspan><tspan x="360" dy="23">påstår aldri mer enn du skriver.</tspan></text><rect x="360" y="833" width="720" height="96" rx="8" fill="#FFFDF9" stroke="#857A69" stroke-width="1.5"/><text x="376" y="864.8" font-size="16" font-weight="400" fill="#2A2520"><tspan x="376">Jeg har ikke førerkort ennå. Jeg har oppkjøring i april.</tspan></text><text x="1080" y="950" font-size="14" fill="#5B5247" text-anchor="end" style="font-variant-numeric: tabular-nums">56 / 1 000 tegn</text>
<text x="360" y="1049.9" font-size="23" font-weight="400" fill="#2A2520"><tspan x="360"><tspan font-weight="600">Dokumentert i CV-en (3)</tspan></tspan></text>
<rect x="360" y="1077" width="148" height="30" rx="15" fill="#E3EDE2" stroke="#A8C4AE"/><g transform="translate(369 1082) scale(0.8333)" fill="none" stroke="#2D6644" color="#2D6644" stroke-width="2.40" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9.2"/><path d="M7.8 12.3l2.9 2.9 5.5-5.6"/></g><text x="395" y="1097" font-size="15" font-weight="600" fill="#2D6644">Dokumentert</text><text x="360" y="1135.9" font-size="18" font-weight="400" fill="#2A2520"><tspan x="360"><tspan font-weight="600">Gode norskkunnskaper, muntlig og skriftlig</tspan></tspan></text><text x="360" y="1166.0" font-size="15" font-weight="400" fill="#5B5247"><tspan x="360">Fra CV-en:</tspan></text><rect x="360" y="1177" width="143.9" height="26" rx="4" fill="#F1DC9C"/><text x="364" y="1195.1" font-size="16" fill="#2A2520">«Norsk – morsmål»</text>
<rect x="360" y="1225" width="720" height="1" fill="#D9CFBE"/>
<rect x="360" y="1247" width="148" height="30" rx="15" fill="#E3EDE2" stroke="#A8C4AE"/><g transform="translate(369 1252) scale(0.8333)" fill="none" stroke="#2D6644" color="#2D6644" stroke-width="2.40" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9.2"/><path d="M7.8 12.3l2.9 2.9 5.5-5.6"/></g><text x="395" y="1267" font-size="15" font-weight="600" fill="#2D6644">Dokumentert</text><text x="360" y="1305.9" font-size="18" font-weight="400" fill="#2A2520"><tspan x="360"><tspan font-weight="600">Erfaring med eller interesse for å jobbe med mennesker</tspan></tspan></text><text x="360" y="1336.0" font-size="15" font-weight="400" fill="#5B5247"><tspan x="360">Fra CV-en:</tspan></text><rect x="360" y="1347" width="295.5" height="26" rx="4" fill="#F1DC9C"/><text x="364" y="1365.1" font-size="16" fill="#2A2520">«Besøksvenn, Røde Kors besøkstjeneste»</text>
<rect x="360" y="1395" width="720" height="1" fill="#D9CFBE"/>
<rect x="360" y="1417" width="148" height="30" rx="15" fill="#E3EDE2" stroke="#A8C4AE"/><g transform="translate(369 1422) scale(0.8333)" fill="none" stroke="#2D6644" color="#2D6644" stroke-width="2.40" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9.2"/><path d="M7.8 12.3l2.9 2.9 5.5-5.6"/></g><text x="395" y="1437" font-size="15" font-weight="600" fill="#2D6644">Dokumentert</text><text x="360" y="1475.9" font-size="18" font-weight="400" fill="#2A2520"><tspan x="360"><tspan font-weight="600">Gode samarbeidsevner</tspan></tspan></text><text x="360" y="1506.0" font-size="15" font-weight="400" fill="#5B5247"><tspan x="360">Fra CV-en:</tspan></text><rect x="360" y="1517" width="313.7" height="26" rx="4" fill="#F1DC9C"/><text x="364" y="1535.1" font-size="16" fill="#2A2520">«Gruppeprosjekt i helsefremmende arbeid»</text>
<text x="360" y="1613.9" font-size="23" font-weight="400" fill="#2A2520"><tspan x="360"><tspan font-weight="600">Ansettelsesvilkår</tspan></tspan></text>
<rect x="360" y="1633" width="720" height="87" rx="10" fill="none" stroke="#D9CFBE" stroke-width="1.5"/><g transform="translate(374 1652) scale(0.9167)" fill="none" stroke="#5B5247" color="#5B5247" stroke-width="1.96" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3.5h10A1.5 1.5 0 0 1 18.5 5v14a1.5 1.5 0 0 1-1.5 1.5H7A1.5 1.5 0 0 1 5.5 19V5A1.5 1.5 0 0 1 7 3.5z"/><path d="M9 8h6M9 11.5h6M9 15h3.5"/></g><text x="404" y="1669.1" font-size="17" font-weight="400" fill="#2A2520"><tspan x="404"><tspan font-weight="600">Politiattest</tspan></tspan></text><text x="404" y="1695.0" font-size="15" font-weight="400" fill="#5B5247"><tspan x="404">Kan ikke dokumenteres i en CV. Telles ikke med over, og teksten påstår ikke at du har den.</tspan></text>
<text x="360" y="1786.9" font-size="23" font-weight="400" fill="#2A2520"><tspan x="360"><tspan font-weight="600">Hvor mye skal Supersøker skrive?</tspan></tspan></text>
<rect x="360" y="1810" width="720" height="87" rx="10" fill="#F3F6F9" stroke="#34557A" stroke-width="2"/><circle cx="390" cy="1841" r="10" fill="#FFFDF9" stroke="#34557A" stroke-width="2"/><circle cx="390" cy="1841" r="5.5" fill="#34557A"/><text x="416" y="1846.1" font-size="17" font-weight="400" fill="#2A2520"><tspan x="416"><tspan font-weight="600">Helt søknadsutkast</tspan></tspan></text><text x="416" y="1872.0" font-size="15" font-weight="400" fill="#5B5247"><tspan x="416">Et sammenhengende brev du redigerer selv.</tspan></text>
<rect x="360" y="1909" width="720" height="87" rx="10" fill="#FFFDF9" stroke="#857A69" stroke-width="1.5"/><circle cx="390" cy="1940" r="10" fill="#FFFDF9" stroke="#857A69" stroke-width="2"/><text x="416" y="1945.1" font-size="17" font-weight="400" fill="#2A2520"><tspan x="416"><tspan font-weight="600">Forslag til formuleringer</tspan></tspan></text><text x="416" y="1971.0" font-size="15" font-weight="400" fill="#5B5247"><tspan x="416">Setninger du kan bruke i ditt eget brev.</tspan></text>
<rect x="360" y="2040" width="720" height="1" fill="#D9CFBE"/><g transform="translate(360 2065) scale(0.8333)" fill="none" stroke="#34557A" color="#34557A" stroke-width="2.16" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h13M13 6.5l5.5 5.5-5.5 5.5"/></g><text x="390" y="2080.8" font-size="16" font-weight="400" fill="#2A2520"><tspan x="390"><tspan font-weight="600">Neste: </tspan>Vi skriver teksten ut fra CV-en, annonsen og svaret ditt.</tspan></text><rect x="840" y="2106" width="240" height="56" rx="10" fill="#34557A"/><text x="925.2" y="2139.9" font-size="17" font-weight="600" fill="#FFFFFF">Lag tekst</text><rect x="360" y="2108" width="270" height="52" rx="10" fill="#FFFDF9" stroke="#857A69" stroke-width="1.5"/><g transform="translate(390.92431640625 2124) scale(0.8333)" fill="none" stroke="#2A2520" color="#2A2520" stroke-width="2.16" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H6M11 6.5L5.5 12l5.5 5.5"/></g><text x="420.9" y="2139.9" font-size="17" font-weight="600" fill="#2A2520">Endre CV eller annonse</text><rect x="0" y="0" width="1440" height="2234" fill="#2A2520" fill-opacity=".55"/><defs><filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#2A2520" flood-opacity=".28"/></filter></defs><rect x="420" y="330" width="600" height="314" rx="16" fill="#FFFDF9" filter="url(#sh)"/><circle cx="480" cy="388" r="24" fill="#E2E8EF"/><g transform="translate(468 376) scale(1.0000)" fill="none" stroke="#34557A" color="#34557A" stroke-width="1.80" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9.2"/><path d="M12 7v5.2l3.4 2"/></g><text x="456" y="452.8" font-size="26" font-weight="400" fill="#2A2520"><tspan x="456"><tspan font-weight="600">Du blir logget ut om 5 minutter</tspan></tspan></text><text x="456" y="491.1" font-size="17" font-weight="400" fill="#2A2520"><tspan x="456">Du har ikke gjort noe på 25 minutter. Når du logges ut, slettes</tspan><tspan x="456" dy="28">CV-en, annonsen, svarene og teksten.</tspan></text><rect x="811" y="558" width="173" height="52" rx="10" fill="#34557A"/><text x="843.2" y="590.0" font-size="17" font-weight="600" fill="#FFFFFF">Fortsett økten</text><rect x="806.5" y="553.5" width="182" height="61" rx="14.5" fill="none" stroke="#34557A" stroke-width="3"/><rect x="631" y="558" width="168" height="52" rx="10" fill="#FFFDF9" stroke="#857A69" stroke-width="1.5"/><g transform="translate(658.425537109375 574) scale(0.8333)" fill="none" stroke="#2A2520" color="#2A2520" stroke-width="2.16" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h4"/><path d="M15 8l4 4-4 4M19 12H9.5"/></g><text x="688.4" y="590.0" font-size="17" font-weight="600" fill="#2A2520">Logg ut nå</text></g><g aria-hidden="false"><rect x="0" y="2290" width="1440" height="56" fill="#2A2520"/><text x="48" y="2326" font-size="18" font-weight="600" fill="#FFFFFF">Variant B – innlogging etter automatisk utlogging (30 minutter)</text></g><g transform="translate(0 2346)"><rect width="1440" height="1047" fill="#F4EFE6"/><rect x="0" y="0" width="1440" height="72" fill="#F4EFE6"/><rect x="0" y="71" width="1440" height="1" fill="#D9CFBE"/><g aria-hidden="true"><rect x="48" y="21" width="30" height="30" rx="9" fill="#34557A"/><path d="M56 37l4.5 4.5 9.5-10" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></g><text x="90" y="44" font-size="22" font-weight="600" fill="#2A2520">Supersøker</text>
<rect x="0" y="72" width="1440" height="48" fill="#EAE2D3"/><rect x="0" y="119" width="1440" height="1" fill="#D9CFBE"/><g transform="translate(360 85) scale(0.9167)" fill="none" stroke="#2A2520" color="#2A2520" stroke-width="1.96" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.2l7.3 2.8v5.5c0 4.5-3 8-7.3 9.3-4.3-1.3-7.3-4.8-7.3-9.3V6z"/><path d="M8.6 12l2.4 2.4 4.4-4.5"/></g><text x="392" y="100.8" font-size="16" font-weight="400" fill="#2A2520"><tspan x="392"><tspan font-weight="600">Mock-modus er på.</tspan> Svarene er ferdiglagde eksempler, og ingen tekst sendes til en språkmodell.</tspan></text>
<text x="480" y="195.2" font-size="34" font-weight="400" fill="#2A2520"><tspan x="480"><tspan font-weight="600">Logg inn</tspan></tspan></text>
<text x="480" y="239.2" font-size="19" font-weight="400" fill="#2A2520"><tspan x="480">Supersøker hjelper deg å skrive en søknad som</tspan><tspan x="480" dy="31">stemmer med CV-en din.</tspan></text>
<rect x="480" y="308" width="480" height="139" rx="10" fill="#E2E8EF" stroke="#A9B9CC" stroke-width="1"/><g transform="translate(498 328) scale(0.9167)" fill="none" stroke="#34557A" color="#34557A" stroke-width="1.96" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9.2"/><path d="M12 7v5.2l3.4 2"/></g><text x="532" y="344.1" font-size="17" font-weight="400" fill="#2A2520"><tspan x="532"><tspan font-weight="600" fill="#34557A">Du ble logget ut</tspan></tspan></text><text x="532" y="371.3" font-size="16" font-weight="400" fill="#2A2520"><tspan x="532">Du hadde ikke gjort noe på 30 minutter. CV-en,</tspan><tspan x="532" dy="25">annonsen, svarene og teksten er slettet. Logg inn for</tspan><tspan x="532" dy="25">å begynne på nytt.</tspan></text>
<text x="480" y="493.1" font-size="17" font-weight="400" fill="#2A2520"><tspan x="480"><tspan font-weight="600">E-post</tspan></tspan></text>
<rect x="480" y="509" width="480" height="50" rx="8" fill="#FFFDF9" stroke="#34557A" stroke-width="2"/><rect x="475.5" y="504.5" width="489" height="59" rx="12.5" fill="none" stroke="#34557A" stroke-width="3"/>
<text x="480" y="601.1" font-size="17" font-weight="400" fill="#2A2520"><tspan x="480"><tspan font-weight="600">Passord</tspan></tspan></text>
<rect x="480" y="617" width="480" height="50" rx="8" fill="#FFFDF9" stroke="#857A69" stroke-width="1.5"/>
<rect x="480" y="699" width="480" height="56" rx="10" fill="#34557A"/><text x="686.0" y="733.0" font-size="17" font-weight="600" fill="#FFFFFF">Logg inn</text>
<text x="480" y="797.1" font-size="17" font-weight="400" fill="#2A2520"><tspan x="480">Har du ikke konto?</tspan></text>
<text x="627.51171875" y="794.6" font-size="17" font-weight="600" fill="#34557A" text-decoration="underline">Opprett konto</text>
<rect x="480" y="840.25" width="480" height="1" fill="#D9CFBE"/>
<rect x="480" y="864.25" width="480" height="110" rx="10" fill="#EAE2D3" stroke="#D9CFBE" stroke-width="1"/><g transform="translate(498 884.25) scale(0.9167)" fill="none" stroke="#2A2520" color="#2A2520" stroke-width="1.96" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="14.5" r="4.3"/><path d="M11.2 11.5L19.5 3.5M16 7l2.8 2.8M14 9l2 2"/></g><text x="532" y="900.4" font-size="17" font-weight="400" fill="#2A2520"><tspan x="532"><tspan font-weight="600">Skal du teste appen?</tspan></tspan></text><text x="532" y="926.3" font-size="15" font-weight="400" fill="#2A2520"><tspan x="532">Logg inn med testbrukeren. E-post og passord står i</tspan><tspan x="532" dy="23">README, under «Testbruker».</tspan></text></g>
</svg>
