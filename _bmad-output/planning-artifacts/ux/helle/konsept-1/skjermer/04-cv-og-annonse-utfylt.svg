<text x="360" y="347.2" font-size="34" font-weight="400" fill="#2A2520"><tspan x="360"><tspan font-weight="600">Legg inn CV og stillingsannonse</tspan></tspan></text>
<text x="360" y="391.2" font-size="19" font-weight="400" fill="#2A2520"><tspan x="360">Vi sammenligner CV-en med annonsen og viser hvilke krav CV-en</tspan><tspan x="360" dy="31">dokumenterer. Alt du legger inn, slettes når du logger ut.</tspan></text>
<text x="360" y="482.9" font-size="23" font-weight="400" fill="#2A2520"><tspan x="360"><tspan font-weight="600">CV-en din</tspan></tspan></text>
