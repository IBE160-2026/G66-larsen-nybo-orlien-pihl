<title id="t">Steg 1, CV og annonse – utfylt etter opplasting</title>
<desc id="d">CV-en cv-ida.pdf er lest inn. Teksten vises i et redigerbart felt med påminnelse om å sjekke kolonner og overskrifter. Annonsen er limt inn. Tegntellere viser 961 og 701 av 10 000 tegn.</desc>
