<rect x="360" y="654" width="720" height="114" rx="10" fill="#E2E8EF" stroke="#A9B9CC" stroke-width="1"/><g transform="translate(378 674) scale(0.9167)" fill="none" stroke="#34557A" color="#34557A" stroke-width="1.96" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9.2"/><path d="M12 11v5.5"/><circle cx="12" cy="7.8" r=".6" fill="currentColor"/></g><text x="412" y="690.1" font-size="17" font-weight="400" fill="#2A2520"><tspan x="412"><tspan font-weight="600" fill="#34557A">Sjekk rekkefølgen i teksten</tspan></tspan></text><text x="412" y="717.3" font-size="16" font-weight="400" fill="#2A2520"><tspan x="412">PDF-er med kolonner kan bli lest i feil rekkefølge. Se at overskrifter og avsnitt står</tspan><tspan x="412" dy="25">der de skal, og rett teksten under om noe er feil.</tspan></text>
<text x="360" y="810.1" font-size="17" font-weight="400" fill="#2A2520"><tspan x="360"><tspan font-weight="600">Teksten vi leste fra fila</tspan></tspan></text><text x="360" y="836.0" font-size="15" font-weight="400" fill="#5B5247"><tspan x="360">Du kan rette teksten her. Analysen bruker det som står i feltet.</tspan></text>
<rect x="360" y="853" width="720" height="300" rx="8" fill="#FFFDF9" stroke="#34557A" stroke-width="2"/><rect x="355.5" y="848.5" width="729" height="309" rx="12.5" fill="none" stroke="#34557A" stroke-width="3"/><text x="376" y="884.8" font-size="16" font-weight="400" fill="#2A2520"><tspan x="376">Ida Testesen</tspan><tspan x="376" dy="26">Testveien 1, 0000 Testvik</tspan><tspan x="376" dy="26">E-post: ida.testesen@example.com</tspan><tspan x="376" dy="26"> </tspan><tspan x="376" dy="26">PROFIL</tspan><tspan x="376" dy="26">Sykepleierstudent på 2. år som trives med å jobbe med mennesker. Pålitelig, blid og</tspan><tspan x="376" dy="26">vant til å samarbeide i team.</tspan><tspan x="376" dy="26"> </tspan><tspan x="376" dy="26">UTDANNING</tspan><tspan x="376" dy="26">2025–nå  Bachelor i sykepleie, Høgskolen i Testvik (2. år)</tspan></text><rect x="1069" y="861" width="5" height="284" rx="2.5" fill="#EAE2D3"/><rect x="1069" y="861" width="5" height="94.7" rx="2.5" fill="#857A69"/>
<text x="1080" y="1174" font-size="14" fill="#5B5247" text-anchor="end" style="font-variant-numeric: tabular-nums">961 / 10 000 tegn</text>
<text x="360" y="1243.9" font-size="23" font-weight="400" fill="#2A2520"><tspan x="360"><tspan font-weight="600">Stillingsannonsen</tspan></tspan></text>
<text x="360" y="1285.1" font-size="17" font-weight="400" fill="#2A2520"><tspan x="360"><tspan font-weight="600">Annonsetekst</tspan></tspan></text><text x="360" y="1311.0" font-size="15" font-weight="400" fill="#5B5247"><tspan x="360">Ta med stillingstittel og arbeidsgiver, så kan teksten nevne dem.</tspan></text>
<rect x="360" y="1328" width="720" height="260" rx="8" fill="#FFFDF9" stroke="#857A69" stroke-width="1.5"/><text x="376" y="1359.8" font-size="16" font-weight="400" fill="#2A2520"><tspan x="376">Sommervikar i hjemmetjenesten – Testvik kommune</tspan><tspan x="376" dy="26"> </tspan><tspan x="376" dy="26">Hjemmetjenesten i Testvik kommune søker sommervikarer for perioden juni–august. Du</tspan><tspan x="376" dy="26">vil bistå brukere i eget hjem med praktisk hjelp, personlig stell og sosial kontakt.</tspan><tspan x="376" dy="26">Arbeidet foregår i turnus med dag- og kveldsvakter.</tspan><tspan x="376" dy="26"> </tspan><tspan x="376" dy="26">Vi ser etter deg som:</tspan><tspan x="376" dy="26">– har førerkort klasse B (krav, du kjører kommunens biler mellom brukerne)</tspan></text><rect x="1069" y="1336" width="5" height="244" rx="2.5" fill="#EAE2D3"/><rect x="1069" y="1336" width="5" height="177.5" rx="2.5" fill="#857A69"/>
<text x="1080" y="1609" font-size="14" fill="#5B5247" text-anchor="end" style="font-variant-numeric: tabular-nums">701 / 10 000 tegn</text>
<rect x="360" y="1656" width="720" height="1" fill="#D9CFBE"/><g transform="translate(360 1681) scale(0.8333)" fill="none" stroke="#34557A" color="#34557A" stroke-width="2.16" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h13M13 6.5l5.5 5.5-5.5 5.5"/></g><text x="390" y="1696.8" font-size="16" font-weight="400" fill="#2A2520"><tspan x="390"><tspan font-weight="600">Neste: </tspan>Vi finner kravene i annonsen og sjekker dem mot CV-en. Det tar noen sekunder.</tspan></text><rect x="840" y="1722" width="240" height="56" rx="10" fill="#34557A"/><text x="894.3" y="1756.0" font-size="17" font-weight="600" fill="#FFFFFF">Analyser kravene</text>
