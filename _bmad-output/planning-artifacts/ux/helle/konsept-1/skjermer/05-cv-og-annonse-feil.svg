<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1798" viewBox="0 0 1440 1798" role="img" aria-labelledby="t d" font-family="Seravek, 'Gill Sans Nova', Ubuntu, 'Segoe UI', Calibri, 'DejaVu Sans', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Steg 1, CV og annonse – feiltilstander</title>
<desc id="d">To feil. Fila cv-ida-skannet.pdf kunne ikke leses; meldingen navngir fila og tilbyr ny fil eller innliming, og tidligere CV-tekst er beholdt. Annonsefeltet er tomt, merket ugyldig med melding ved feltet, og har fokus.</desc>
<rect width="1440" height="1798" fill="#F4EFE6"/>
<rect x="0" y="0" width="1440" height="72" fill="#F4EFE6"/><rect x="0" y="71" width="1440" height="1" fill="#D9CFBE"/><g aria-hidden="true"><rect x="48" y="21" width="30" height="30" rx="9" fill="#34557A"/><path d="M56 37l4.5 4.5 9.5-10" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></g><text x="90" y="44" font-size="22" font-weight="600" fill="#2A2520">Supersøker</text><rect x="1269" y="16" width="123" height="40" rx="10" fill="#FFFDF9" stroke="#857A69" stroke-width="1.5"/><g transform="translate(1287.4140625 26) scale(0.8333)" fill="none" stroke="#2A2520" color="#2A2520" stroke-width="2.16" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h4"/><path d="M15 8l4 4-4 4M19 12H9.5"/></g><text x="1317.4" y="41.6" font-size="16" font-weight="600" fill="#2A2520">Logg ut</text><text x="1249" y="41" font-size="15" fill="#5B5247" text-anchor="end">Innlogget som ida.testesen@example.com</text>
<rect x="0" y="72" width="1440" height="48" fill="#EAE2D3"/><rect x="0" y="119" width="1440" height="1" fill="#D9CFBE"/><g transform="translate(360 85) scale(0.9167)" fill="none" stroke="#2A2520" color="#2A2520" stroke-width="1.96" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.2l7.3 2.8v5.5c0 4.5-3 8-7.3 9.3-4.3-1.3-7.3-4.8-7.3-9.3V6z"/><path d="M8.6 12l2.4 2.4 4.4-4.5"/></g><text x="392" y="100.8" font-size="16" font-weight="400" fill="#2A2520"><tspan x="392"><tspan font-weight="600">Mock-modus er på.</tspan> Svarene er ferdiglagde eksempler, og ingen tekst sendes til en språkmodell.</tspan></text>
<line x1="414" y1="192" x2="692" y2="192" stroke="#857A69" stroke-width="2" stroke-dasharray="2 7" stroke-linecap="round"/><line x1="748" y1="192" x2="1026" y2="192" stroke="#857A69" stroke-width="2" stroke-dasharray="2 7" stroke-linecap="round"/><circle cx="386" cy="192" r="27" fill="#E2E8EF"/><circle cx="386" cy="192" r="20" fill="#34557A"/><text x="386" y="198.5" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="360" y="246" font-size="18" font-weight="700" fill="#2A2520" text-anchor="start">CV og annonse</text><text x="360" y="268" font-size="14" font-weight="600" fill="#34557A" text-anchor="start">Du er her</text><circle cx="720" cy="192" r="20" fill="#FFFDF9" stroke="#857A69" stroke-width="2"/><text x="720" y="198.5" font-size="18" font-weight="600" fill="#5B5247" text-anchor="middle">2</text><text x="720" y="246" font-size="18" font-weight="400" fill="#5B5247" text-anchor="middle">Gap-analyse</text><circle cx="1054" cy="192" r="20" fill="#FFFDF9" stroke="#857A69" stroke-width="2"/><text x="1054" y="198.5" font-size="18" font-weight="600" fill="#5B5247" text-anchor="middle">3</text><text x="1080" y="246" font-size="18" font-weight="400" fill="#5B5247" text-anchor="end">Teksten</text>
<text x="360" y="347.2" font-size="34" font-weight="400" fill="#2A2520"><tspan x="360"><tspan font-weight="600">Legg inn CV og stillingsannonse</tspan></tspan></text>
<text x="360" y="391.2" font-size="19" font-weight="400" fill="#2A2520"><tspan x="360">Vi sammenligner CV-en med annonsen og viser hvilke krav CV-en</tspan><tspan x="360" dy="31">dokumenterer. Alt du legger inn, slettes når du logger ut.</tspan></text>
<text x="360" y="482.9" font-size="23" font-weight="400" fill="#2A2520"><tspan x="360"><tspan font-weight="600">CV-en din</tspan></tspan></text>
<rect x="360" y="506" width="328" height="44" rx="10" fill="#FFFDF9" stroke="#857A69" stroke-width="1.5"/><g transform="translate(378 518) scale(0.8333)" fill="none" stroke="#2A2520" color="#2A2520" stroke-width="2.16" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 19.5l1-4.2L15.8 5a1.9 1.9 0 0 1 2.7 0l.5.5a1.9 1.9 0 0 1 0 2.7L8.7 18.5z"/><path d="M14 6.8l3.2 3.2"/></g><text x="406" y="534" font-size="16" font-weight="600" fill="#2A2520">Lim inn tekst</text><rect x="534" y="509" width="151" height="38" rx="8" fill="#34557A"/><g transform="translate(549 518) scale(0.8333)" fill="none" stroke="#FFFFFF" color="#FFFFFF" stroke-width="2.16" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V4M7.5 8.5L12 4l4.5 4.5"/><path d="M4.5 15v3.5a1.5 1.5 0 0 0 1.5 1.5h12a1.5 1.5 0 0 0 1.5-1.5V15"/></g><text x="577" y="534" font-size="16" font-weight="600" fill="#FFFFFF">Last opp fil</text>
<rect x="360" y="572" width="720" height="170" rx="10" fill="#F8E3DD" stroke="#DDA79C" stroke-width="1"/><g transform="translate(378 592) scale(0.9167)" fill="none" stroke="#A0392A" color="#A0392A" stroke-width="1.96" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5l9.5 16.5h-19z"/><path d="M12 10v4.5"/><circle cx="12" cy="17.3" r=".6" fill="currentColor"/></g><text x="412" y="608.1" font-size="17" font-weight="400" fill="#2A2520"><tspan x="412"><tspan font-weight="600" fill="#A0392A">Vi kunne ikke lese filen cv-ida-skannet.pdf</tspan></tspan></text><text x="412" y="635.3" font-size="16" font-weight="400" fill="#2A2520"><tspan x="412">Prøv en TXT-fil eller tekstbasert PDF, eller lim inn teksten. CV-teksten du hadde fra</tspan><tspan x="412" dy="25">før, er beholdt.</tspan></text><rect x="412" y="680" width="194" height="44" rx="10" fill="#FFFDF9" stroke="#857A69" stroke-width="1.5"/><g transform="translate(432.82421875 692) scale(0.8333)" fill="none" stroke="#2A2520" color="#2A2520" stroke-width="2.16" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V4M7.5 8.5L12 4l4.5 4.5"/><path d="M4.5 15v3.5a1.5 1.5 0 0 0 1.5 1.5h12a1.5 1.5 0 0 0 1.5-1.5V15"/></g><text x="462.8" y="707.6" font-size="16" font-weight="600" fill="#2A2520">Velg en annen fil</text><rect x="618" y="680" width="225" height="44" rx="10" fill="#FFFDF9" stroke="#857A69" stroke-width="1.5"/><g transform="translate(639.87109375 692) scale(0.8333)" fill="none" stroke="#2A2520" color="#2A2520" stroke-width="2.16" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 19.5l1-4.2L15.8 5a1.9 1.9 0 0 1 2.7 0l.5.5a1.9 1.9 0 0 1 0 2.7L8.7 18.5z"/><path d="M14 6.8l3.2 3.2"/></g><text x="669.9" y="707.6" font-size="16" font-weight="600" fill="#2A2520">Lim inn tekst i stedet</text>
<text x="360" y="784.1" font-size="17" font-weight="400" fill="#2A2520"><tspan x="360"><tspan font-weight="600">CV-tekst</tspan></tspan></text><text x="360" y="810.0" font-size="15" font-weight="400" fill="#5B5247"><tspan x="360">Lim inn hele CV-en: utdanning, erfaring og ferdigheter.</tspan></text>
<rect x="360" y="827" width="720" height="300" rx="8" fill="#FFFDF9" stroke="#857A69" stroke-width="1.5"/><text x="376" y="858.8" font-size="16" font-weight="400" fill="#2A2520"><tspan x="376">Ida Testesen</tspan><tspan x="376" dy="26">Testveien 1, 0000 Testvik</tspan><tspan x="376" dy="26">E-post: ida.testesen@example.com</tspan><tspan x="376" dy="26"> </tspan><tspan x="376" dy="26">PROFIL</tspan><tspan x="376" dy="26">Sykepleierstudent på 2. år som trives med å jobbe med mennesker. Pålitelig, blid og</tspan><tspan x="376" dy="26">vant til å samarbeide i team.</tspan><tspan x="376" dy="26"> </tspan><tspan x="376" dy="26">UTDANNING</tspan><tspan x="376" dy="26">2025–nå  Bachelor i sykepleie, Høgskolen i Testvik (2. år)</tspan></text><rect x="1069" y="835" width="5" height="284" rx="2.5" fill="#EAE2D3"/><rect x="1069" y="835" width="5" height="94.7" rx="2.5" fill="#857A69"/>
<text x="1080" y="1148" font-size="14" fill="#5B5247" text-anchor="end" style="font-variant-numeric: tabular-nums">961 / 10 000 tegn</text>
<text x="360" y="1217.9" font-size="23" font-weight="400" fill="#2A2520"><tspan x="360"><tspan font-weight="600">Stillingsannonsen</tspan></tspan></text>
<text x="360" y="1259.1" font-size="17" font-weight="400" fill="#2A2520"><tspan x="360"><tspan font-weight="600">Annonsetekst</tspan></tspan></text><text x="360" y="1285.0" font-size="15" font-weight="400" fill="#5B5247"><tspan x="360">Ta med stillingstittel og arbeidsgiver, så kan teksten nevne dem.</tspan></text>
<g transform="translate(360 1303) scale(0.8333)" fill="none" stroke="#A0392A" color="#A0392A" stroke-width="2.16" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5l9.5 16.5h-19z"/><path d="M12 10v4.5"/><circle cx="12" cy="17.3" r=".6" fill="currentColor"/></g><text x="388" y="1318.8" font-size="16" font-weight="400" fill="#2A2520"><tspan x="388"><tspan font-weight="600" fill="#A0392A">Annonsen er tom. Lim inn teksten fra stillingsannonsen før du analyserer.</tspan></tspan></text>
