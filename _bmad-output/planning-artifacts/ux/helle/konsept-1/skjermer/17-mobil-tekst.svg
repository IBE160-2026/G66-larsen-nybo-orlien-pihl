<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1875" viewBox="0 0 390 1875" role="img" aria-labelledby="t d" font-family="Seravek, 'Gill Sans Nova', Ubuntu, 'Segoe UI', Calibri, 'DejaVu Sans', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Mobil, 390 px – søknadsutkastet</title>
<desc id="d">Søknadsutkastet på smal skjerm. Brevet i et redigerbart felt, deretter et åpnet sammenleggbart panel «Teksten bygger på», bekreftelsen Kopiert og Kopier tekst som full bredde-knapp nederst.</desc>
<rect width="390" height="1875" fill="#F4EFE6"/>
<rect x="0" y="0" width="390" height="64" fill="#F4EFE6"/><rect x="0" y="63" width="390" height="1" fill="#D9CFBE"/><g aria-hidden="true"><rect x="20" y="17" width="30" height="30" rx="9" fill="#34557A"/><path d="M28 33l4.5 4.5 9.5-10" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></g><text x="62" y="40" font-size="20" font-weight="600" fill="#2A2520">Supersøker</text><rect x="247" y="12" width="123" height="40" rx="10" fill="#FFFDF9" stroke="#857A69" stroke-width="1.5"/><g transform="translate(265.4140625 22) scale(0.8333)" fill="none" stroke="#2A2520" color="#2A2520" stroke-width="2.16" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h4"/><path d="M15 8l4 4-4 4M19 12H9.5"/></g><text x="295.4" y="37.6" font-size="16" font-weight="600" fill="#2A2520">Logg ut</text>
<rect x="0" y="64" width="390" height="93" fill="#EAE2D3"/><rect x="0" y="156" width="390" height="1" fill="#D9CFBE"/><g transform="translate(20 76.5) scale(0.9167)" fill="none" stroke="#2A2520" color="#2A2520" stroke-width="1.96" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.2l7.3 2.8v5.5c0 4.5-3 8-7.3 9.3-4.3-1.3-7.3-4.8-7.3-9.3V6z"/><path d="M8.6 12l2.4 2.4 4.4-4.5"/></g><text x="52" y="92.0" font-size="15" font-weight="400" fill="#2A2520"><tspan x="52"><tspan font-weight="600">Mock-modus er på.</tspan> Svarene er ferdiglagde</tspan><tspan x="52" dy="23">eksempler, og ingen tekst sendes til en</tspan><tspan x="52" dy="23">språkmodell.</tspan></text>
<text x="20" y="194" font-size="14" fill="#5B5247">Steg 3 av 3</text><text x="20" y="223" font-size="21" font-weight="700" fill="#2A2520">Teksten</text><rect x="280" y="211" width="26" height="6" rx="3" fill="#34557A"/><rect x="312" y="211" width="26" height="6" rx="3" fill="#34557A"/><rect x="344" y="211" width="26" height="6" rx="3" fill="#34557A"/><text x="370" y="194" font-size="14" fill="#5B5247" text-anchor="end">Neste: kopier teksten</text>
<rect x="20" y="245" width="350" height="1" fill="#D9CFBE"/>
<text x="20" y="295.3" font-size="26" font-weight="400" fill="#2A2520"><tspan x="20"><tspan font-weight="600">Søknadsutkastet ditt</tspan></tspan></text>
<text x="20" y="331.8" font-size="16" font-weight="400" fill="#2A2520"><tspan x="20">Les gjennom og rett det du vil. Det er ditt</tspan><tspan x="20" dy="26">brev.</tspan></text>
<rect x="20" y="384" width="350" height="74" rx="10" fill="#EAE2D3" stroke="#D9CFBE" stroke-width="1"/><g transform="translate(34 400) scale(0.9167)" fill="none" stroke="#2A2520" color="#2A2520" stroke-width="1.96" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9.2"/><path d="M12 7v5.2l3.4 2"/></g><text x="68" y="414.0" font-size="15" font-weight="400" fill="#2A2520"><tspan x="68"><tspan font-weight="600">Teksten slettes når du logger ut.</tspan> Kopier</tspan><tspan x="68" dy="23">den før det.</tspan></text>
<text x="20" y="495.8" font-size="16" font-weight="400" fill="#2A2520"><tspan x="20"><tspan font-weight="600">Søknadsutkast (kan redigeres)</tspan></tspan></text>
<rect x="20" y="512" width="350" height="420" rx="8" fill="#FFFDF9" stroke="#857A69" stroke-width="1.5"/><text x="36" y="543.8" font-size="16" font-weight="400" fill="#2A2520"><tspan x="36">Søknad på stillingen som sommervikar i</tspan><tspan x="36" dy="26">hjemmetjenesten</tspan><tspan x="36" dy="26"> </tspan><tspan x="36" dy="26">Hei,</tspan><tspan x="36" dy="26"> </tspan><tspan x="36" dy="26">Jeg søker på stillingen som</tspan><tspan x="36" dy="26">sommervikar i hjemmetjenesten i</tspan><tspan x="36" dy="26">Testvik kommune for perioden</tspan><tspan x="36" dy="26">juni–august. Jeg er sykepleierstudent</tspan><tspan x="36" dy="26">på 2. år ved Høgskolen i Testvik og</tspan><tspan x="36" dy="26">trives med å jobbe med mennesker.</tspan><tspan x="36" dy="26"> </tspan><tspan x="36" dy="26">Som besøksvenn i Røde Kors</tspan><tspan x="36" dy="26">besøkstjeneste besøker jeg en eldre</tspan><tspan x="36" dy="26">dame hver uke for samtale og turer. I et</tspan></text><rect x="359" y="520" width="5" height="404" rx="2.5" fill="#EAE2D3"/><rect x="359" y="520" width="5" height="183.6" rx="2.5" fill="#857A69"/>
<rect x="20" y="956" width="350" height="579" rx="12" fill="#EAE2D3"/><rect x="38" y="1011" width="314" height="1" fill="#D9CFBE"/><text x="38" y="991" font-size="17" font-weight="600" fill="#2A2520">Teksten bygger på</text><g transform="translate(330 973) scale(0.9167)" fill="none" stroke="#2A2520" color="#2A2520" stroke-width="1.96" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 14.5L12 9l5.5 5.5"/></g><text x="38" y="1030.7" font-size="14" font-weight="400" fill="#5B5247"><tspan x="38">Grunnlag for den genererte teksten. Egne</tspan><tspan x="38" dy="21">redigeringer kontrolleres ikke automatisk.</tspan></text><text x="38" y="1091.5" font-size="15" font-weight="400" fill="#2A2520"><tspan x="38"><tspan font-weight="600" fill="#5B5247">Stillingen</tspan></tspan></text><g transform="translate(38 1106) scale(0.7500)" fill="none" stroke="#5B5247" color="#5B5247" stroke-width="2.67" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3.5h10A1.5 1.5 0 0 1 18.5 5v14a1.5 1.5 0 0 1-1.5 1.5H7A1.5 1.5 0 0 1 5.5 19V5A1.5 1.5 0 0 1 7 3.5z"/><path d="M9 8h6M9 11.5h6M9 15h3.5"/></g><text x="64" y="1120.0" font-size="15" font-weight="400" fill="#2A2520"><tspan x="64">Sommervikar i hjemmetjenesten</tspan></text><g transform="translate(38 1137) scale(0.7500)" fill="none" stroke="#5B5247" color="#5B5247" stroke-width="2.67" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3.5h10A1.5 1.5 0 0 1 18.5 5v14a1.5 1.5 0 0 1-1.5 1.5H7A1.5 1.5 0 0 1 5.5 19V5A1.5 1.5 0 0 1 7 3.5z"/><path d="M9 8h6M9 11.5h6M9 15h3.5"/></g><text x="64" y="1151.0" font-size="15" font-weight="400" fill="#2A2520"><tspan x="64">Testvik kommune</tspan></text><text x="38" y="1189.5" font-size="15" font-weight="400" fill="#2A2520"><tspan x="38"><tspan font-weight="600" fill="#5B5247">Sitater fra CV-en</tspan></tspan></text><g transform="translate(38 1204) scale(0.7500)" fill="none" stroke="#2D6644" color="#2D6644" stroke-width="2.67" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.2 4.2L19 7"/></g><text x="64" y="1218.0" font-size="15" font-weight="400" fill="#2A2520"><tspan x="64">«Norsk – morsmål»</tspan></text><g transform="translate(38 1235) scale(0.7500)" fill="none" stroke="#2D6644" color="#2D6644" stroke-width="2.67" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.2 4.2L19 7"/></g><text x="64" y="1249.0" font-size="15" font-weight="400" fill="#2A2520"><tspan x="64">«Besøksvenn, Røde Kors</tspan><tspan x="64" dy="23">besøkstjeneste»</tspan></text><g transform="translate(38 1289) scale(0.7500)" fill="none" stroke="#2D6644" color="#2D6644" stroke-width="2.67" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.2 4.2L19 7"/></g><text x="64" y="1303.0" font-size="15" font-weight="400" fill="#2A2520"><tspan x="64">«Gruppeprosjekt i helsefremmende</tspan><tspan x="64" dy="23">arbeid»</tspan></text><text x="38" y="1364.5" font-size="15" font-weight="400" fill="#2A2520"><tspan x="38"><tspan font-weight="600" fill="#5B5247">Ditt svar – oppgitt av deg, ikke kontrollert</tspan></tspan></text><g transform="translate(38 1379) scale(0.7500)" fill="none" stroke="#855000" color="#855000" stroke-width="2.67" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 19.5l1-4.2L15.8 5a1.9 1.9 0 0 1 2.7 0l.5.5a1.9 1.9 0 0 1 0 2.7L8.7 18.5z"/><path d="M14 6.8l3.2 3.2"/></g><text x="64" y="1393.0" font-size="15" font-weight="400" fill="#2A2520"><tspan x="64"><tspan font-weight="600">Førerkort klasse B: </tspan>«Jeg har ikke</tspan><tspan x="64" dy="23">førerkort ennå. Jeg har oppkjøring i</tspan><tspan x="64" dy="23">april.»</tspan></text><text x="38" y="1477.5" font-size="15" font-weight="400" fill="#2A2520"><tspan x="38"><tspan font-weight="600" fill="#5B5247">Ikke brukt som oppfylt</tspan></tspan></text><g transform="translate(38 1492) scale(0.7500)" fill="none" stroke="#5B5247" color="#5B5247" stroke-width="2.67" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9.2"/><path d="M12 11v5.5"/><circle cx="12" cy="7.8" r=".6" fill="currentColor"/></g><text x="64" y="1506.0" font-size="15" font-weight="400" fill="#2A2520"><tspan x="64">Politiattest (ansettelsesvilkår)</tspan></text>
<rect x="20" y="1563" width="350" height="1" fill="#D9CFBE"/><g role="status"><rect x="20" y="1587" width="350" height="74" rx="10" fill="#E3EDE2" stroke="#A8C4AE" stroke-width="1"/><g transform="translate(34 1603) scale(0.9167)" fill="none" stroke="#2D6644" color="#2D6644" stroke-width="1.96" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9.2"/><path d="M7.8 12.3l2.9 2.9 5.5-5.6"/></g><text x="68" y="1617.0" font-size="15" font-weight="400" fill="#2A2520"><tspan x="68"><tspan font-weight="600">Kopiert.</tspan> Lim inn teksten der du skriver</tspan><tspan x="68" dy="23">søknaden.</tspan></text></g><rect x="20" y="1679" width="350" height="50" rx="10" fill="#FFFDF9" stroke="#857A69" stroke-width="1.5"/><g transform="translate(102.57861328125 1694) scale(0.8333)" fill="none" stroke="#2A2520" color="#2A2520" stroke-width="2.16" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H6M11 6.5L5.5 12l5.5 5.5"/></g><text x="132.6" y="1710.0" font-size="17" font-weight="600" fill="#2A2520">Endre svar eller valg</text><rect x="20" y="1741" width="350" height="56" rx="10" fill="#34557A"/><g transform="translate(133.60693359375 1759) scale(0.8333)" fill="none" stroke="#FFFFFF" color="#FFFFFF" stroke-width="2.16" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8.5" y="8.5" width="11.5" height="11.5" rx="1.8"/><path d="M15.5 8.5V5.8A1.8 1.8 0 0 0 13.7 4H5.8A1.8 1.8 0 0 0 4 5.8v7.9a1.8 1.8 0 0 0 1.8 1.8h2.7"/></g><text x="163.6" y="1775.0" font-size="17" font-weight="600" fill="#FFFFFF">Kopier tekst</text><rect x="15.5" y="1736.5" width="359" height="65" rx="14.5" fill="none" stroke="#34557A" stroke-width="3"/>
<text x="20" y="1827.8" font-size="16" font-weight="400" fill="#34557A" text-decoration="underline">Endre CV eller annonse</text>
</svg>
