<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="843" viewBox="0 0 1440 843" role="img" aria-labelledby="t d" lang="nb">
<title id="t">Supersøker: opprett konto med valideringsfeil</title>
<desc id="d">Skjemaet Opprett konto. E-postadressen er beholdt. Passordfeltet er tømt, merket ugyldig med rød ramme og har fokus, med meldingen «Passordet må ha minst 8 tegn. Skriv inn et nytt passord.».</desc>
<style>text{font-family:'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;font-variant-numeric:tabular-nums}.m{font-family:Consolas,'Cascadia Mono','SF Mono',Menlo,'DejaVu Sans Mono',monospace}</style>
<rect width="1440" height="843" fill="#EDF0F4"/>
<rect x="0" y="0" width="1440" height="36" fill="#19212F"/><rect x="32" y="8" width="100" height="20" rx="3" fill="none" stroke="#FFFFFF" stroke-width="1.2"/><text x="82" y="22" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.6">MOCK-MODUS</text><text x="146" y="23" font-size="13" fill="#FFFFFF">Ingen tekst sendes til en språkmodell. Svarene er ferdiglagde eksempler for testparene.</text><rect x="0" y="36" width="1440" height="64" fill="#FFFFFF"/><line x1="0" y1="99.5" x2="1440" y2="99.5" stroke="#CDD3DC" stroke-width="1"/><g transform="translate(32 53) scale(1)" aria-hidden="true"><rect width="30" height="30" rx="6" fill="#1C3D8F"/><path d="M9 6.5h9l4.5 4.5v12.5H9z" fill="#FFFFFF"/><rect x="10.5" y="13" width="10.5" height="3.4" rx="0.8" fill="#FFE36E"/><path d="M11 19.5h8" stroke="#1C3D8F" stroke-width="1.4" stroke-linecap="round"/><path d="M11 10h4.5" stroke="#1C3D8F" stroke-width="1.4" stroke-linecap="round"/></g><text x="72" y="74.5" font-size="19" font-weight="700" fill="#121926">Supersøker</text><text font-size="30" fill="#121926"><tspan font-weight="600" x="160" y="201.2">Søknadstekst som holder seg til</tspan><tspan font-weight="600" x="160" y="239.2">CV-en din</tspan></text><text font-size="17" fill="#4B5565"><tspan x="160" y="278.8">Supersøker sammenligner kravene i en stillingsannonse med</tspan><tspan x="160" y="304.8">CV-en din. Du ser hva som står i CV-en, hva som mangler</tspan><tspan x="160" y="330.8">dokumentasjon, og hva teksten bygger på.</tspan></text><rect x="160" y="362" width="520" height="226" rx="6" fill="#FFFFFF" stroke="#CDD3DC"/><text x="178" y="390" font-size="13" font-weight="600" fill="#4B5565">Slik ser kravene ut i gap-analysen</text><line x1="160" y1="406" x2="680" y2="406" stroke="#CDD3DC" stroke-width="1"/><rect x="178" y="422" width="28" height="18" rx="3" fill="#FFFFFF" stroke="#1C3D8F" stroke-width="1.2"/><text x="192" y="435" font-size="11" font-weight="700" fill="#1C3D8F" text-anchor="middle">K1</text><text x="220" y="435" font-size="15" font-weight="600" fill="#121926">Førerkort klasse B</text><rect x="220" y="446" width="187.4" height="24" rx="4" fill="#FBEEDB"/><g transform="translate(227 450) scale(1)" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="1.2" y="1.2" width="13.6" height="13.6" rx="2.5" stroke="#8A4A0B" stroke-dasharray="2.6 2" stroke-width="1.6"/><path d="M5.5 8h5" stroke="#8A4A0B" stroke-width="1.8"/></g><text x="248" y="462.4" font-size="13" font-weight="600" fill="#8A4A0B">Mangler dokumentasjon</text><text x="420" y="435" font-size="13.5" fill="#4B5565">Står ikke i CV-teksten.</text><line x1="178" y1="484" x2="662" y2="484" stroke="#CDD3DC" stroke-width="1"/><rect x="178" y="500" width="28" height="18" rx="3" fill="#FFFFFF" stroke="#1C3D8F" stroke-width="1.2"/><text x="192" y="513" font-size="11" font-weight="700" fill="#1C3D8F" text-anchor="middle">K2</text><text x="220" y="513" font-size="15" font-weight="600" fill="#121926">Gode norskkunnskaper</text><rect x="220" y="524" width="117.3" height="24" rx="4" fill="#E4F2EA"/><g transform="translate(227 528) scale(1)" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="0.8" y="0.8" width="14.4" height="14.4" rx="2.5" fill="#1B6B43" stroke="none"/><path d="M4.2 8.3l2.5 2.5 5-5.6" stroke="#FFFFFF" stroke-width="1.9"/></g><text x="248" y="540.4" font-size="13" font-weight="600" fill="#1B6B43">Dokumentert</text><rect x="417" y="499" width="124.3" height="22" rx="2" fill="#FFE36E"/><line x1="417" y1="521" x2="541.3" y2="521" stroke="#8F7200" stroke-width="1.5"/><text x="420" y="514.5" font-size="12" fill="#121926" class="m" textLength="118.3" lengthAdjust="spacing">«Norsk – morsmål»</text><text x="420" y="542" font-size="13" fill="#4B5565">CV-tekst, linje 25</text><text x="178" y="572" font-size="12.5" fill="#4B5565">Eksempel fra testpar 1, fiktive data.</text><g transform="translate(160 619) scale(1)" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="7" width="10" height="7.5" rx="1.5" stroke="#4B5565"/><path d="M5.2 7V5.1a2.8 2.8 0 0 1 5.6 0V7" stroke="#4B5565"/></g><text font-size="14.5" fill="#121926"><tspan x="188" y="631.9">Kontoen lagrer bare e-postadressen din og passordet som sikker hash.</tspan></text><g transform="translate(160 651) scale(1)" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.8 4.2h10.4M6.2 4.2V2.6h3.6v1.6M4.2 4.2l.7 9.6h6.2l.7-9.6" stroke="#4B5565"/></g><text font-size="14.5" fill="#121926"><tspan x="188" y="663.9">CV, annonse, svar og tekst slettes når du logger ut, eller etter 30</tspan><tspan x="188" y="685.9">minutter uten aktivitet.</tspan></text><g transform="translate(160 705) scale(1)" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 1.6l5.6 2v4.2c0 3.4-2.4 5.8-5.6 6.8-3.2-1-5.6-3.4-5.6-6.8V3.6z" stroke="#4B5565"/></g><text font-size="14.5" fill="#121926"><tspan x="188" y="717.9">I mock-modus sendes ingenting ut av maskinen.</tspan></text><rect x="840" y="164" width="440" height="504" rx="8" fill="#FFFFFF" stroke="#CDD3DC"/><text font-size="24" fill="#121926"><tspan font-weight="600" x="872" y="220.2">Opprett konto</tspan></text><text font-size="14.5" fill="#4B5565"><tspan x="872" y="249.9">Du trenger bare e-post og passord. Navnet i søknaden</tspan><tspan x="872" y="271.9">hentes fra CV-en.</tspan></text><text font-size="14" fill="#121926"><tspan font-weight="600" x="872" y="310.8">E-post</tspan></text><rect x="872" y="324" width="376" height="40" rx="5" fill="#FFFFFF" stroke="#737D8C" stroke-width="1"/><text x="884" y="349.1" font-size="15" fill="#121926">ida.testesen@example.com</text><text font-size="14" fill="#121926"><tspan font-weight="600" x="872" y="396.8">Passord</tspan></text><text font-size="13" fill="#4B5565"><tspan x="872" y="417.9">Minst 8 tegn.</tspan></text><rect x="872" y="431" width="376" height="40" rx="5" fill="#FFFFFF" stroke="#B0261C" stroke-width="2"/><line x1="885" y1="441" x2="885" y2="461" stroke="#121926" stroke-width="1.5"/><rect x="869" y="428" width="382" height="46" rx="8" fill="none" stroke="#1C3D8F" stroke-width="2.5"/><g transform="translate(872 481) scale(0.938)" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 1.8L15.2 14.2H0.8Z" stroke="#B0261C"/><path d="M8 6.2v3.8" stroke="#B0261C" stroke-width="1.8"/><circle cx="8" cy="12" r="1" fill="#B0261C" stroke="none"/></g><text font-size="13" fill="#B0261C"><tspan font-weight="600" x="894" y="492.9">Passordet må ha minst 8 tegn. Skriv inn et nytt passord.</tspan></text><rect x="872" y="520" width="376" height="44" rx="6" fill="#1C3D8F" stroke="#1C3D8F" stroke-width="1.5"/><text x="1011.6" y="546.8" font-size="14" font-weight="600" fill="#FFFFFF">Opprett konto</text><line x1="872" y1="586" x2="1248" y2="586" stroke="#CDD3DC" stroke-width="1"/><text x="872" y="619" font-size="14.5" fill="#4B5565">Har du allerede konto?</text><text x="1030.7" y="618.9" font-size="14.5" font-weight="600" fill="#1C3D8F" text-decoration="underline">Logg inn</text><line x1="0" y1="798.5" x2="1440" y2="798.5" stroke="#CDD3DC" stroke-width="1"/><g transform="translate(32 812) scale(0.938)" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="8" r="6.8" stroke="#4B5565"/><path d="M8 7.2v4.6" stroke="#4B5565" stroke-width="1.8"/><circle cx="8" cy="4.8" r="1" fill="#4B5565" stroke="none"/></g><text font-size="13" fill="#4B5565"><tspan x="56" y="824.9">Supersøker er et studentprosjekt (IBE160). Bruk bare fiktive CV-er og annonser når du prøver appen.</tspan></text>
</svg>
