<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="975" viewBox="0 0 1440 975" role="img" aria-labelledby="t d" lang="nb">
<title id="t">Supersøker: bekreftelsesdialog for «Endre CV eller annonse»</title>
<desc id="d">Dialog over steg 3. Den lister hva som forkastes: svaret om førerkort, gap-analysen og søknadsutkastet, også egne endringer. CV-teksten og annonsen beholdes. Knappene er Avbryt, som har fokus, og Forkast og endre.</desc>
<style>text{font-family:'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;font-variant-numeric:tabular-nums}.m{font-family:Consolas,'Cascadia Mono','SF Mono',Menlo,'DejaVu Sans Mono',monospace}</style>
<rect width="1440" height="975" fill="#EDF0F4"/>
<rect x="0" y="0" width="1440" height="36" fill="#19212F"/><rect x="32" y="8" width="100" height="20" rx="3" fill="none" stroke="#FFFFFF" stroke-width="1.2"/><text x="82" y="22" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.6">MOCK-MODUS</text><text x="146" y="23" font-size="13" fill="#FFFFFF">Ingen tekst sendes til en språkmodell. Svarene er ferdiglagde eksempler for testparene.</text><rect x="0" y="36" width="1440" height="64" fill="#FFFFFF"/><line x1="0" y1="99.5" x2="1440" y2="99.5" stroke="#CDD3DC" stroke-width="1"/><g transform="translate(32 53) scale(1)" aria-hidden="true"><rect width="30" height="30" rx="6" fill="#1C3D8F"/><path d="M9 6.5h9l4.5 4.5v12.5H9z" fill="#FFFFFF"/><rect x="10.5" y="13" width="10.5" height="3.4" rx="0.8" fill="#FFE36E"/><path d="M11 19.5h8" stroke="#1C3D8F" stroke-width="1.4" stroke-linecap="round"/><path d="M11 10h4.5" stroke="#1C3D8F" stroke-width="1.4" stroke-linecap="round"/></g><text x="72" y="74.5" font-size="19" font-weight="700" fill="#121926">Supersøker</text><rect x="1299" y="50" width="109" height="36" rx="6" fill="#FFFFFF" stroke="#1C3D8F" stroke-width="1.5"/><g transform="translate(1315.5 60) scale(1)" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 2.5H3.5a1 1 0 0 0-1 1v9a1 1 0 0 0 1 1h3" stroke="#1C3D8F"/><path d="M10 4.8L13.2 8 10 11.2M13 8H6.2" stroke="#1C3D8F"/></g><text x="1339.5" y="72.8" font-size="14" font-weight="600" fill="#1C3D8F">Logg ut</text><text x="1283" y="72.4" font-size="13" fill="#4B5565" text-anchor="end">testbruker@example.com</text><rect x="517.7" y="56" width="24" height="24" rx="4" fill="#FFFFFF" stroke="#1B6B43" stroke-width="1.5"/><g transform="translate(521.7 60) scale(1)" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 8.5l3 3 6-7" stroke="#1B6B43"/></g><text x="551.7" y="73" font-size="14" fill="#121926">CV og annonse</text><line x1="661.2" y1="68" x2="685.2" y2="68" stroke="#737D8C" stroke-width="1"/><rect x="695.2" y="56" width="24" height="24" rx="4" fill="#FFFFFF" stroke="#1B6B43" stroke-width="1.5"/><g transform="translate(699.2 60) scale(1)" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 8.5l3 3 6-7" stroke="#1B6B43"/></g><text x="729.2" y="73" font-size="14" fill="#121926">Gap-analyse</text><line x1="819.9" y1="68" x2="843.9" y2="68" stroke="#737D8C" stroke-width="1"/><rect x="847.9" y="96" width="100.3" height="3" fill="#1C3D8F"/><rect x="853.9" y="56" width="24" height="24" rx="4" fill="#1C3D8F"/><text x="865.9" y="72.8" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="887.9" y="73" font-size="14" font-weight="700" fill="#121926">Teksten</text><text font-size="26" fill="#121926"><tspan font-weight="600" x="32" y="153.8">Søknadsutkast: Sommervikar i hjemmetjenesten, Testvik kommune</tspan></text><rect x="1196" y="126" width="212" height="40" rx="6" fill="#FFFFFF" stroke="#1C3D8F" stroke-width="1.5"/><g transform="translate(1212.2 138) scale(1)" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.8 2.6l2.6 2.6-7.6 7.6-3.2.6.6-3.2z" stroke="#1C3D8F"/></g><text x="1236.2" y="150.8" font-size="14" font-weight="600" fill="#1C3D8F">Endre CV eller annonse</text><text font-size="16" fill="#4B5565"><tspan x="32" y="185.4">Omskrivingsvalg: Helt søknadsutkast. Rediger brevet slik du vil, og kopier det når du er fornøyd.</tspan></text><rect x="32" y="214" width="780" height="684" rx="6" fill="#FFFFFF" stroke="#CDD3DC"/><line x1="32" y1="278" x2="812" y2="278" stroke="#CDD3DC" stroke-width="1"/><text x="52" y="246" font-size="15" font-weight="600" fill="#121926">Søknadsbrev</text><text x="152.5" y="246" font-size="14" fill="#4B5565">(kan redigeres)</text><rect x="655" y="226" width="137" height="40" rx="6" fill="#1C3D8F" stroke="#1C3D8F" stroke-width="1.5"/><g transform="translate(671 238) scale(1)" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5.5" y="5.5" width="8.5" height="8.5" rx="1.5" stroke="#FFFFFF"/><path d="M10.5 5.5V3.2a1 1 0 0 0-1-1H3.2a1 1 0 0 0-1 1v6.3a1 1 0 0 0 1 1h2.3" stroke="#FFFFFF"/></g><text x="695" y="250.8" font-size="14" font-weight="600" fill="#FFFFFF">Kopier tekst</text><rect x="52" y="294" width="740" height="486" rx="6" fill="#FFFFFF" stroke="#737D8C" stroke-width="1"/><text font-size="15.5" fill="#121926"><tspan x="72" y="329.8">Hei,</tspan></text><text font-size="15.5" fill="#121926"><tspan x="72" y="368.8">Jeg søker på stillingen som sommervikar i hjemmetjenesten i Testvik kommune for perioden</tspan><tspan x="72" y="393.8">juni–august. Jeg er sykepleierstudent på 2. år ved Høgskolen i Testvik og trives med å jobbe med</tspan><tspan x="72" y="418.8">mennesker.</tspan></text><text font-size="15.5" fill="#121926"><tspan x="72" y="457.8">Siden 2024 har jeg vært besøksvenn i Røde Kors besøkstjeneste, der jeg besøker en eldre dame</tspan><tspan x="72" y="482.8">hver uke for samtale og turer.</tspan></text><text font-size="15.5" fill="#121926"><tspan x="72" y="521.8">I et gruppeprosjekt i helsefremmende arbeid planla og holdt jeg et kurs om fallforebygging for</tspan><tspan x="72" y="546.8">eldre sammen med fire medstudenter. Jeg var ansvarlig for å koordinere gruppens møter.</tspan></text><text font-size="15.5" fill="#121926"><tspan x="72" y="585.8">Norsk er morsmålet mitt. Ved siden av studiene jobber jeg deltid som butikkmedarbeider i</tspan><tspan x="72" y="610.8">Testvik Mat, der jeg hjelper kunder og svarer på spørsmål.</tspan></text><text font-size="15.5" fill="#121926"><tspan x="72" y="649.8">Jeg har ikke førerkort ennå, men jeg har oppkjøring i april.</tspan></text><text font-size="15.5" fill="#121926"><tspan x="72" y="688.8">Jeg ser fram til å høre fra dere.</tspan></text><text font-size="15.5" fill="#121926"><tspan x="72" y="727.8">Vennlig hilsen</tspan><tspan x="72" y="752.8">Ida Testesen</tspan></text><g transform="translate(52 796) scale(0.938)" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="7" width="10" height="7.5" rx="1.5" stroke="#4B5565"/><path d="M5.2 7V5.1a2.8 2.8 0 0 1 5.6 0V7" stroke="#4B5565"/></g><text x="74" y="808" font-size="13.5" fill="#4B5565">Teksten tas vare på mens du er innlogget, og slettes når du logger ut.</text><line x1="32" y1="822" x2="812" y2="822" stroke="#CDD3DC" stroke-width="1"/><rect x="52" y="838" width="216" height="40" rx="6" fill="#FFFFFF" stroke="#1C3D8F" stroke-width="1.5"/><g transform="translate(68.2 850) scale(1)" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 8H3.2M7 4.2L3.2 8 7 11.8" stroke="#1C3D8F"/></g><text x="92.2" y="862.8" font-size="14" font-weight="600" fill="#1C3D8F">Tilbake til gap-analysen</text><text font-size="13.5" fill="#4B5565"><tspan x="284" y="861.6">Der kan du endre svar eller omskrivingsvalg og lage ny tekst.</tspan></text><rect x="828" y="214" width="580" height="524" rx="6" fill="#FFFFFF" stroke="#CDD3DC"/><text font-size="17" fill="#121926"><tspan font-weight="600" x="848" y="249.8">Teksten bygger på</tspan></text><text font-size="13.5" fill="#4B5565"><tspan x="848" y="274.6">Grunnlag for den genererte teksten. Egne redigeringer kontrolleres ikke automatisk.</tspan></text><text x="848" y="310" font-size="13" font-weight="700" fill="#4B5565">Fra annonsen</text><text font-size="14" fill="#121926"><tspan fill="#4B5565" x="848" y="335.8">Stillingstittel:</tspan><tspan font-weight="600"> Sommervikar i hjemmetjenesten</tspan></text><text font-size="14" fill="#121926"><tspan fill="#4B5565" x="848" y="359.8">Arbeidsgiver:</tspan><tspan font-weight="600"> Testvik kommune</tspan></text><line x1="848" y1="382" x2="1388" y2="382" stroke="#CDD3DC" stroke-width="1"/><text x="848" y="408" font-size="13" font-weight="700" fill="#4B5565">Sitater fra CV-teksten</text><rect x="848" y="423" width="28" height="18" rx="3" fill="#FFFFFF" stroke="#1C3D8F" stroke-width="1.2"/><text x="862" y="436" font-size="11" font-weight="700" fill="#1C3D8F" text-anchor="middle">K2</text><rect x="885" y="421" width="124.3" height="22" rx="2" fill="#FFE36E"/><line x1="885" y1="443" x2="1009.3" y2="443" stroke="#8F7200" stroke-width="1.5"/><text x="888" y="436.5" font-size="12" fill="#121926" class="m" textLength="118.3" lengthAdjust="spacing">«Norsk – morsmål»</text><text font-size="13" fill="#4B5565"><tspan x="888" y="461.9">Gode norskkunnskaper, muntlig og skriftlig · CV-tekst, linje 25</tspan></text><rect x="1356" y="420" width="32" height="32" rx="5" fill="#FFFFFF" stroke="#737D8C" stroke-width="1"/><g transform="translate(1364 428) scale(1)" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6l4 4 4-4" stroke="#1C3D8F"/></g><rect x="848" y="480" width="28" height="18" rx="3" fill="#FFFFFF" stroke="#1C3D8F" stroke-width="1.2"/><text x="862" y="493" font-size="11" font-weight="700" fill="#1C3D8F" text-anchor="middle">K3</text><rect x="885" y="478" width="270.5" height="22" rx="2" fill="#FFE36E"/><line x1="885" y1="500" x2="1155.5" y2="500" stroke="#8F7200" stroke-width="1.5"/><text x="888" y="493.5" font-size="12" fill="#121926" class="m" textLength="264.5" lengthAdjust="spacing">«Besøksvenn, Røde Kors besøkstjeneste»</text><text font-size="13" fill="#4B5565"><tspan x="888" y="518.9">Erfaring med eller interesse for å jobbe med mennesker · CV-tekst, linje 17</tspan></text><rect x="1356" y="477" width="32" height="32" rx="5" fill="#FFFFFF" stroke="#737D8C" stroke-width="1"/><g transform="translate(1364 485) scale(1)" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6l4 4 4-4" stroke="#1C3D8F"/></g><rect x="848" y="537" width="28" height="18" rx="3" fill="#FFFFFF" stroke="#1C3D8F" stroke-width="1.2"/><text x="862" y="550" font-size="11" font-weight="700" fill="#1C3D8F" text-anchor="middle">K4</text><rect x="885" y="535" width="284.4" height="22" rx="2" fill="#FFE36E"/><line x1="885" y1="557" x2="1169.4" y2="557" stroke="#8F7200" stroke-width="1.5"/><text x="888" y="550.5" font-size="12" fill="#121926" class="m" textLength="278.4" lengthAdjust="spacing">«Gruppeprosjekt i helsefremmende arbeid»</text><text font-size="13" fill="#4B5565"><tspan x="888" y="575.9">Gode samarbeidsevner · CV-tekst, linje 21</tspan></text><rect x="1356" y="534" width="32" height="32" rx="5" fill="#FFFFFF" stroke="#737D8C" stroke-width="1"/><g transform="translate(1364 542) scale(1)" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6l4 4 4-4" stroke="#1C3D8F"/></g><line x1="848" y1="595" x2="1388" y2="595" stroke="#CDD3DC" stroke-width="1"/><text x="848" y="621" font-size="13" font-weight="700" fill="#4B5565">Dine svar på krav som mangler dokumentasjon</text><rect x="848" y="636" width="28" height="18" rx="3" fill="#FFFFFF" stroke="#1C3D8F" stroke-width="1.2"/><text x="862" y="649" font-size="11" font-weight="700" fill="#1C3D8F" text-anchor="middle">K1</text><text font-size="14" fill="#121926"><tspan font-weight="600" x="888" y="648.8">Førerkort klasse B</tspan></text><text font-size="14" fill="#121926"><tspan fill="#4B5565" x="888" y="672.3">Du svarte:</tspan><tspan > «Jeg har ikke førerkort ennå. Jeg har oppkjøring i april.»</tspan></text><text font-size="13" fill="#4B5565"><tspan x="888" y="695.9">Oppgitt av deg, ikke bekreftet i CV-en. Teksten bevarer at du ikke har førerkort</tspan><tspan x="888" y="714.9">ennå.</tspan></text><line x1="0" y1="930.5" x2="1440" y2="930.5" stroke="#CDD3DC" stroke-width="1"/><g transform="translate(32 944) scale(0.938)" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="8" r="6.8" stroke="#4B5565"/><path d="M8 4.3V8l2.6 1.6" stroke="#4B5565"/></g><text font-size="13" fill="#4B5565"><tspan x="56" y="956.9">Økten avsluttes etter 30 minutter uten aktivitet. CV-tekst, annonse, svar og tekst slettes når du logger ut.</tspan></text><rect x="0" y="36" width="1440" height="939" fill="#121926" opacity="0.6"/><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#0B1220" flood-opacity="0.28"/></filter><rect x="440" y="230" width="560" height="381" rx="8" fill="#FFFFFF" filter="url(#sh)"/><g transform="translate(468 261) scale(1.5)" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 1.8L15.2 14.2H0.8Z" stroke="#8A4A0B"/><path d="M8 6.2v3.8" stroke="#8A4A0B" stroke-width="1.8"/><circle cx="8" cy="12" r="1" fill="#8A4A0B" stroke="none"/></g><text font-size="20" fill="#121926"><tspan font-weight="600" x="504" y="278.8">Endre CV eller annonse?</tspan></text><text font-size="15" fill="#121926"><tspan x="468" y="314.6">Når du endrer CV-en eller annonsen, må kravene analyseres på nytt.</tspan><tspan x="468" y="337.6">Dette blir forkastet:</tspan></text><g transform="translate(470 359) scale(1)" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.8 4.2h10.4M6.2 4.2V2.6h3.6v1.6M4.2 4.2l.7 9.6h6.2l.7-9.6" stroke="#B0261C"/></g><text font-size="15" fill="#121926"><tspan x="496" y="372.6">Svaret ditt på kravet om førerkort klasse B</tspan></text><g transform="translate(470 388) scale(1)" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.8 4.2h10.4M6.2 4.2V2.6h3.6v1.6M4.2 4.2l.7 9.6h6.2l.7-9.6" stroke="#B0261C"/></g><text font-size="15" fill="#121926"><tspan x="496" y="401.6">Gap-analysen</tspan></text><g transform="translate(470 417) scale(1)" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.8 4.2h10.4M6.2 4.2V2.6h3.6v1.6M4.2 4.2l.7 9.6h6.2l.7-9.6" stroke="#B0261C"/></g><text font-size="15" fill="#121926"><tspan x="496" y="430.6">Søknadsutkastet, også endringer du har gjort selv</tspan></text><rect x="468" y="449" width="504" height="70" rx="6" fill="#E6ECF8" stroke="#1C3D8F" stroke-width="1"/><g transform="translate(484 466) scale(1.125)" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="8" r="6.8" stroke="#1C3D8F"/><path d="M8 7.2v4.6" stroke="#1C3D8F" stroke-width="1.8"/><circle cx="8" cy="4.8" r="1" fill="#1C3D8F" stroke="none"/></g><text font-size="14" fill="#121926"><tspan x="512" y="478.3">CV-teksten og annonsen beholdes, slik at du kan redigere dem.</tspan><tspan x="512" y="499.3">Kopier teksten først hvis du vil ta vare på den.</tspan></text><rect x="802" y="543" width="170" height="40" rx="6" fill="#B0261C" stroke="#B0261C" stroke-width="1.5"/><g transform="translate(818 555) scale(1)" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.8 4.2h10.4M6.2 4.2V2.6h3.6v1.6M4.2 4.2l.7 9.6h6.2l.7-9.6" stroke="#FFFFFF"/></g><text x="842" y="567.8" font-size="14" font-weight="600" fill="#FFFFFF">Forkast og endre</text><rect x="713" y="543" width="77" height="40" rx="6" fill="#FFFFFF" stroke="#1C3D8F" stroke-width="1.5"/><text x="729.1" y="567.8" font-size="14" font-weight="600" fill="#1C3D8F">Avbryt</text><rect x="710" y="540" width="83" height="46" rx="9" fill="none" stroke="#1C3D8F" stroke-width="2.5"/>
</svg>
