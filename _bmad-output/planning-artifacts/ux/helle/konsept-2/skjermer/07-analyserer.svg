<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1062" viewBox="0 0 1440 1062" role="img" aria-labelledby="t d" lang="nb">
<title id="t">Supersøker, steg 1: analyserer kravene</title>
<desc id="d">Midtkolonnen viser statusen Analyserer … med en plassholder for kravene, og knappen er deaktivert med teksten Analyserer …. CV-teksten og annonsen er fortsatt synlige og låst mens analysen pågår.</desc>
<style>text{font-family:'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;font-variant-numeric:tabular-nums}.m{font-family:Consolas,'Cascadia Mono','SF Mono',Menlo,'DejaVu Sans Mono',monospace}</style>
<rect width="1440" height="1062" fill="#EDF0F4"/>
<rect x="0" y="0" width="1440" height="36" fill="#19212F"/><rect x="32" y="8" width="100" height="20" rx="3" fill="none" stroke="#FFFFFF" stroke-width="1.2"/><text x="82" y="22" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.6">MOCK-MODUS</text><text x="146" y="23" font-size="13" fill="#FFFFFF">Ingen tekst sendes til en språkmodell. Svarene er ferdiglagde eksempler for testparene.</text><rect x="0" y="36" width="1440" height="64" fill="#FFFFFF"/><line x1="0" y1="99.5" x2="1440" y2="99.5" stroke="#CDD3DC" stroke-width="1"/><g transform="translate(32 53) scale(1)" aria-hidden="true"><rect width="30" height="30" rx="6" fill="#1C3D8F"/><path d="M9 6.5h9l4.5 4.5v12.5H9z" fill="#FFFFFF"/><rect x="10.5" y="13" width="10.5" height="3.4" rx="0.8" fill="#FFE36E"/><path d="M11 19.5h8" stroke="#1C3D8F" stroke-width="1.4" stroke-linecap="round"/><path d="M11 10h4.5" stroke="#1C3D8F" stroke-width="1.4" stroke-linecap="round"/></g><text x="72" y="74.5" font-size="19" font-weight="700" fill="#121926">Supersøker</text><rect x="1299" y="50" width="109" height="36" rx="6" fill="#FFFFFF" stroke="#1C3D8F" stroke-width="1.5"/><g transform="translate(1315.5 60) scale(1)" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 2.5H3.5a1 1 0 0 0-1 1v9a1 1 0 0 0 1 1h3" stroke="#1C3D8F"/><path d="M10 4.8L13.2 8 10 11.2M13 8H6.2" stroke="#1C3D8F"/></g><text x="1339.5" y="72.8" font-size="14" font-weight="600" fill="#1C3D8F">Logg ut</text><text x="1283" y="72.4" font-size="13" fill="#4B5565" text-anchor="end">testbruker@example.com</text><rect x="511.4" y="96" width="150.2" height="3" fill="#1C3D8F"/><rect x="517.4" y="56" width="24" height="24" rx="4" fill="#1C3D8F"/><text x="529.4" y="72.8" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="551.4" y="73" font-size="14" font-weight="700" fill="#121926">CV og annonse</text><line x1="665.5" y1="68" x2="689.5" y2="68" stroke="#737D8C" stroke-width="1"/><rect x="699.5" y="56" width="24" height="24" rx="4" fill="#FFFFFF" stroke="#737D8C" stroke-width="1"/><text x="711.5" y="72.8" font-size="13" font-weight="600" fill="#4B5565" text-anchor="middle">2</text><text x="733.5" y="73" font-size="14" fill="#4B5565">Gap-analyse</text><line x1="824.2" y1="68" x2="848.2" y2="68" stroke="#737D8C" stroke-width="1"/><rect x="858.2" y="56" width="24" height="24" rx="4" fill="#FFFFFF" stroke="#737D8C" stroke-width="1"/><text x="870.2" y="72.8" font-size="13" font-weight="600" fill="#4B5565" text-anchor="middle">3</text><text x="892.2" y="73" font-size="14" fill="#4B5565">Teksten</text><text font-size="26" fill="#121926"><tspan font-weight="600" x="32" y="153.8">Legg inn CV og stillingsannonse</tspan></text><text font-size="16" fill="#4B5565"><tspan x="32" y="185.4">Supersøker sammenligner kravene i annonsen med CV-teksten din. Begge tekstene forblir synlige mens du jobber.</tspan></text><rect x="32" y="214" width="520" height="771" rx="6" fill="#FFFFFF" stroke="#CDD3DC"/><path d="M32.5 266V220a5.5 5.5 0 0 1 5.5-5.5H546a5.5 5.5 0 0 1 5.5 5.5V266Z" fill="#FFFFFF"/><line x1="32" y1="266" x2="552" y2="266" stroke="#CDD3DC" stroke-width="1"/><g transform="translate(48 224) scale(1)" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 1.5h5l3.5 3.5v9.5H4z" stroke="#4B5565"/><path d="M9 1.5V5h3.5" stroke="#4B5565"/></g><text x="72" y="236" font-size="15" font-weight="600" fill="#121926">CV</text><text x="72" y="255" font-size="12.5" fill="#4B5565">Lim inn teksten, eller last opp en TXT-fil eller tekstbasert PDF.</text><text font-size="14" fill="#121926"><tspan font-weight="600" x="52" y="302.8">Hvordan vil du legge inn CV-en?</tspan></text><rect x="52" y="316" width="273" height="36" rx="6" fill="#FFFFFF" stroke="#737D8C" stroke-width="1"/><rect x="54" y="318" width="138.4" height="32" rx="4.5" fill="#1C3D8F"/><g transform="translate(68 326) scale(1)" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="2.8" width="10" height="11.7" rx="1.5" stroke="#FFFFFF"/><rect x="5.8" y="1.3" width="4.4" height="2.8" rx="0.8" stroke="#FFFFFF" fill="#FFFFFF"/><path d="M5.5 8h5M5.5 10.8h3.5" stroke="#FFFFFF"/></g><text x="92" y="338.8" font-size="14" font-weight="600" fill="#FFFFFF">Lim inn tekst</text><g transform="translate(210.4 326) scale(1)" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 10.5V2.5M5 5.5l3-3 3 3" stroke="#121926"/><path d="M2.5 10.5v2a1 1 0 0 0 1 1h9a1 1 0 0 0 1-1v-2" stroke="#121926"/></g><text x="234.4" y="338.8" font-size="14" font-weight="600" fill="#121926">Last opp fil</text><text font-size="14" fill="#121926"><tspan font-weight="600" x="52" y="384.8">CV-tekst</tspan></text><text font-size="13" fill="#4B5565"><tspan x="52" y="405.9">Høyst 10 000 tegn. Analysen bruker teksten slik den står her.</tspan></text><rect x="52" y="419" width="480" height="520" rx="5" fill="#F7F8FA" stroke="#737D8C" stroke-width="1"/><clipPath id="c6"><rect x="53" y="420" width="478" height="504"/></clipPath><g clip-path="url(#c6)"><text x="64" y="442.6" font-size="12" fill="#4B5565" class="m" textLength="83.5" lengthAdjust="spacing">Ida Testesen</text><text x="64" y="461.6" font-size="12" fill="#4B5565" class="m" textLength="174" lengthAdjust="spacing">Testveien 1, 0000 Testvik</text><text x="64" y="480.6" font-size="12" fill="#4B5565" class="m" textLength="222.7" lengthAdjust="spacing">E-post: ida.testesen@example.com</text><text x="64" y="518.6" font-size="12" font-weight="700" fill="#4B5565" class="m" textLength="41.8" lengthAdjust="spacing">PROFIL</text><text x="64" y="537.6" font-size="12" fill="#4B5565" class="m" textLength="368.9" lengthAdjust="spacing">Sykepleierstudent på 2. år som trives med å jobbe med</text><text x="64" y="556.6" font-size="12" fill="#4B5565" class="m" textLength="410.6" lengthAdjust="spacing">mennesker. Pålitelig, blid og vant til å samarbeide i team.</text><text x="64" y="594.6" font-size="12" font-weight="700" fill="#4B5565" class="m" textLength="62.6" lengthAdjust="spacing">UTDANNING</text><text x="64" y="613.6" font-size="12" fill="#4B5565" class="m" textLength="48.7" lengthAdjust="spacing">2025–nå</text><text x="133.6" y="613.6" font-size="12" fill="#4B5565" class="m" textLength="341" lengthAdjust="spacing">Bachelor i sykepleie, Høgskolen i Testvik (2. år)</text><text x="64" y="632.6" font-size="12" fill="#4B5565" class="m" textLength="403.7" lengthAdjust="spacing">2022–2025 Studiespesialisering, Testvik videregående skole</text><text x="64" y="670.6" font-size="12" font-weight="700" fill="#4B5565" class="m" textLength="104.4" lengthAdjust="spacing">ARBEIDSERFARING</text><text x="64" y="689.6" font-size="12" fill="#4B5565" class="m" textLength="48.7" lengthAdjust="spacing">2023–nå</text><text x="133.6" y="689.6" font-size="12" fill="#4B5565" class="m" textLength="271.4" lengthAdjust="spacing">Butikkmedarbeider (deltid), Testvik Mat</text><text x="133.6" y="708.6" font-size="12" fill="#4B5565" class="m" textLength="355" lengthAdjust="spacing">Kundeservice, kassearbeid og varepåfylling. Hjelper</text><text x="133.6" y="727.6" font-size="12" fill="#4B5565" class="m" textLength="327.1" lengthAdjust="spacing">kunder med å finne varer og svarer på spørsmål.</text><text x="64" y="765.6" font-size="12" font-weight="700" fill="#4B5565" class="m" textLength="111.4" lengthAdjust="spacing">FRIVILLIG ARBEID</text><text x="64" y="784.6" font-size="12" fill="#4B5565" class="m" textLength="48.7" lengthAdjust="spacing">2024–nå</text><text x="133.6" y="784.6" font-size="12" fill="#4B5565" class="m" textLength="250.6" lengthAdjust="spacing">Besøksvenn, Røde Kors besøkstjeneste</text><text x="133.6" y="803.6" font-size="12" fill="#4B5565" class="m" textLength="361.9" lengthAdjust="spacing">Besøker en eldre dame hver uke for samtale og turer.</text><text x="64" y="841.6" font-size="12" font-weight="700" fill="#4B5565" class="m" textLength="111.4" lengthAdjust="spacing">STUDIEPROSJEKTER</text><text x="64" y="860.6" font-size="12" fill="#4B5565" class="m" textLength="27.8" lengthAdjust="spacing">2025</text><text x="133.6" y="860.6" font-size="12" fill="#4B5565" class="m" textLength="264.5" lengthAdjust="spacing">Gruppeprosjekt i helsefremmende arbeid</text><text x="133.6" y="879.6" font-size="12" fill="#4B5565" class="m" textLength="361.9" lengthAdjust="spacing">Planla og holdt et kurs om fallforebygging for eldre</text><text x="133.6" y="898.6" font-size="12" fill="#4B5565" class="m" textLength="313.2" lengthAdjust="spacing">sammen med fire medstudenter. Ansvarlig for å</text><text x="133.6" y="917.6" font-size="12" fill="#4B5565" class="m" textLength="181" lengthAdjust="spacing">koordinere gruppens møter.</text><text x="64" y="955.6" font-size="12" font-weight="700" fill="#4B5565" class="m" textLength="34.8" lengthAdjust="spacing">SPRÅK</text><text x="64" y="974.6" font-size="12" fill="#4B5565" class="m" textLength="104.4" lengthAdjust="spacing">Norsk – morsmål</text><text x="64" y="993.6" font-size="12" fill="#4B5565" class="m" textLength="250.6" lengthAdjust="spacing">Engelsk – godt, muntlig og skriftlig</text><text x="64" y="1031.6" font-size="12" font-weight="700" fill="#4B5565" class="m" textLength="34.8" lengthAdjust="spacing">ANNET</text><text x="64" y="1050.6" font-size="12" fill="#4B5565" class="m" textLength="236.6" lengthAdjust="spacing">Førstehjelpskurs, Røde Kors (2024)</text></g><rect x="522" y="423" width="6" height="512" rx="3" fill="#F7F8FA"/><rect x="522" y="423" width="6" height="411.5" rx="3" fill="#737D8C"/><text x="532" y="958" font-size="12.5" fill="#4B5565" text-anchor="end">933 / 10 000 tegn</text><g transform="translate(52 947) scale(0.875)" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="7" width="10" height="7.5" rx="1.5" stroke="#4B5565"/><path d="M5.2 7V5.1a2.8 2.8 0 0 1 5.6 0V7" stroke="#4B5565"/></g><text x="72" y="958" font-size="12.5" fill="#4B5565">Låst mens analysen pågår</text><rect x="568" y="214" width="320" height="656" rx="6" fill="#FFFFFF" stroke="#CDD3DC"/><text font-size="17" fill="#121926"><tspan font-weight="600" x="588" y="249.8">Krav fra annonsen</tspan></text><rect x="588" y="262" width="280" height="64" rx="6" fill="#E6ECF8" stroke="#1C3D8F"/><g transform="translate(602 276) scale(1.125)" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="8" r="6" stroke="#1C3D8F" opacity="0.3"/><path d="M8 2a6 6 0 0 1 6 6" stroke="#1C3D8F" stroke-width="2"/></g><text x="630" y="290" font-size="15" font-weight="600" fill="#1C3D8F">Analyserer …</text><text x="630" y="310" font-size="13" fill="#121926">Vanligvis noen sekunder.</text><text font-size="14" fill="#4B5565"><tspan x="588" y="357.3">Vi sjekker hvert krav i annonsen mot</tspan><tspan x="588" y="378.3">CV-teksten. Inndataene dine er beholdt.</tspan></text><rect x="588" y="398" width="28" height="18" rx="3" fill="#E3E7ED"/><rect x="628" y="400" width="220" height="12" rx="3" fill="#E3E7ED"/><rect x="628" y="420" width="96" height="12" rx="3" fill="#E3E7ED"/><rect x="588" y="448" width="28" height="18" rx="3" fill="#E3E7ED"/><rect x="628" y="450" width="180" height="12" rx="3" fill="#E3E7ED"/><rect x="628" y="470" width="96" height="12" rx="3" fill="#E3E7ED"/><rect x="588" y="498" width="28" height="18" rx="3" fill="#E3E7ED"/><rect x="628" y="500" width="220" height="12" rx="3" fill="#E3E7ED"/><rect x="628" y="520" width="96" height="12" rx="3" fill="#E3E7ED"/><rect x="588" y="548" width="28" height="18" rx="3" fill="#E3E7ED"/><rect x="628" y="550" width="180" height="12" rx="3" fill="#E3E7ED"/><rect x="628" y="570" width="96" height="12" rx="3" fill="#E3E7ED"/><rect x="588" y="602" width="280" height="44" rx="6" fill="#E3E7ED" stroke="#E3E7ED" stroke-width="1.5"/><g transform="translate(672.5 616) scale(1)" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="8" r="6" stroke="#5A6472" opacity="0.3"/><path d="M8 2a6 6 0 0 1 6 6" stroke="#5A6472" stroke-width="2"/></g><text x="696.5" y="628.8" font-size="14" font-weight="600" fill="#5A6472">Analyserer …</text><text font-size="14" fill="#4B5565"><tspan x="588" y="669.3">Knappen er deaktivert til analysen er</tspan><tspan x="588" y="690.3">ferdig, så du ikke starter den to ganger.</tspan></text><line x1="568" y1="714" x2="888" y2="714" stroke="#CDD3DC" stroke-width="1"/><text font-size="14" fill="#121926"><tspan font-weight="600" x="588" y="746.8">Vil du prøve med fiktive data?</tspan></text><text font-size="14" fill="#4B5565"><tspan x="588" y="771.3">Fyller inn CV-en til Ida Testesen og en</tspan><tspan x="588" y="792.3">annonse fra Testvik kommune.</tspan></text><rect x="588" y="810" width="280" height="40" rx="6" fill="#E3E7ED" stroke="#E3E7ED" stroke-width="1.5"/><text x="632.5" y="834.8" font-size="14" font-weight="600" fill="#5A6472">Last inn eksempel (testpar 1)</text><rect x="904" y="214" width="504" height="708" rx="6" fill="#FFFFFF" stroke="#CDD3DC"/><path d="M904.5 266V220a5.5 5.5 0 0 1 5.5-5.5H1402a5.5 5.5 0 0 1 5.5 5.5V266Z" fill="#FFFFFF"/><line x1="904" y1="266" x2="1408" y2="266" stroke="#CDD3DC" stroke-width="1"/><g transform="translate(920 224) scale(1)" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 1.5h5l3.5 3.5v9.5H4z" stroke="#4B5565"/><path d="M9 1.5V5h3.5" stroke="#4B5565"/></g><text x="944" y="236" font-size="15" font-weight="600" fill="#121926">Stillingsannonse</text><text x="944" y="255" font-size="12.5" fill="#4B5565">Lim inn teksten fra annonsen.</text><text font-size="14" fill="#121926"><tspan font-weight="600" x="924" y="302.8">Annonsetekst</tspan></text><text font-size="13" fill="#4B5565"><tspan x="924" y="323.9">Ta med stillingstittel og navn på arbeidsgiver, slik de står i annonsen. Høyst</tspan><tspan x="924" y="342.9">10 000 tegn.</tspan></text><rect x="924" y="356" width="464" height="520" rx="5" fill="#F7F8FA" stroke="#737D8C" stroke-width="1"/><clipPath id="c7"><rect x="925" y="357" width="462" height="504"/></clipPath><g clip-path="url(#c7)"><text x="936" y="379.6" font-size="12" font-weight="700" fill="#4B5565" class="m" textLength="327.1" lengthAdjust="spacing">Sommervikar i hjemmetjenesten – Testvik kommune</text><text x="936" y="417.6" font-size="12" fill="#4B5565" class="m" textLength="396.7" lengthAdjust="spacing">Hjemmetjenesten i Testvik kommune søker sommervikarer for</text><text x="936" y="436.6" font-size="12" fill="#4B5565" class="m" textLength="403.7" lengthAdjust="spacing">perioden juni–august. Du vil bistå brukere i eget hjem med</text><text x="936" y="455.6" font-size="12" fill="#4B5565" class="m" textLength="410.6" lengthAdjust="spacing">praktisk hjelp, personlig stell og sosial kontakt. Arbeidet</text><text x="936" y="474.6" font-size="12" fill="#4B5565" class="m" textLength="292.3" lengthAdjust="spacing">foregår i turnus med dag- og kveldsvakter.</text><text x="936" y="512.6" font-size="12" fill="#4B5565" class="m" textLength="146.2" lengthAdjust="spacing">Vi ser etter deg som:</text><text x="936" y="531.6" font-size="12" fill="#4B5565" class="m" textLength="396.7" lengthAdjust="spacing">- har førerkort klasse B (krav, du kjører kommunens biler</text><text x="936" y="550.6" font-size="12" fill="#4B5565" class="m" textLength="111.4" lengthAdjust="spacing">mellom brukerne)</text><text x="936" y="569.6" font-size="12" fill="#4B5565" class="m" textLength="334.1" lengthAdjust="spacing">- har gode norskkunnskaper, muntlig og skriftlig</text><text x="936" y="588.6" font-size="12" fill="#4B5565" class="m" textLength="417.6" lengthAdjust="spacing">- har erfaring med eller interesse for å jobbe med mennesker</text><text x="936" y="607.6" font-size="12" fill="#4B5565" class="m" textLength="181" lengthAdjust="spacing">- har gode samarbeidsevner</text><text x="936" y="645.6" font-size="12" fill="#4B5565" class="m" textLength="69.6" lengthAdjust="spacing">Vi tilbyr:</text><text x="936" y="664.6" font-size="12" fill="#4B5565" class="m" textLength="153.1" lengthAdjust="spacing">- opplæring første uke</text><text x="936" y="683.6" font-size="12" fill="#4B5565" class="m" textLength="132.2" lengthAdjust="spacing">- lønn etter tariff</text><text x="936" y="702.6" font-size="12" fill="#4B5565" class="m" textLength="264.5" lengthAdjust="spacing">- et godt og inkluderende arbeidsmiljø</text><text x="936" y="740.6" font-size="12" fill="#4B5565" class="m" textLength="146.2" lengthAdjust="spacing">Søknadsfrist: 1. mars</text><text x="936" y="759.6" font-size="12" fill="#4B5565" class="m" textLength="389.8" lengthAdjust="spacing">Kontaktperson: Avdelingsleder, hjemmetjenesten i Testvik</text><text x="936" y="778.6" font-size="12" fill="#4B5565" class="m" textLength="48.7" lengthAdjust="spacing">kommune</text></g><text x="1388" y="895" font-size="12.5" fill="#4B5565" text-anchor="end">685 / 10 000 tegn</text><g transform="translate(924 884) scale(0.875)" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="7" width="10" height="7.5" rx="1.5" stroke="#4B5565"/><path d="M5.2 7V5.1a2.8 2.8 0 0 1 5.6 0V7" stroke="#4B5565"/></g><text x="944" y="895" font-size="12.5" fill="#4B5565">Låst mens analysen pågår</text><line x1="0" y1="1017.5" x2="1440" y2="1017.5" stroke="#CDD3DC" stroke-width="1"/><g transform="translate(32 1031) scale(0.938)" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="8" r="6.8" stroke="#4B5565"/><path d="M8 4.3V8l2.6 1.6" stroke="#4B5565"/></g><text font-size="13" fill="#4B5565"><tspan x="56" y="1043.9">Økten avsluttes etter 30 minutter uten aktivitet. CV-tekst, annonse, svar og tekst slettes når du logger ut.</tspan></text>
</svg>
