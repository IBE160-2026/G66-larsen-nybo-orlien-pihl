<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="390" height="2135" viewBox="0 0 390 2135" role="img" aria-labelledby="t d" lang="nb">
<title id="t">Supersøker på mobil: søknadsutkastet</title>
<desc id="d">Søknadsutkastet på 390 piksler. Hele brevet i et redigerbart felt, en bred Kopier tekst-knapp med fokus og bekreftelsen «Kopiert. Lim inn teksten der du skriver søknaden.», meldingen om sletting ved utlogging, og listen «Teksten bygger på» stablet under med klikkbare sitater og svaret om førerkort.</desc>
<style>text{font-family:'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;font-variant-numeric:tabular-nums}.m{font-family:Consolas,'Cascadia Mono','SF Mono',Menlo,'DejaVu Sans Mono',monospace}</style>
<rect width="390" height="2135" fill="#EDF0F4"/>
<rect x="0" y="0" width="390" height="62" fill="#19212F"/><rect x="16" y="9" width="100" height="20" rx="3" fill="none" stroke="#FFFFFF" stroke-width="1.2"/><text x="66" y="23" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.6">MOCK-MODUS</text><text font-size="12.5" fill="#FFFFFF"><tspan x="16" y="45.3">Ingen tekst sendes til en språkmodell.</tspan></text><rect x="0" y="62" width="390" height="56" fill="#FFFFFF"/><line x1="0" y1="117.5" x2="390" y2="117.5" stroke="#CDD3DC" stroke-width="1"/><g transform="translate(16 75) scale(1)" aria-hidden="true"><rect width="30" height="30" rx="6" fill="#1C3D8F"/><path d="M9 6.5h9l4.5 4.5v12.5H9z" fill="#FFFFFF"/><rect x="10.5" y="13" width="10.5" height="3.4" rx="0.8" fill="#FFE36E"/><path d="M11 19.5h8" stroke="#1C3D8F" stroke-width="1.4" stroke-linecap="round"/><path d="M11 10h4.5" stroke="#1C3D8F" stroke-width="1.4" stroke-linecap="round"/></g><text x="56" y="96.5" font-size="19" font-weight="700" fill="#121926">Supersøker</text><rect x="265" y="72" width="109" height="36" rx="6" fill="#FFFFFF" stroke="#1C3D8F" stroke-width="1.5"/><g transform="translate(281.5 82) scale(1)" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 2.5H3.5a1 1 0 0 0-1 1v9a1 1 0 0 0 1 1h3" stroke="#1C3D8F"/><path d="M10 4.8L13.2 8 10 11.2M13 8H6.2" stroke="#1C3D8F"/></g><text x="305.5" y="94.8" font-size="14" font-weight="600" fill="#1C3D8F">Logg ut</text><rect x="0" y="118" width="390" height="40" fill="#FFFFFF"/><line x1="0" y1="157.5" x2="390" y2="157.5" stroke="#CDD3DC" stroke-width="1"/><rect x="16" y="127" width="22" height="22" rx="4" fill="#1C3D8F"/><text x="27" y="142.5" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text font-size="14" fill="#121926"><tspan fill="#4B5565" x="46" y="142.8">Steg 3 av 3:</tspan><tspan font-weight="700"> Teksten</tspan></text><text font-size="22" fill="#121926"><tspan font-weight="600" x="16" y="200">Søknadsutkast: Sommervikar i</tspan><tspan font-weight="600" x="16" y="229">hjemmetjenesten, Testvik</tspan><tspan font-weight="600" x="16" y="258">kommune</tspan></text><text font-size="15" fill="#4B5565"><tspan x="16" y="287.1">Omskrivingsvalg: Helt søknadsutkast. Rediger</tspan><tspan x="16" y="309.1">brevet slik du vil.</tspan></text><text x="16" y="347" font-size="15" font-weight="600" fill="#121926">Søknadsbrev</text><text x="116.5" y="347" font-size="14" fill="#4B5565">(kan redigeres)</text><rect x="16" y="361" width="358" height="674" rx="6" fill="#FFFFFF" stroke="#737D8C" stroke-width="1"/><text font-size="15" fill="#121926"><tspan x="36" y="395.6">Hei,</tspan></text><text font-size="15" fill="#121926"><tspan x="36" y="430.6">Jeg søker på stillingen som sommervikar i</tspan><tspan x="36" y="453.6">hjemmetjenesten i Testvik kommune for</tspan><tspan x="36" y="476.6">perioden juni–august. Jeg er</tspan><tspan x="36" y="499.6">sykepleierstudent på 2. år ved Høgskolen i</tspan><tspan x="36" y="522.6">Testvik og trives med å jobbe med</tspan><tspan x="36" y="545.6">mennesker.</tspan></text><text font-size="15" fill="#121926"><tspan x="36" y="580.6">Siden 2024 har jeg vært besøksvenn i Røde</tspan><tspan x="36" y="603.6">Kors besøkstjeneste, der jeg besøker en eldre</tspan><tspan x="36" y="626.6">dame hver uke for samtale og turer.</tspan></text><text font-size="15" fill="#121926"><tspan x="36" y="661.6">I et gruppeprosjekt i helsefremmende arbeid</tspan><tspan x="36" y="684.6">planla og holdt jeg et kurs om</tspan><tspan x="36" y="707.6">fallforebygging for eldre sammen med fire</tspan><tspan x="36" y="730.6">medstudenter. Jeg var ansvarlig for å</tspan><tspan x="36" y="753.6">koordinere gruppens møter.</tspan></text><text font-size="15" fill="#121926"><tspan x="36" y="788.6">Norsk er morsmålet mitt. Ved siden av</tspan><tspan x="36" y="811.6">studiene jobber jeg deltid som</tspan><tspan x="36" y="834.6">butikkmedarbeider i Testvik Mat, der jeg</tspan><tspan x="36" y="857.6">hjelper kunder og svarer på spørsmål.</tspan></text><text font-size="15" fill="#121926"><tspan x="36" y="892.6">Jeg har ikke førerkort ennå, men jeg har</tspan><tspan x="36" y="915.6">oppkjøring i april.</tspan></text><text font-size="15" fill="#121926"><tspan x="36" y="950.6">Jeg ser fram til å høre fra dere.</tspan></text><text font-size="15" fill="#121926"><tspan x="36" y="985.6">Vennlig hilsen</tspan><tspan x="36" y="1008.6">Ida Testesen</tspan></text><rect x="16" y="1049" width="358" height="48" rx="6" fill="#1C3D8F" stroke="#1C3D8F" stroke-width="1.5"/><g transform="translate(142.5 1065) scale(1)" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5.5" y="5.5" width="8.5" height="8.5" rx="1.5" stroke="#FFFFFF"/><path d="M10.5 5.5V3.2a1 1 0 0 0-1-1H3.2a1 1 0 0 0-1 1v6.3a1 1 0 0 0 1 1h2.3" stroke="#FFFFFF"/></g><text x="166.5" y="1077.8" font-size="14" font-weight="600" fill="#FFFFFF">Kopier tekst</text><rect x="13" y="1046" width="364" height="54" rx="9" fill="none" stroke="#1C3D8F" stroke-width="2.5"/><g transform="translate(16 1113) scale(1.125)" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="8" r="6.8" stroke="#1B6B43"/><path d="M4.8 8.2l2.2 2.2 4.2-4.6" stroke="#1B6B43" stroke-width="1.8"/></g><text font-size="14" fill="#1B6B43"><tspan font-weight="600" x="42" y="1126.3">Kopiert. Lim inn teksten der du skriver søknaden.</tspan></text><g transform="translate(16 1146) scale(0.938)" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="7" width="10" height="7.5" rx="1.5" stroke="#4B5565"/><path d="M5.2 7V5.1a2.8 2.8 0 0 1 5.6 0V7" stroke="#4B5565"/></g><text font-size="13.5" fill="#4B5565"><tspan x="40" y="1158.6">Teksten tas vare på mens du er innlogget, og slettes</tspan><tspan x="40" y="1178.6">når du logger ut.</tspan></text><rect x="16" y="1206" width="358" height="700" rx="6" fill="#FFFFFF" stroke="#CDD3DC"/><text font-size="17" fill="#121926"><tspan font-weight="600" x="36" y="1241.8">Teksten bygger på</tspan></text><text font-size="13.5" fill="#4B5565"><tspan x="36" y="1266.6">Grunnlag for den genererte teksten. Egne</tspan><tspan x="36" y="1286.6">redigeringer kontrolleres ikke automatisk.</tspan></text><text x="36" y="1322" font-size="13" font-weight="700" fill="#4B5565">Fra annonsen</text><text font-size="14" fill="#121926"><tspan fill="#4B5565" x="36" y="1347.8">Stillingstittel:</tspan><tspan font-weight="600"> Sommervikar i hjemmetjenesten</tspan></text><text font-size="14" fill="#121926"><tspan fill="#4B5565" x="36" y="1371.8">Arbeidsgiver:</tspan><tspan font-weight="600"> Testvik kommune</tspan></text><line x1="36" y1="1394" x2="354" y2="1394" stroke="#CDD3DC" stroke-width="1"/><text x="36" y="1420" font-size="13" font-weight="700" fill="#4B5565">Sitater fra CV-teksten</text><rect x="36" y="1435" width="28" height="18" rx="3" fill="#FFFFFF" stroke="#1C3D8F" stroke-width="1.2"/><text x="50" y="1448" font-size="11" font-weight="700" fill="#1C3D8F" text-anchor="middle">K2</text><rect x="33" y="1482" width="119.4" height="22" rx="2" fill="#FFE36E"/><line x1="33" y1="1504" x2="152.4" y2="1504" stroke="#8F7200" stroke-width="1.5"/><text x="36" y="1497.5" font-size="11.5" fill="#121926" class="m" textLength="113.4" lengthAdjust="spacing">«Norsk – morsmål»</text><text x="36" y="1524" font-size="13" fill="#4B5565">CV-tekst, linje 25</text><text font-size="13.5" fill="#121926"><tspan x="76" y="1448.6">Gode norskkunnskaper, muntlig og</tspan><tspan x="76" y="1468.6">skriftlig</tspan></text><rect x="322" y="1432" width="32" height="32" rx="5" fill="#FFFFFF" stroke="#737D8C" stroke-width="1"/><g transform="translate(330 1440) scale(1)" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6l4 4 4-4" stroke="#1C3D8F"/></g><rect x="36" y="1543" width="28" height="18" rx="3" fill="#FFFFFF" stroke="#1C3D8F" stroke-width="1.2"/><text x="50" y="1556" font-size="11" font-weight="700" fill="#1C3D8F" text-anchor="middle">K3</text><rect x="33" y="1590" width="259.5" height="22" rx="2" fill="#FFE36E"/><line x1="33" y1="1612" x2="292.5" y2="1612" stroke="#8F7200" stroke-width="1.5"/><text x="36" y="1605.5" font-size="11.5" fill="#121926" class="m" textLength="253.5" lengthAdjust="spacing">«Besøksvenn, Røde Kors besøkstjeneste»</text><text x="36" y="1632" font-size="13" fill="#4B5565">CV-tekst, linje 17</text><text font-size="13.5" fill="#121926"><tspan x="76" y="1556.6">Erfaring med eller interesse for å</tspan><tspan x="76" y="1576.6">jobbe med mennesker</tspan></text><rect x="322" y="1540" width="32" height="32" rx="5" fill="#FFFFFF" stroke="#737D8C" stroke-width="1"/><g transform="translate(330 1548) scale(1)" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6l4 4 4-4" stroke="#1C3D8F"/></g><rect x="36" y="1651" width="28" height="18" rx="3" fill="#FFFFFF" stroke="#1C3D8F" stroke-width="1.2"/><text x="50" y="1664" font-size="11" font-weight="700" fill="#1C3D8F" text-anchor="middle">K4</text><rect x="33" y="1680" width="272.8" height="22" rx="2" fill="#FFE36E"/><line x1="33" y1="1702" x2="305.8" y2="1702" stroke="#8F7200" stroke-width="1.5"/><text x="36" y="1695.5" font-size="11.5" fill="#121926" class="m" textLength="266.8" lengthAdjust="spacing">«Gruppeprosjekt i helsefremmende arbeid»</text><text x="36" y="1722" font-size="13" fill="#4B5565">CV-tekst, linje 21</text><text font-size="13.5" fill="#121926"><tspan x="76" y="1664.6">Gode samarbeidsevner</tspan></text><rect x="322" y="1648" width="32" height="32" rx="5" fill="#FFFFFF" stroke="#737D8C" stroke-width="1"/><g transform="translate(330 1656) scale(1)" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6l4 4 4-4" stroke="#1C3D8F"/></g><line x1="36" y1="1742" x2="354" y2="1742" stroke="#CDD3DC" stroke-width="1"/><text x="36" y="1768" font-size="13" font-weight="700" fill="#4B5565">Dine svar på krav som mangler dokumentasjon</text><rect x="36" y="1783" width="28" height="18" rx="3" fill="#FFFFFF" stroke="#1C3D8F" stroke-width="1.2"/><text x="50" y="1796" font-size="11" font-weight="700" fill="#1C3D8F" text-anchor="middle">K1</text><text font-size="14" fill="#121926"><tspan font-weight="600" x="76" y="1795.8">Førerkort klasse B</tspan></text><text font-size="14" fill="#121926"><tspan fill="#4B5565" x="76" y="1819.3">Du svarte:</tspan><tspan > «Jeg har ikke førerkort ennå.</tspan><tspan x="76" y="1840.3">Jeg har oppkjøring i april.»</tspan></text><text font-size="13" fill="#4B5565"><tspan x="76" y="1863.9">Oppgitt av deg, ikke bekreftet i CV-en.</tspan><tspan x="76" y="1882.9">Teksten bevarer at du ikke har førerkort ennå.</tspan></text><rect x="16" y="1924" width="358" height="44" rx="6" fill="#FFFFFF" stroke="#1C3D8F" stroke-width="1.5"/><g transform="translate(103.2 1938) scale(1)" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 8H3.2M7 4.2L3.2 8 7 11.8" stroke="#1C3D8F"/></g><text x="127.2" y="1950.8" font-size="14" font-weight="600" fill="#1C3D8F">Tilbake til gap-analysen</text><rect x="16" y="1980" width="358" height="44" rx="6" fill="#FFFFFF" stroke="#1C3D8F" stroke-width="1.5"/><g transform="translate(105.2 1994) scale(1)" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.8 2.6l2.6 2.6-7.6 7.6-3.2.6.6-3.2z" stroke="#1C3D8F"/></g><text x="129.2" y="2006.8" font-size="14" font-weight="600" fill="#1C3D8F">Endre CV eller annonse</text><line x1="0" y1="2052.5" x2="390" y2="2052.5" stroke="#CDD3DC" stroke-width="1"/><g transform="translate(16 2066) scale(0.938)" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="8" r="6.8" stroke="#4B5565"/><path d="M8 4.3V8l2.6 1.6" stroke="#4B5565"/></g><text font-size="13" fill="#4B5565"><tspan x="40" y="2078.9">Økten avsluttes etter 30 minutter uten aktivitet.</tspan><tspan x="40" y="2097.9">CV-tekst, annonse, svar og tekst slettes når du logger</tspan><tspan x="40" y="2116.9">ut.</tspan></text>
</svg>
