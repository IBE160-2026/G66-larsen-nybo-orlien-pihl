<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="962" viewBox="0 0 1440 962" role="img" aria-labelledby="t d" lang="nb">
<title id="t">Supersøker, steg 1: CV og annonse, tom tilstand</title>
<desc id="d">Tre kolonner: CV-feltet med veksleren Lim inn tekst eller Last opp fil, en midtkolonne som forklarer at kravene vises der med nummer og sitat, med knappene Analyser kravene og Last inn eksempel (testpar 1), og annonsefeltet med hjelpetekst om stillingstittel og arbeidsgiver.</desc>
<style>text{font-family:'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;font-variant-numeric:tabular-nums}.m{font-family:Consolas,'Cascadia Mono','SF Mono',Menlo,'DejaVu Sans Mono',monospace}</style>
<rect width="1440" height="962" fill="#EDF0F4"/>
<rect x="0" y="0" width="1440" height="36" fill="#19212F"/><rect x="32" y="8" width="100" height="20" rx="3" fill="none" stroke="#FFFFFF" stroke-width="1.2"/><text x="82" y="22" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.6">MOCK-MODUS</text><text x="146" y="23" font-size="13" fill="#FFFFFF">Ingen tekst sendes til en språkmodell. Svarene er ferdiglagde eksempler for testparene.</text><rect x="0" y="36" width="1440" height="64" fill="#FFFFFF"/><line x1="0" y1="99.5" x2="1440" y2="99.5" stroke="#CDD3DC" stroke-width="1"/><g transform="translate(32 53) scale(1)" aria-hidden="true"><rect width="30" height="30" rx="6" fill="#1C3D8F"/><path d="M9 6.5h9l4.5 4.5v12.5H9z" fill="#FFFFFF"/><rect x="10.5" y="13" width="10.5" height="3.4" rx="0.8" fill="#FFE36E"/><path d="M11 19.5h8" stroke="#1C3D8F" stroke-width="1.4" stroke-linecap="round"/><path d="M11 10h4.5" stroke="#1C3D8F" stroke-width="1.4" stroke-linecap="round"/></g><text x="72" y="74.5" font-size="19" font-weight="700" fill="#121926">Supersøker</text><rect x="1299" y="50" width="109" height="36" rx="6" fill="#FFFFFF" stroke="#1C3D8F" stroke-width="1.5"/><g transform="translate(1315.5 60) scale(1)" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 2.5H3.5a1 1 0 0 0-1 1v9a1 1 0 0 0 1 1h3" stroke="#1C3D8F"/><path d="M10 4.8L13.2 8 10 11.2M13 8H6.2" stroke="#1C3D8F"/></g><text x="1339.5" y="72.8" font-size="14" font-weight="600" fill="#1C3D8F">Logg ut</text><text x="1283" y="72.4" font-size="13" fill="#4B5565" text-anchor="end">testbruker@example.com</text><rect x="511.4" y="96" width="150.2" height="3" fill="#1C3D8F"/><rect x="517.4" y="56" width="24" height="24" rx="4" fill="#1C3D8F"/><text x="529.4" y="72.8" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="551.4" y="73" font-size="14" font-weight="700" fill="#121926">CV og annonse</text><line x1="665.5" y1="68" x2="689.5" y2="68" stroke="#737D8C" stroke-width="1"/><rect x="699.5" y="56" width="24" height="24" rx="4" fill="#FFFFFF" stroke="#737D8C" stroke-width="1"/><text x="711.5" y="72.8" font-size="13" font-weight="600" fill="#4B5565" text-anchor="middle">2</text><text x="733.5" y="73" font-size="14" fill="#4B5565">Gap-analyse</text><line x1="824.2" y1="68" x2="848.2" y2="68" stroke="#737D8C" stroke-width="1"/><rect x="858.2" y="56" width="24" height="24" rx="4" fill="#FFFFFF" stroke="#737D8C" stroke-width="1"/><text x="870.2" y="72.8" font-size="13" font-weight="600" fill="#4B5565" text-anchor="middle">3</text><text x="892.2" y="73" font-size="14" fill="#4B5565">Teksten</text><text font-size="26" fill="#121926"><tspan font-weight="600" x="32" y="153.8">Legg inn CV og stillingsannonse</tspan></text><text font-size="16" fill="#4B5565"><tspan x="32" y="185.4">Supersøker sammenligner kravene i annonsen med CV-teksten din. Begge tekstene forblir synlige mens du jobber.</tspan></text><rect x="32" y="214" width="520" height="671" rx="6" fill="#FFFFFF" stroke="#CDD3DC"/><path d="M32.5 266V220a5.5 5.5 0 0 1 5.5-5.5H546a5.5 5.5 0 0 1 5.5 5.5V266Z" fill="#FFFFFF"/><line x1="32" y1="266" x2="552" y2="266" stroke="#CDD3DC" stroke-width="1"/><g transform="translate(48 224) scale(1)" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 1.5h5l3.5 3.5v9.5H4z" stroke="#4B5565"/><path d="M9 1.5V5h3.5" stroke="#4B5565"/></g><text x="72" y="236" font-size="15" font-weight="600" fill="#121926">CV</text><text x="72" y="255" font-size="12.5" fill="#4B5565">Lim inn teksten, eller last opp en TXT-fil eller tekstbasert PDF.</text><text font-size="14" fill="#121926"><tspan font-weight="600" x="52" y="302.8">Hvordan vil du legge inn CV-en?</tspan></text><rect x="52" y="316" width="273" height="36" rx="6" fill="#FFFFFF" stroke="#737D8C" stroke-width="1"/><rect x="54" y="318" width="138.4" height="32" rx="4.5" fill="#1C3D8F"/><g transform="translate(68 326) scale(1)" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="2.8" width="10" height="11.7" rx="1.5" stroke="#FFFFFF"/><rect x="5.8" y="1.3" width="4.4" height="2.8" rx="0.8" stroke="#FFFFFF" fill="#FFFFFF"/><path d="M5.5 8h5M5.5 10.8h3.5" stroke="#FFFFFF"/></g><text x="92" y="338.8" font-size="14" font-weight="600" fill="#FFFFFF">Lim inn tekst</text><g transform="translate(210.4 326) scale(1)" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 10.5V2.5M5 5.5l3-3 3 3" stroke="#121926"/><path d="M2.5 10.5v2a1 1 0 0 0 1 1h9a1 1 0 0 0 1-1v-2" stroke="#121926"/></g><text x="234.4" y="338.8" font-size="14" font-weight="600" fill="#121926">Last opp fil</text><text font-size="14" fill="#121926"><tspan font-weight="600" x="52" y="384.8">CV-tekst</tspan></text><text font-size="13" fill="#4B5565"><tspan x="52" y="405.9">Høyst 10 000 tegn. Analysen bruker teksten slik den står her.</tspan></text><rect x="52" y="419" width="480" height="420" rx="5" fill="#FFFFFF" stroke="#737D8C" stroke-width="1"/><text font-size="14" fill="#4B5565"><tspan x="64" y="444.3">Lim inn CV-en din her, eller bytt til «Last opp fil».</tspan></text><text x="532" y="858" font-size="12.5" fill="#4B5565" text-anchor="end">0 / 10 000 tegn</text><rect x="568" y="214" width="320" height="492" rx="6" fill="#FFFFFF" stroke="#CDD3DC"/><text font-size="17" fill="#121926"><tspan font-weight="600" x="588" y="249.8">Krav fra annonsen</tspan></text><text font-size="14" fill="#4B5565"><tspan x="588" y="277.3">Når du trykker «Analyser kravene», vises</tspan><tspan x="588" y="298.3">kravene fra annonsen her. Et krav som står</tspan><tspan x="588" y="319.3">i CV-en, får et nummer og et ordrett sitat,</tspan><tspan x="588" y="340.3">og samme nummer markeres i CV-teksten.</tspan></text><rect x="588" y="360" width="280" height="92" rx="6" fill="#F7F8FA" stroke="#737D8C" stroke-dasharray="4 3"/><rect x="600" y="374" width="28" height="18" rx="3" fill="#FFFFFF" stroke="#1C3D8F" stroke-width="1.2"/><text x="614" y="387" font-size="11" font-weight="700" fill="#1C3D8F" text-anchor="middle">K2</text><rect x="640" y="376" width="120" height="12" rx="3" fill="#CDD3DC"/><g transform="translate(640 398) scale(0.875)" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="0.8" y="0.8" width="14.4" height="14.4" rx="2.5" fill="#1B6B43" stroke="none"/><path d="M4.2 8.3l2.5 2.5 5-5.6" stroke="#FFFFFF" stroke-width="1.9"/></g><text x="660" y="410" font-size="12.5" font-weight="600" fill="#1B6B43">Dokumentert</text><rect x="640" y="422" width="132" height="20" rx="2" fill="#FFE36E"/><text x="644" y="436" font-size="11.5" fill="#121926" class="m" textLength="113.4" lengthAdjust="spacing">«Norsk – morsmål»</text><text x="856" y="436" font-size="12" fill="#4B5565" text-anchor="end">linje 25</text><text x="588" y="471" font-size="12.5" fill="#4B5565">Eksempel på hvordan et krav vises</text><rect x="588" y="488" width="280" height="44" rx="6" fill="#1C3D8F" stroke="#1C3D8F" stroke-width="1.5"/><g transform="translate(658.7 502) scale(1)" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8h9.8M9 4.2L12.8 8 9 11.8" stroke="#FFFFFF"/></g><text x="682.7" y="514.8" font-size="14" font-weight="600" fill="#FFFFFF">Analyser kravene</text><line x1="568" y1="550" x2="888" y2="550" stroke="#CDD3DC" stroke-width="1"/><text font-size="14" fill="#121926"><tspan font-weight="600" x="588" y="582.8">Vil du prøve med fiktive data?</tspan></text><text font-size="14" fill="#4B5565"><tspan x="588" y="607.3">Fyller inn CV-en til Ida Testesen og en</tspan><tspan x="588" y="628.3">annonse fra Testvik kommune.</tspan></text><rect x="588" y="646" width="280" height="40" rx="6" fill="#FFFFFF" stroke="#1C3D8F" stroke-width="1.5"/><text x="632.5" y="670.8" font-size="14" font-weight="600" fill="#1C3D8F">Last inn eksempel (testpar 1)</text><rect x="585" y="643" width="286" height="46" rx="9" fill="none" stroke="#1C3D8F" stroke-width="2.5"/><rect x="904" y="214" width="504" height="608" rx="6" fill="#FFFFFF" stroke="#CDD3DC"/><path d="M904.5 266V220a5.5 5.5 0 0 1 5.5-5.5H1402a5.5 5.5 0 0 1 5.5 5.5V266Z" fill="#FFFFFF"/><line x1="904" y1="266" x2="1408" y2="266" stroke="#CDD3DC" stroke-width="1"/><g transform="translate(920 224) scale(1)" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 1.5h5l3.5 3.5v9.5H4z" stroke="#4B5565"/><path d="M9 1.5V5h3.5" stroke="#4B5565"/></g><text x="944" y="236" font-size="15" font-weight="600" fill="#121926">Stillingsannonse</text><text x="944" y="255" font-size="12.5" fill="#4B5565">Lim inn teksten fra annonsen.</text><text font-size="14" fill="#121926"><tspan font-weight="600" x="924" y="302.8">Annonsetekst</tspan></text><text font-size="13" fill="#4B5565"><tspan x="924" y="323.9">Ta med stillingstittel og navn på arbeidsgiver, slik de står i annonsen. Høyst</tspan><tspan x="924" y="342.9">10 000 tegn.</tspan></text><rect x="924" y="356" width="464" height="420" rx="5" fill="#FFFFFF" stroke="#737D8C" stroke-width="1"/><text font-size="14" fill="#4B5565"><tspan x="936" y="381.3">Lim inn annonsen her.</tspan></text><text x="1388" y="795" font-size="12.5" fill="#4B5565" text-anchor="end">0 / 10 000 tegn</text><line x1="0" y1="917.5" x2="1440" y2="917.5" stroke="#CDD3DC" stroke-width="1"/><g transform="translate(32 931) scale(0.938)" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="8" r="6.8" stroke="#4B5565"/><path d="M8 4.3V8l2.6 1.6" stroke="#4B5565"/></g><text font-size="13" fill="#4B5565"><tspan x="56" y="943.9">Økten avsluttes etter 30 minutter uten aktivitet. CV-tekst, annonse, svar og tekst slettes når du logger ut.</tspan></text>
</svg>
