<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1047" viewBox="0 0 1440 1047" role="img" aria-labelledby="t d" lang="nb">
<title id="t">Supersøker, steg 1: feil ved opplasting og tomt annonsefelt</title>
<desc id="d">CV-kolonnen viser feilmeldingen om at cv-ida-skannet.pdf ikke kunne leses, med valg om ny fil eller innliming, og at den forrige CV-teksten er beholdt. Annonsefeltet er tomt, merket ugyldig med rød ramme og melding, og har fokus. Midtkolonnen sier at analysen ikke startet.</desc>
<style>text{font-family:'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;font-variant-numeric:tabular-nums}.m{font-family:Consolas,'Cascadia Mono','SF Mono',Menlo,'DejaVu Sans Mono',monospace}</style>
<rect width="1440" height="1047" fill="#EDF0F4"/>
<rect x="0" y="0" width="1440" height="36" fill="#19212F"/><rect x="32" y="8" width="100" height="20" rx="3" fill="none" stroke="#FFFFFF" stroke-width="1.2"/><text x="82" y="22" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.6">MOCK-MODUS</text><text x="146" y="23" font-size="13" fill="#FFFFFF">Ingen tekst sendes til en språkmodell. Svarene er ferdiglagde eksempler for testparene.</text><rect x="0" y="36" width="1440" height="64" fill="#FFFFFF"/><line x1="0" y1="99.5" x2="1440" y2="99.5" stroke="#CDD3DC" stroke-width="1"/><g transform="translate(32 53) scale(1)" aria-hidden="true"><rect width="30" height="30" rx="6" fill="#1C3D8F"/><path d="M9 6.5h9l4.5 4.5v12.5H9z" fill="#FFFFFF"/><rect x="10.5" y="13" width="10.5" height="3.4" rx="0.8" fill="#FFE36E"/><path d="M11 19.5h8" stroke="#1C3D8F" stroke-width="1.4" stroke-linecap="round"/><path d="M11 10h4.5" stroke="#1C3D8F" stroke-width="1.4" stroke-linecap="round"/></g><text x="72" y="74.5" font-size="19" font-weight="700" fill="#121926">Supersøker</text><rect x="1299" y="50" width="109" height="36" rx="6" fill="#FFFFFF" stroke="#1C3D8F" stroke-width="1.5"/><g transform="translate(1315.5 60) scale(1)" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 2.5H3.5a1 1 0 0 0-1 1v9a1 1 0 0 0 1 1h3" stroke="#1C3D8F"/><path d="M10 4.8L13.2 8 10 11.2M13 8H6.2" stroke="#1C3D8F"/></g><text x="1339.5" y="72.8" font-size="14" font-weight="600" fill="#1C3D8F">Logg ut</text><text x="1283" y="72.4" font-size="13" fill="#4B5565" text-anchor="end">testbruker@example.com</text><rect x="511.4" y="96" width="150.2" height="3" fill="#1C3D8F"/><rect x="517.4" y="56" width="24" height="24" rx="4" fill="#1C3D8F"/><text x="529.4" y="72.8" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="551.4" y="73" font-size="14" font-weight="700" fill="#121926">CV og annonse</text><line x1="665.5" y1="68" x2="689.5" y2="68" stroke="#737D8C" stroke-width="1"/><rect x="699.5" y="56" width="24" height="24" rx="4" fill="#FFFFFF" stroke="#737D8C" stroke-width="1"/><text x="711.5" y="72.8" font-size="13" font-weight="600" fill="#4B5565" text-anchor="middle">2</text><text x="733.5" y="73" font-size="14" fill="#4B5565">Gap-analyse</text><line x1="824.2" y1="68" x2="848.2" y2="68" stroke="#737D8C" stroke-width="1"/><rect x="858.2" y="56" width="24" height="24" rx="4" fill="#FFFFFF" stroke="#737D8C" stroke-width="1"/><text x="870.2" y="72.8" font-size="13" font-weight="600" fill="#4B5565" text-anchor="middle">3</text><text x="892.2" y="73" font-size="14" fill="#4B5565">Teksten</text><text font-size="26" fill="#121926"><tspan font-weight="600" x="32" y="153.8">Legg inn CV og stillingsannonse</tspan></text><text font-size="16" fill="#4B5565"><tspan x="32" y="185.4">Supersøker sammenligner kravene i annonsen med CV-teksten din. Begge tekstene forblir synlige mens du jobber.</tspan></text><rect x="32" y="214" width="520" height="756" rx="6" fill="#FFFFFF" stroke="#CDD3DC"/><path d="M32.5 266V220a5.5 5.5 0 0 1 5.5-5.5H546a5.5 5.5 0 0 1 5.5 5.5V266Z" fill="#FFFFFF"/><line x1="32" y1="266" x2="552" y2="266" stroke="#CDD3DC" stroke-width="1"/><g transform="translate(48 224) scale(1)" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 1.5h5l3.5 3.5v9.5H4z" stroke="#4B5565"/><path d="M9 1.5V5h3.5" stroke="#4B5565"/></g><text x="72" y="236" font-size="15" font-weight="600" fill="#121926">CV</text><text x="72" y="255" font-size="12.5" fill="#4B5565">Lim inn teksten, eller last opp en TXT-fil eller tekstbasert PDF.</text><text font-size="14" fill="#121926"><tspan font-weight="600" x="52" y="302.8">Hvordan vil du legge inn CV-en?</tspan></text><rect x="52" y="316" width="273" height="36" rx="6" fill="#FFFFFF" stroke="#737D8C" stroke-width="1"/><g transform="translate(68 326) scale(1)" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="2.8" width="10" height="11.7" rx="1.5" stroke="#121926"/><rect x="5.8" y="1.3" width="4.4" height="2.8" rx="0.8" stroke="#121926" fill="#FFFFFF"/><path d="M5.5 8h5M5.5 10.8h3.5" stroke="#121926"/></g><text x="92" y="338.8" font-size="14" font-weight="600" fill="#121926">Lim inn tekst</text><rect x="196.4" y="318" width="126.5" height="32" rx="4.5" fill="#1C3D8F"/><g transform="translate(210.4 326) scale(1)" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 10.5V2.5M5 5.5l3-3 3 3" stroke="#FFFFFF"/><path d="M2.5 10.5v2a1 1 0 0 0 1 1h9a1 1 0 0 0 1-1v-2" stroke="#FFFFFF"/></g><text x="234.4" y="338.8" font-size="14" font-weight="600" fill="#FFFFFF">Last opp fil</text><rect x="52" y="370" width="480" height="187" rx="6" fill="#FCEAE8" stroke="#B0261C" stroke-width="1"/><g transform="translate(68 387) scale(1.125)" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 1.8L15.2 14.2H0.8Z" stroke="#B0261C"/><path d="M8 6.2v3.8" stroke="#B0261C" stroke-width="1.8"/><circle cx="8" cy="12" r="1" fill="#B0261C" stroke="none"/></g><text font-size="14" fill="#121926"><tspan font-weight="600" x="96" y="399.3">Vi kunne ikke lese filen cv-ida-skannet.pdf.</tspan></text><text font-size="14" fill="#121926"><tspan x="96" y="422.3">Den ser ut til å være skannet som bilde, så den inneholder</tspan><tspan x="96" y="443.3">ingen tekst vi kan lese. Prøv en TXT-fil eller tekstbasert PDF,</tspan><tspan x="96" y="464.3">eller lim inn teksten.</tspan></text><text font-size="14" fill="#121926"><tspan x="96" y="489.3">Den forrige CV-teksten din er beholdt.</tspan></text><rect x="96" y="507" width="170" height="36" rx="6" fill="#FFFFFF" stroke="#1C3D8F" stroke-width="1.5"/><g transform="translate(112.3 517) scale(1)" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 10.5V2.5M5 5.5l3-3 3 3" stroke="#1C3D8F"/><path d="M2.5 10.5v2a1 1 0 0 0 1 1h9a1 1 0 0 0 1-1v-2" stroke="#1C3D8F"/></g><text x="136.3" y="529.8" font-size="14" font-weight="600" fill="#1C3D8F">Velg en annen fil</text><g transform="translate(294.4 517) scale(1)" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="2.8" width="10" height="11.7" rx="1.5" stroke="#1C3D8F"/><rect x="5.8" y="1.3" width="4.4" height="2.8" rx="0.8" stroke="#1C3D8F" fill="#FFFFFF"/><path d="M5.5 8h5M5.5 10.8h3.5" stroke="#1C3D8F"/></g><text x="318.4" y="529.8" font-size="14" font-weight="600" fill="#1C3D8F">Lim inn tekst i stedet</text><text font-size="14" fill="#121926"><tspan font-weight="600" x="52" y="589.8">CV-tekst</tspan></text><text font-size="13" fill="#4B5565"><tspan x="52" y="610.9">Høyst 10 000 tegn. Analysen bruker teksten slik den står her.</tspan></text><rect x="52" y="624" width="480" height="300" rx="5" fill="#FFFFFF" stroke="#737D8C" stroke-width="1"/><clipPath id="c3"><rect x="53" y="625" width="478" height="276"/></clipPath><g clip-path="url(#c3)"><text x="64" y="647.6" font-size="12" fill="#121926" class="m" textLength="83.5" lengthAdjust="spacing">Ida Testesen</text><text x="64" y="666.6" font-size="12" fill="#121926" class="m" textLength="174" lengthAdjust="spacing">Testveien 1, 0000 Testvik</text><text x="64" y="685.6" font-size="12" fill="#121926" class="m" textLength="222.7" lengthAdjust="spacing">E-post: ida.testesen@example.com</text><text x="64" y="723.6" font-size="12" font-weight="700" fill="#121926" class="m" textLength="41.8" lengthAdjust="spacing">PROFIL</text><text x="64" y="742.6" font-size="12" fill="#121926" class="m" textLength="368.9" lengthAdjust="spacing">Sykepleierstudent på 2. år som trives med å jobbe med</text><text x="64" y="761.6" font-size="12" fill="#121926" class="m" textLength="410.6" lengthAdjust="spacing">mennesker. Pålitelig, blid og vant til å samarbeide i team.</text><text x="64" y="799.6" font-size="12" font-weight="700" fill="#121926" class="m" textLength="62.6" lengthAdjust="spacing">UTDANNING</text><text x="64" y="818.6" font-size="12" fill="#121926" class="m" textLength="48.7" lengthAdjust="spacing">2025–nå</text><text x="133.6" y="818.6" font-size="12" fill="#121926" class="m" textLength="341" lengthAdjust="spacing">Bachelor i sykepleie, Høgskolen i Testvik (2. år)</text><text x="64" y="837.6" font-size="12" fill="#121926" class="m" textLength="403.7" lengthAdjust="spacing">2022–2025 Studiespesialisering, Testvik videregående skole</text><text x="64" y="875.6" font-size="12" font-weight="700" fill="#121926" class="m" textLength="104.4" lengthAdjust="spacing">ARBEIDSERFARING</text><text x="64" y="894.6" font-size="12" fill="#121926" class="m" textLength="48.7" lengthAdjust="spacing">2023–nå</text><text x="133.6" y="894.6" font-size="12" fill="#121926" class="m" textLength="271.4" lengthAdjust="spacing">Butikkmedarbeider (deltid), Testvik Mat</text><text x="133.6" y="913.6" font-size="12" fill="#121926" class="m" textLength="355" lengthAdjust="spacing">Kundeservice, kassearbeid og varepåfylling. Hjelper</text><text x="133.6" y="932.6" font-size="12" fill="#121926" class="m" textLength="327.1" lengthAdjust="spacing">kunder med å finne varer og svarer på spørsmål.</text><text x="64" y="970.6" font-size="12" font-weight="700" fill="#121926" class="m" textLength="111.4" lengthAdjust="spacing">FRIVILLIG ARBEID</text><text x="64" y="989.6" font-size="12" fill="#121926" class="m" textLength="48.7" lengthAdjust="spacing">2024–nå</text><text x="133.6" y="989.6" font-size="12" fill="#121926" class="m" textLength="250.6" lengthAdjust="spacing">Besøksvenn, Røde Kors besøkstjeneste</text><text x="133.6" y="1008.6" font-size="12" fill="#121926" class="m" textLength="361.9" lengthAdjust="spacing">Besøker en eldre dame hver uke for samtale og turer.</text><text x="64" y="1046.6" font-size="12" font-weight="700" fill="#121926" class="m" textLength="111.4" lengthAdjust="spacing">STUDIEPROSJEKTER</text><text x="64" y="1065.6" font-size="12" fill="#121926" class="m" textLength="27.8" lengthAdjust="spacing">2025</text><text x="133.6" y="1065.6" font-size="12" fill="#121926" class="m" textLength="264.5" lengthAdjust="spacing">Gruppeprosjekt i helsefremmende arbeid</text><text x="133.6" y="1084.6" font-size="12" fill="#121926" class="m" textLength="361.9" lengthAdjust="spacing">Planla og holdt et kurs om fallforebygging for eldre</text><text x="133.6" y="1103.6" font-size="12" fill="#121926" class="m" textLength="313.2" lengthAdjust="spacing">sammen med fire medstudenter. Ansvarlig for å</text><text x="133.6" y="1122.6" font-size="12" fill="#121926" class="m" textLength="181" lengthAdjust="spacing">koordinere gruppens møter.</text><text x="64" y="1160.6" font-size="12" font-weight="700" fill="#121926" class="m" textLength="34.8" lengthAdjust="spacing">SPRÅK</text><text x="64" y="1179.6" font-size="12" fill="#121926" class="m" textLength="104.4" lengthAdjust="spacing">Norsk – morsmål</text><text x="64" y="1198.6" font-size="12" fill="#121926" class="m" textLength="250.6" lengthAdjust="spacing">Engelsk – godt, muntlig og skriftlig</text><text x="64" y="1236.6" font-size="12" font-weight="700" fill="#121926" class="m" textLength="34.8" lengthAdjust="spacing">ANNET</text><text x="64" y="1255.6" font-size="12" fill="#121926" class="m" textLength="236.6" lengthAdjust="spacing">Førstehjelpskurs, Røde Kors (2024)</text></g><rect x="522" y="628" width="6" height="292" rx="3" fill="#F7F8FA"/><rect x="522" y="628" width="6" height="135.4" rx="3" fill="#737D8C"/><text x="532" y="943" font-size="12.5" fill="#4B5565" text-anchor="end">933 / 10 000 tegn</text><rect x="568" y="214" width="320" height="494" rx="6" fill="#FFFFFF" stroke="#CDD3DC"/><text font-size="17" fill="#121926"><tspan font-weight="600" x="588" y="249.8">Krav fra annonsen</tspan></text><text font-size="14" fill="#4B5565"><tspan x="588" y="277.3">Når du trykker «Analyser kravene», vises</tspan><tspan x="588" y="298.3">kravene fra annonsen her. Et krav som står</tspan><tspan x="588" y="319.3">i CV-en, får et nummer og et ordrett sitat,</tspan><tspan x="588" y="340.3">og samme nummer markeres i CV-teksten.</tspan></text><rect x="588" y="360" width="280" height="114" rx="6" fill="#FCEAE8" stroke="#B0261C" stroke-width="1"/><g transform="translate(604 377) scale(1.125)" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 1.8L15.2 14.2H0.8Z" stroke="#B0261C"/><path d="M8 6.2v3.8" stroke="#B0261C" stroke-width="1.8"/><circle cx="8" cy="12" r="1" fill="#B0261C" stroke="none"/></g><text font-size="14" fill="#121926"><tspan font-weight="600" x="632" y="389.3">Analysen startet ikke</tspan></text><text font-size="14" fill="#121926"><tspan x="632" y="412.3">Stillingsannonsen er tom. Lim inn</tspan><tspan x="632" y="433.3">annonsen i feltet til høyre, og</tspan><tspan x="632" y="454.3">trykk «Analyser kravene» igjen.</tspan></text><rect x="588" y="490" width="280" height="44" rx="6" fill="#1C3D8F" stroke="#1C3D8F" stroke-width="1.5"/><g transform="translate(658.7 504) scale(1)" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8h9.8M9 4.2L12.8 8 9 11.8" stroke="#FFFFFF"/></g><text x="682.7" y="516.8" font-size="14" font-weight="600" fill="#FFFFFF">Analyser kravene</text><line x1="568" y1="552" x2="888" y2="552" stroke="#CDD3DC" stroke-width="1"/><text font-size="14" fill="#121926"><tspan font-weight="600" x="588" y="584.8">Vil du prøve med fiktive data?</tspan></text><text font-size="14" fill="#4B5565"><tspan x="588" y="609.3">Fyller inn CV-en til Ida Testesen og en</tspan><tspan x="588" y="630.3">annonse fra Testvik kommune.</tspan></text><rect x="588" y="648" width="280" height="40" rx="6" fill="#FFFFFF" stroke="#1C3D8F" stroke-width="1.5"/><text x="632.5" y="672.8" font-size="14" font-weight="600" fill="#1C3D8F">Last inn eksempel (testpar 1)</text><rect x="904" y="214" width="504" height="630" rx="6" fill="#FFFFFF" stroke="#CDD3DC"/><path d="M904.5 266V220a5.5 5.5 0 0 1 5.5-5.5H1402a5.5 5.5 0 0 1 5.5 5.5V266Z" fill="#FFFFFF"/><line x1="904" y1="266" x2="1408" y2="266" stroke="#CDD3DC" stroke-width="1"/><g transform="translate(920 224) scale(1)" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 1.5h5l3.5 3.5v9.5H4z" stroke="#4B5565"/><path d="M9 1.5V5h3.5" stroke="#4B5565"/></g><text x="944" y="236" font-size="15" font-weight="600" fill="#121926">Stillingsannonse</text><text x="944" y="255" font-size="12.5" fill="#4B5565">Lim inn teksten fra annonsen.</text><text font-size="14" fill="#121926"><tspan font-weight="600" x="924" y="302.8">Annonsetekst</tspan></text><text font-size="13" fill="#4B5565"><tspan x="924" y="323.9">Ta med stillingstittel og navn på arbeidsgiver, slik de står i annonsen. Høyst</tspan><tspan x="924" y="342.9">10 000 tegn.</tspan></text><rect x="924" y="356" width="464" height="420" rx="5" fill="#FFFFFF" stroke="#B0261C" stroke-width="2"/><text font-size="14" fill="#4B5565"><tspan x="936" y="381.3">Lim inn annonsen her.</tspan></text><rect x="921" y="353" width="470" height="426" rx="8" fill="none" stroke="#1C3D8F" stroke-width="2.5"/><line x1="937" y1="368" x2="937" y2="386" stroke="#121926" stroke-width="1.5"/><g transform="translate(924 788) scale(0.938)" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 1.8L15.2 14.2H0.8Z" stroke="#B0261C"/><path d="M8 6.2v3.8" stroke="#B0261C" stroke-width="1.8"/><circle cx="8" cy="12" r="1" fill="#B0261C" stroke="none"/></g><text font-size="13" fill="#B0261C"><tspan font-weight="600" x="946" y="799.9">Lim inn stillingsannonsen. Feltet kan ikke være</tspan><tspan font-weight="600" x="946" y="818.9">tomt.</tspan></text><text x="1388" y="795" font-size="12.5" fill="#4B5565" text-anchor="end">0 / 10 000 tegn</text><line x1="0" y1="1002.5" x2="1440" y2="1002.5" stroke="#CDD3DC" stroke-width="1"/><g transform="translate(32 1016) scale(0.938)" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="8" r="6.8" stroke="#4B5565"/><path d="M8 4.3V8l2.6 1.6" stroke="#4B5565"/></g><text font-size="13" fill="#4B5565"><tspan x="56" y="1028.9">Økten avsluttes etter 30 minutter uten aktivitet. CV-tekst, annonse, svar og tekst slettes når du logger ut.</tspan></text>
</svg>
