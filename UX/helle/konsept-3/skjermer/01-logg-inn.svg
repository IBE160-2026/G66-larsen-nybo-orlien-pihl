<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1045" viewBox="0 0 1440 1045" role="img" aria-labelledby="tittel beskrivelse" xml:lang="nb">
<title id="tittel">Supersøker – Logg inn (med feilmelding)</title>
<desc id="beskrivelse">Innloggingsside i konseptet Kort og mot. Feilmelding for feil e-post eller passord, e-postfeltet er utfylt, passordfeltet har fokus. Lenke til Opprett konto og hint om testbrukeren i README.</desc>
<style>.t{font-family:'Segoe UI Variable Text','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Roboto,Arial,sans-serif}.d{font-family:'Segoe UI Variable Display','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Roboto,Arial,sans-serif}</style>
<defs><filter id="lift" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#24102F" flood-opacity="0.13"/></filter><filter id="sticker" x="-10%" y="-20%" width="120%" height="150%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#24102F" flood-opacity="0.22"/></filter><filter id="barShadow" x="-5%" y="-60%" width="110%" height="200%"><feDropShadow dx="0" dy="-4" stdDeviation="8" flood-color="#24102F" flood-opacity="0.14"/></filter></defs>
<rect width="1440" height="1045" fill="#FFF3E2"/>
<rect x="0" y="0" width="1440" height="76" rx="0" fill="#4B1D63"/><g transform="translate(40 19) scale(1)"><rect x="0" y="2" width="34" height="34" rx="10" fill="#C9F46A" transform="rotate(-8 17 19)"/><g transform="translate(5 7) scale(1.0000)" fill="none" stroke="#24102F" color="#24102F" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></g><text class="d" x="46" y="29" font-size="26" font-weight="900" fill="#FFF3E2">Supersøker</text></g><rect x="0" y="76" width="1440" height="44" rx="0" fill="#C9F46A"/><g transform="translate(48 87) scale(0.9167)" fill="none" stroke="#24102F" color="#24102F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v5.8c0 4.6-3.4 8.2-8 9.2-4.6-1-8-4.6-8-9.2V6z"/><path d="M8.3 12.2l2.6 2.6 4.8-5"/></g><text class="t" font-size="16" font-weight="600" fill="#24102F"><tspan x="84" y="102.8">Mock-modus er på – ingen tekst sendes til en språkmodell. Svarene er ferdiglagde eksempler.</tspan></text><text class="d" font-size="60" font-weight="900" fill="#24102F"><tspan x="120" y="262.0">Søk med mot – og</tspan><tspan x="120" y="326.0">med det CV-en</tspan><tspan x="120" y="390.0">faktisk viser.</tspan></text><text class="t" font-size="20" font-weight="400" fill="#24102F"><tspan x="120" y="445.0">Supersøker sammenligner CV-en din med annonsen,</tspan><tspan x="120" y="475.0">spør om det som mangler, og hjelper deg å skrive en</tspan><tspan x="120" y="505.0">søknad som stemmer.</tspan></text><g transform="rotate(-2 330 598)"><rect x="120" y="554" width="420" height="88" rx="24" fill="#FFFDF9" filter="url(#lift)"/><rect x="120" y="554" width="420" height="88" rx="24" fill="#FFFDF9" stroke="#E8D8C4" stroke-width="1.5"/><circle cx="164" cy="598" r="22" fill="#C9F46A"/><text class="d" x="164" y="606" font-size="22" font-weight="900" fill="#24102F" text-anchor="middle">1</text><text class="d" x="202" y="594" font-size="22" font-weight="900" fill="#24102F">CV og annonse</text><text class="t" x="202" y="620" font-size="16" fill="#5C4868">Lim inn eller last opp.</text></g><g transform="rotate(1.5 366 700)"><rect x="156" y="656" width="420" height="88" rx="24" fill="#FFFDF9" filter="url(#lift)"/><rect x="156" y="656" width="420" height="88" rx="24" fill="#FFFDF9" stroke="#E8D8C4" stroke-width="1.5"/><circle cx="200" cy="700" r="22" fill="#FFC247"/><text class="d" x="200" y="708" font-size="22" font-weight="900" fill="#24102F" text-anchor="middle">2</text><text class="d" x="238" y="696" font-size="22" font-weight="900" fill="#24102F">Gap-analyse</text><text class="t" x="238" y="722" font-size="16" fill="#5C4868">Se hva CV-en dokumenterer.</text></g><g transform="rotate(-1 402 802)"><rect x="192" y="758" width="420" height="88" rx="24" fill="#FFFDF9" filter="url(#lift)"/><rect x="192" y="758" width="420" height="88" rx="24" fill="#FFFDF9" stroke="#E8D8C4" stroke-width="1.5"/><circle cx="236" cy="802" r="22" fill="#E3F8C4"/><text class="d" x="236" y="810" font-size="22" font-weight="900" fill="#24102F" text-anchor="middle">3</text><text class="d" x="274" y="798" font-size="22" font-weight="900" fill="#24102F">Teksten</text><text class="t" x="274" y="824" font-size="16" fill="#5C4868">Få et utkast du redigerer selv.</text></g><rect x="780" y="192" width="540" height="773" rx="36" fill="#FFFDF9" filter="url(#lift)"/><rect x="780" y="192" width="540" height="773" rx="36" fill="#FFFDF9" stroke="#E8D8C4" stroke-width="1.5"/><text class="d" font-size="44" font-weight="900" fill="#24102F"><tspan x="824" y="281.2">Logg inn</tspan></text><rect x="824" y="320" width="452" height="87" rx="22" fill="#FDE7E4" stroke="#B3261E" stroke-width="2"/><g transform="translate(842 338) scale(1.0000)" fill="none" stroke="#B3261E" color="#B3261E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.6L21.6 20H2.4z"/><path d="M12 9.8v4.6"/><circle cx="12" cy="17.1" r="1.1" fill="currentColor" stroke="none"/></g><text class="t" font-size="18" font-weight="700" fill="#24102F"><tspan x="882" y="355.4">Feil e-post eller passord</tspan></text><text class="t" font-size="16" font-weight="400" fill="#24102F"><tspan x="882" y="382.3">Sjekk at du har skrevet riktig, og prøv igjen.</tspan></text><text class="t" font-size="17" font-weight="700" fill="#24102F"><tspan x="824" y="448.6">E-post</tspan></text><rect x="824" y="464" width="452" height="56" rx="16" fill="#FFFDF9" stroke="#8A7894" stroke-width="2"/><text class="t" font-size="17" font-weight="400" fill="#24102F"><tspan x="842" y="496.1">ida.testesen@example.com</tspan></text><text class="t" font-size="17" font-weight="700" fill="#24102F"><tspan x="824" y="557.6">Passord</tspan></text><rect x="824" y="573" width="452" height="56" rx="16" fill="#FFFDF9" stroke="#24102F" stroke-width="2"/><rect x="819" y="568" width="462" height="66" rx="21" fill="none" stroke="#24102F" stroke-width="3"/><rect x="842" y="589" width="2" height="20" fill="#24102F"/><g><rect x="824" y="657" width="452" height="60" rx="30" fill="#4B1D63" filter="url(#lift)"/><rect x="824" y="657" width="452" height="60" rx="30" fill="#4B1D63"/><text class="t" x="998.0" y="693.1" font-size="18" font-weight="700" fill="#FFFDF9">Logg inn</text><g transform="translate(1083.998 677) scale(0.8333)" fill="none" stroke="#FFFDF9" color="#FFFDF9" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12h14.5"/><path d="M13 6l6 6-6 6"/></g></g><text class="t" font-size="17" font-weight="400" fill="#24102F"><tspan x="824" y="758.6">Ny her?</tspan></text><text class="t" x="890.2429999999999" y="759" font-size="17" font-weight="700" fill="#4B1D63">Opprett konto</text><rect x="890.2429999999999" y="763" width="112.387" height="2" fill="#4B1D63"/><rect x="824" y="790" width="452" height="131" rx="22" fill="#E9E1F2"/><g transform="translate(842 808) scale(1.0000)" fill="none" stroke="#4B1D63" color="#4B1D63" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="15" r="4.2"/><path d="M11 12l8.5-8.5M16.5 6.5l2.5 2.5M14.2 8.8l2 2"/></g><text class="t" font-size="17" font-weight="700" fill="#24102F"><tspan x="882" y="824.1">Testbruker</tspan></text><text class="t" font-size="16" font-weight="400" fill="#24102F"><tspan x="882" y="850.3">Sensor og gruppa kan logge inn med testbrukeren.</tspan><tspan x="882" y="873.3">E-post og passord står i README, under</tspan><tspan x="882" y="896.3">«Testbruker».</tspan></text>
</svg>
