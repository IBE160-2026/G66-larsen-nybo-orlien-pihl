<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="390" height="2415" viewBox="0 0 390 2415" role="img" aria-labelledby="t d" font-family="Seravek, 'Gill Sans Nova', Ubuntu, 'Segoe UI', Calibri, 'DejaVu Sans', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Mobil, 390 px – gap-analyse</title>
<desc id="d">Gap-analysen på smal skjerm. Steglisten viser bare aktivt steg (Steg 2 av 3, Gap-analyse) med en liten fremdriftslinje. Alt er stablet i én kolonne; manglende krav med svarfelt kommer først, og Lag tekst er en full bredde-knapp nederst.</desc>
<rect width="390" height="2415" fill="#F4EFE6"/>
<rect x="0" y="0" width="390" height="64" fill="#F4EFE6"/><rect x="0" y="63" width="390" height="1" fill="#D9CFBE"/><g aria-hidden="true"><rect x="20" y="17" width="30" height="30" rx="9" fill="#34557A"/><path d="M28 33l4.5 4.5 9.5-10" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></g><text x="62" y="40" font-size="20" font-weight="600" fill="#2A2520">Supersøker</text><rect x="247" y="12" width="123" height="40" rx="10" fill="#FFFDF9" stroke="#857A69" stroke-width="1.5"/><g transform="translate(265.4140625 22) scale(0.8333)" fill="none" stroke="#2A2520" color="#2A2520" stroke-width="2.16" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h4"/><path d="M15 8l4 4-4 4M19 12H9.5"/></g><text x="295.4" y="37.6" font-size="16" font-weight="600" fill="#2A2520">Logg ut</text>
<rect x="0" y="64" width="390" height="93" fill="#EAE2D3"/><rect x="0" y="156" width="390" height="1" fill="#D9CFBE"/><g transform="translate(20 76.5) scale(0.9167)" fill="none" stroke="#2A2520" color="#2A2520" stroke-width="1.96" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.2l7.3 2.8v5.5c0 4.5-3 8-7.3 9.3-4.3-1.3-7.3-4.8-7.3-9.3V6z"/><path d="M8.6 12l2.4 2.4 4.4-4.5"/></g><text x="52" y="92.0" font-size="15" font-weight="400" fill="#2A2520"><tspan x="52"><tspan font-weight="600">Mock-modus er på.</tspan> Svarene er ferdiglagde</tspan><tspan x="52" dy="23">eksempler, og ingen tekst sendes til en</tspan><tspan x="52" dy="23">språkmodell.</tspan></text>
<text x="20" y="194" font-size="14" fill="#5B5247">Steg 2 av 3</text><text x="20" y="223" font-size="21" font-weight="700" fill="#2A2520">Gap-analyse</text><rect x="280" y="211" width="26" height="6" rx="3" fill="#34557A"/><rect x="312" y="211" width="26" height="6" rx="3" fill="#34557A"/><rect x="344" y="211" width="26" height="6" rx="3" fill="#D9CFBE"/><text x="370" y="194" font-size="14" fill="#5B5247" text-anchor="end">Neste: Teksten</text>
<rect x="20" y="245" width="350" height="1" fill="#D9CFBE"/>
<text x="20" y="295.3" font-size="26" font-weight="400" fill="#2A2520"><tspan x="20"><tspan font-weight="600">Gap-analyse: Sommervikar</tspan></tspan><tspan x="20" dy="33"><tspan font-weight="600">i hjemmetjenesten, Testvik</tspan></tspan><tspan x="20" dy="33"><tspan font-weight="600">kommune</tspan></tspan></text>
<text x="20" y="398.1" font-size="17" font-weight="400" fill="#2A2520"><tspan x="20"><tspan font-weight="700">3 av 4 kompetansekrav</tspan> er dokumentert i</tspan><tspan x="20" dy="26">CV-en.</tspan></text>
<text x="20" y="455.3" font-size="16" font-weight="400" fill="#5B5247"><tspan x="20">Ett krav mangler dokumentasjon. Svar gjerne</tspan><tspan x="20" dy="25">på det før vi lager teksten – det er valgfritt.</tspan></text>
<text x="20" y="532.0" font-size="20" font-weight="400" fill="#2A2520"><tspan x="20"><tspan font-weight="600">Mangler dokumentasjon (1)</tspan></tspan></text>
<rect x="8" y="554" width="374" height="455" rx="14" fill="#F6E9CF" stroke="#D6B475"/><rect x="20" y="574" width="218" height="30" rx="15" fill="#FFFDF9" stroke="#D6B475"/><g transform="translate(29 579) scale(0.8333)" fill="none" stroke="#855000" color="#855000" stroke-width="2.40" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9.2" stroke-dasharray="3.2 2.6"/><path d="M12 8v8M8 12h8"/></g><text x="55" y="594" font-size="14" font-weight="600" fill="#855000">Mangler dokumentasjon</text><text x="20" y="638.0" font-size="20" font-weight="400" fill="#2A2520"><tspan x="20"><tspan font-weight="600">Førerkort klasse B</tspan></tspan></text><text x="20" y="668.5" font-size="15" font-weight="400" fill="#2A2520"><tspan x="20">Annonsen krever dette, men det står ikke i</tspan><tspan x="20" dy="24">CV-en. Det betyr ikke at du mangler det.</tspan></text><g transform="translate(20 720) scale(0.8333)" fill="none" stroke="#855000" color="#855000" stroke-width="2.16" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 19.5l1-4.2L15.8 5a1.9 1.9 0 0 1 2.7 0l.5.5a1.9 1.9 0 0 1 0 2.7L8.7 18.5z"/><path d="M14 6.8l3.2 3.2"/></g><text x="48" y="735.8" font-size="16" font-weight="400" fill="#2A2520"><tspan x="48"><tspan font-weight="700" fill="#855000">Gjør dette nå: </tspan><tspan font-weight="600">fortell kort hva du har</tspan></tspan></text><text x="20" y="773.8" font-size="16" font-weight="400" fill="#2A2520"><tspan x="20"><tspan font-weight="600">Ditt svar om førerkort</tspan><tspan fill="#5B5247"> (valgfritt)</tspan></tspan></text><text x="20" y="798.7" font-size="14" font-weight="400" fill="#5B5247"><tspan x="20">Svaret brukes bare i denne søknaden. Skriv det slik</tspan><tspan x="20" dy="21">det er – også hvis du ikke har det ennå. Teksten</tspan><tspan x="20" dy="21">påstår aldri mer enn du skriver.</tspan></text><rect x="20" y="857" width="350" height="108" rx="8" fill="#FFFDF9" stroke="#34557A" stroke-width="2"/><rect x="15.5" y="852.5" width="359" height="117" rx="12.5" fill="none" stroke="#34557A" stroke-width="3"/><text x="36" y="888.5" font-size="15" font-weight="400" fill="#2A2520"><tspan x="36">Jeg har ikke førerkort ennå. Jeg har</tspan><tspan x="36" dy="26">oppkjøring i april.</tspan></text><rect x="154.50634765625" y="901" width="1.6" height="18" fill="#2A2520"/><text x="370" y="986" font-size="14" fill="#5B5247" text-anchor="end" style="font-variant-numeric: tabular-nums">56 / 1 000 tegn</text>
<text x="20" y="1061.0" font-size="20" font-weight="400" fill="#2A2520"><tspan x="20"><tspan font-weight="600">Dokumentert i CV-en (3)</tspan></tspan></text>
<rect x="20" y="1087" width="141" height="30" rx="15" fill="#E3EDE2" stroke="#A8C4AE"/><g transform="translate(29 1092) scale(0.8333)" fill="none" stroke="#2D6644" color="#2D6644" stroke-width="2.40" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9.2"/><path d="M7.8 12.3l2.9 2.9 5.5-5.6"/></g><text x="55" y="1107" font-size="14" font-weight="600" fill="#2D6644">Dokumentert</text><text x="20" y="1144.6" font-size="17" font-weight="400" fill="#2A2520"><tspan x="20"><tspan font-weight="600">Gode norskkunnskaper, muntlig og</tspan></tspan><tspan x="20" dy="25"><tspan font-weight="600">skriftlig</tspan></tspan></text><text x="20" y="1199.0" font-size="15" font-weight="400" fill="#5B5247"><tspan x="20">Fra CV-en:</tspan></text><rect x="20" y="1210" width="135.4" height="25" rx="4" fill="#F1DC9C"/><text x="24" y="1227.3" font-size="15" fill="#2A2520">«Norsk – morsmål»</text>
<rect x="20" y="1257" width="350" height="1" fill="#D9CFBE"/>
<rect x="20" y="1279" width="141" height="30" rx="15" fill="#E3EDE2" stroke="#A8C4AE"/><g transform="translate(29 1284) scale(0.8333)" fill="none" stroke="#2D6644" color="#2D6644" stroke-width="2.40" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9.2"/><path d="M7.8 12.3l2.9 2.9 5.5-5.6"/></g><text x="55" y="1299" font-size="14" font-weight="600" fill="#2D6644">Dokumentert</text><text x="20" y="1336.6" font-size="17" font-weight="400" fill="#2A2520"><tspan x="20"><tspan font-weight="600">Erfaring med eller interesse for å jobbe</tspan></tspan><tspan x="20" dy="25"><tspan font-weight="600">med mennesker</tspan></tspan></text><text x="20" y="1391.0" font-size="15" font-weight="400" fill="#5B5247"><tspan x="20">Fra CV-en:</tspan></text><rect x="20" y="1402" width="277.5" height="25" rx="4" fill="#F1DC9C"/><text x="24" y="1419.3" font-size="15" fill="#2A2520">«Besøksvenn, Røde Kors besøkstjeneste»</text>
<rect x="20" y="1449" width="350" height="1" fill="#D9CFBE"/>
<rect x="20" y="1471" width="141" height="30" rx="15" fill="#E3EDE2" stroke="#A8C4AE"/><g transform="translate(29 1476) scale(0.8333)" fill="none" stroke="#2D6644" color="#2D6644" stroke-width="2.40" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9.2"/><path d="M7.8 12.3l2.9 2.9 5.5-5.6"/></g><text x="55" y="1491" font-size="14" font-weight="600" fill="#2D6644">Dokumentert</text><text x="20" y="1528.6" font-size="17" font-weight="400" fill="#2A2520"><tspan x="20"><tspan font-weight="600">Gode samarbeidsevner</tspan></tspan></text><text x="20" y="1558.0" font-size="15" font-weight="400" fill="#5B5247"><tspan x="20">Fra CV-en:</tspan></text><rect x="20" y="1569" width="294.6" height="25" rx="4" fill="#F1DC9C"/><text x="24" y="1586.3" font-size="15" fill="#2A2520">«Gruppeprosjekt i helsefremmende arbeid»</text>
<text x="20" y="1654.0" font-size="20" font-weight="400" fill="#2A2520"><tspan x="20"><tspan font-weight="600">Ansettelsesvilkår</tspan></tspan></text>
<rect x="20" y="1672" width="350" height="133" rx="10" fill="none" stroke="#D9CFBE" stroke-width="1.5"/><g transform="translate(34 1691) scale(0.9167)" fill="none" stroke="#5B5247" color="#5B5247" stroke-width="1.96" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3.5h10A1.5 1.5 0 0 1 18.5 5v14a1.5 1.5 0 0 1-1.5 1.5H7A1.5 1.5 0 0 1 5.5 19V5A1.5 1.5 0 0 1 7 3.5z"/><path d="M9 8h6M9 11.5h6M9 15h3.5"/></g><text x="64" y="1707.8" font-size="16" font-weight="400" fill="#2A2520"><tspan x="64"><tspan font-weight="600">Politiattest</tspan></tspan></text><text x="64" y="1734.0" font-size="15" font-weight="400" fill="#5B5247"><tspan x="64">Kan ikke dokumenteres i en CV. Telles</tspan><tspan x="64" dy="23">ikke med over, og teksten påstår ikke at</tspan><tspan x="64" dy="23">du har den.</tspan></text>
<text x="20" y="1869.0" font-size="20" font-weight="400" fill="#2A2520"><tspan x="20"><tspan font-weight="600">Hvor mye skal Supersøker skrive?</tspan></tspan></text>
<rect x="20" y="1891" width="350" height="110" rx="10" fill="#F3F6F9" stroke="#34557A" stroke-width="2"/><circle cx="50" cy="1922" r="10" fill="#FFFDF9" stroke="#34557A" stroke-width="2"/><circle cx="50" cy="1922" r="5.5" fill="#34557A"/><text x="76" y="1927.1" font-size="17" font-weight="400" fill="#2A2520"><tspan x="76"><tspan font-weight="600">Helt søknadsutkast</tspan></tspan></text><text x="76" y="1953.0" font-size="15" font-weight="400" fill="#5B5247"><tspan x="76">Et sammenhengende brev du</tspan><tspan x="76" dy="23">redigerer selv.</tspan></text>
<rect x="20" y="2013" width="350" height="110" rx="10" fill="#FFFDF9" stroke="#857A69" stroke-width="1.5"/><circle cx="50" cy="2044" r="10" fill="#FFFDF9" stroke="#857A69" stroke-width="2"/><text x="76" y="2049.1" font-size="17" font-weight="400" fill="#2A2520"><tspan x="76"><tspan font-weight="600">Forslag til formuleringer</tspan></tspan></text><text x="76" y="2075.0" font-size="15" font-weight="400" fill="#5B5247"><tspan x="76">Setninger du kan bruke i ditt eget</tspan><tspan x="76" dy="23">brev.</tspan></text>
<rect x="20" y="2167" width="350" height="1" fill="#D9CFBE"/><g transform="translate(20 2192) scale(0.8333)" fill="none" stroke="#34557A" color="#34557A" stroke-width="2.16" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h13M13 6.5l5.5 5.5-5.5 5.5"/></g><text x="50" y="2207.5" font-size="15" font-weight="400" fill="#2A2520"><tspan x="50"><tspan font-weight="600">Neste: </tspan>Vi skriver teksten ut fra CV-en,</tspan><tspan x="50" dy="24">annonsen og svaret ditt.</tspan></text><rect x="20" y="2257" width="350" height="50" rx="10" fill="#FFFDF9" stroke="#857A69" stroke-width="1.5"/><g transform="translate(90.92431640625 2272) scale(0.8333)" fill="none" stroke="#2A2520" color="#2A2520" stroke-width="2.16" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H6M11 6.5L5.5 12l5.5 5.5"/></g><text x="120.9" y="2287.9" font-size="17" font-weight="600" fill="#2A2520">Endre CV eller annonse</text><rect x="20" y="2319" width="350" height="56" rx="10" fill="#34557A"/><text x="160.2" y="2352.9" font-size="17" font-weight="600" fill="#FFFFFF">Lag tekst</text>
</svg>
