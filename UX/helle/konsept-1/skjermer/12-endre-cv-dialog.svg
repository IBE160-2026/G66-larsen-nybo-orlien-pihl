<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1516" viewBox="0 0 1440 1516" role="img" aria-labelledby="t d" font-family="Seravek, 'Gill Sans Nova', Ubuntu, 'Segoe UI', Calibri, 'DejaVu Sans', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Bekreftelsesdialog – Endre CV eller annonse</title>
<desc id="d">Dialog over steg 3. Den lister hva som forkastes: svaret, gap-analysen og teksten, også egenredigert tekst. CV og annonse beholdes. Avbryt har fokus; Forkast og endre er markert som destruktiv.</desc>
<rect width="1440" height="1516" fill="#F4EFE6"/>
<rect x="0" y="0" width="1440" height="72" fill="#F4EFE6"/><rect x="0" y="71" width="1440" height="1" fill="#D9CFBE"/><g aria-hidden="true"><rect x="48" y="21" width="30" height="30" rx="9" fill="#34557A"/><path d="M56 37l4.5 4.5 9.5-10" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></g><text x="90" y="44" font-size="22" font-weight="600" fill="#2A2520">Supersøker</text><rect x="1269" y="16" width="123" height="40" rx="10" fill="#FFFDF9" stroke="#857A69" stroke-width="1.5"/><g transform="translate(1287.4140625 26) scale(0.8333)" fill="none" stroke="#2A2520" color="#2A2520" stroke-width="2.16" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h4"/><path d="M15 8l4 4-4 4M19 12H9.5"/></g><text x="1317.4" y="41.6" font-size="16" font-weight="600" fill="#2A2520">Logg ut</text><text x="1249" y="41" font-size="15" fill="#5B5247" text-anchor="end">Innlogget som ida.testesen@example.com</text>
<rect x="0" y="72" width="1440" height="48" fill="#EAE2D3"/><rect x="0" y="119" width="1440" height="1" fill="#D9CFBE"/><g transform="translate(202 85) scale(0.9167)" fill="none" stroke="#2A2520" color="#2A2520" stroke-width="1.96" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.2l7.3 2.8v5.5c0 4.5-3 8-7.3 9.3-4.3-1.3-7.3-4.8-7.3-9.3V6z"/><path d="M8.6 12l2.4 2.4 4.4-4.5"/></g><text x="234" y="100.8" font-size="16" font-weight="400" fill="#2A2520"><tspan x="234"><tspan font-weight="600">Mock-modus er på.</tspan> Svarene er ferdiglagde eksempler, og ingen tekst sendes til en språkmodell.</tspan></text>
<rect x="256" y="190.5" width="436" height="3" rx="1.5" fill="#34557A"/><rect x="748" y="190.5" width="436" height="3" rx="1.5" fill="#34557A"/><circle cx="228" cy="192" r="20" fill="#34557A"/><path d="M220 192l5.5 5.5 10.5-11" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="202" y="246" font-size="18" font-weight="400" fill="#2A2520" text-anchor="start">CV og annonse</text><text x="202" y="268" font-size="14" font-weight="400" fill="#5B5247" text-anchor="start">Ferdig</text><circle cx="720" cy="192" r="20" fill="#34557A"/><path d="M712 192l5.5 5.5 10.5-11" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="720" y="246" font-size="18" font-weight="400" fill="#2A2520" text-anchor="middle">Gap-analyse</text><text x="720" y="268" font-size="14" font-weight="400" fill="#5B5247" text-anchor="middle">Ferdig</text><circle cx="1212" cy="192" r="27" fill="#E2E8EF"/><circle cx="1212" cy="192" r="20" fill="#34557A"/><text x="1212" y="198.5" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="1238" y="246" font-size="18" font-weight="700" fill="#2A2520" text-anchor="end">Teksten</text><text x="1238" y="268" font-size="14" font-weight="600" fill="#34557A" text-anchor="end">Du er her</text>
<text x="202" y="347.2" font-size="34" font-weight="400" fill="#2A2520"><tspan x="202"><tspan font-weight="600">Søknadsutkastet ditt</tspan></tspan></text>
<text x="202" y="391.2" font-size="19" font-weight="400" fill="#2A2520"><tspan x="202">Les gjennom og rett det du vil. Det er ditt brev – Supersøker har bare</tspan><tspan x="202" dy="31">skrevet et utkast.</tspan></text>
<rect x="202" y="454" width="680" height="86" rx="10" fill="#EAE2D3" stroke="#D9CFBE" stroke-width="1"/><g transform="translate(220 474) scale(0.9167)" fill="none" stroke="#2A2520" color="#2A2520" stroke-width="1.96" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9.2"/><path d="M12 7v5.2l3.4 2"/></g><text x="254" y="489.3" font-size="16" font-weight="400" fill="#2A2520"><tspan x="254"><tspan font-weight="600">Teksten tas vare på mens du er innlogget,</tspan> og slettes når du logger ut. Kopier</tspan><tspan x="254" dy="25">den før det.</tspan></text>
<text x="202" y="584.1" font-size="17" font-weight="400" fill="#2A2520"><tspan x="202"><tspan font-weight="600">Søknadsutkast (kan redigeres)</tspan></tspan></text>
<rect x="202" y="602" width="680" height="656" rx="8" fill="#FFFDF9" stroke="#857A69" stroke-width="1.5"/><text x="224" y="641.1" font-size="17" font-weight="400" fill="#2A2520"><tspan x="224">Søknad på stillingen som sommervikar i hjemmetjenesten</tspan><tspan x="224" dy="28"> </tspan><tspan x="224" dy="28">Hei,</tspan><tspan x="224" dy="28"> </tspan><tspan x="224" dy="28">Jeg søker på stillingen som sommervikar i hjemmetjenesten i Testvik</tspan><tspan x="224" dy="28">kommune for perioden juni–august. Jeg er sykepleierstudent på 2. år ved</tspan><tspan x="224" dy="28">Høgskolen i Testvik og trives med å jobbe med mennesker.</tspan><tspan x="224" dy="28"> </tspan><tspan x="224" dy="28">Som besøksvenn i Røde Kors besøkstjeneste besøker jeg en eldre dame hver</tspan><tspan x="224" dy="28">uke for samtale og turer. I et gruppeprosjekt i helsefremmende arbeid planla</tspan><tspan x="224" dy="28">og holdt jeg et kurs om fallforebygging for eldre sammen med fire</tspan><tspan x="224" dy="28">medstudenter, og jeg var ansvarlig for å koordinere gruppens møter.</tspan><tspan x="224" dy="28"> </tspan><tspan x="224" dy="28">Ved siden av studiene jobber jeg deltid som butikkmedarbeider hos Testvik</tspan><tspan x="224" dy="28">Mat, der jeg hjelper kunder og svarer på spørsmål. Norsk er morsmålet mitt.</tspan><tspan x="224" dy="28"> </tspan><tspan x="224" dy="28">Jeg har ikke førerkort ennå, men jeg har oppkjøring i april.</tspan><tspan x="224" dy="28"> </tspan><tspan x="224" dy="28">Jeg ser fram til å høre fra dere.</tspan><tspan x="224" dy="28"> </tspan><tspan x="224" dy="28">Vennlig hilsen</tspan><tspan x="224" dy="28">Ida Testesen</tspan></text>
<rect x="938" y="454" width="300" height="651" rx="14" fill="#EAE2D3"/><text x="962" y="498.0" font-size="20" font-weight="400" fill="#2A2520"><tspan x="962"><tspan font-weight="600">Teksten bygger på</tspan></tspan></text><text x="962" y="524.7" font-size="14" font-weight="400" fill="#5B5247"><tspan x="962">Grunnlag for den genererte teksten.</tspan><tspan x="962" dy="21">Egne redigeringer kontrolleres ikke</tspan><tspan x="962" dy="21">automatisk.</tspan></text><text x="962" y="606.5" font-size="15" font-weight="400" fill="#2A2520"><tspan x="962"><tspan font-weight="600" fill="#5B5247">Stillingen</tspan></tspan></text><g transform="translate(962 621) scale(0.7500)" fill="none" stroke="#5B5247" color="#5B5247" stroke-width="2.67" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3.5h10A1.5 1.5 0 0 1 18.5 5v14a1.5 1.5 0 0 1-1.5 1.5H7A1.5 1.5 0 0 1 5.5 19V5A1.5 1.5 0 0 1 7 3.5z"/><path d="M9 8h6M9 11.5h6M9 15h3.5"/></g><text x="988" y="635.0" font-size="15" font-weight="400" fill="#2A2520"><tspan x="988">Sommervikar i</tspan><tspan x="988" dy="23">hjemmetjenesten</tspan></text><g transform="translate(962 675) scale(0.7500)" fill="none" stroke="#5B5247" color="#5B5247" stroke-width="2.67" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3.5h10A1.5 1.5 0 0 1 18.5 5v14a1.5 1.5 0 0 1-1.5 1.5H7A1.5 1.5 0 0 1 5.5 19V5A1.5 1.5 0 0 1 7 3.5z"/><path d="M9 8h6M9 11.5h6M9 15h3.5"/></g><text x="988" y="689.0" font-size="15" font-weight="400" fill="#2A2520"><tspan x="988">Testvik kommune</tspan></text><text x="962" y="727.5" font-size="15" font-weight="400" fill="#2A2520"><tspan x="962"><tspan font-weight="600" fill="#5B5247">Sitater fra CV-en</tspan></tspan></text><g transform="translate(962 742) scale(0.7500)" fill="none" stroke="#2D6644" color="#2D6644" stroke-width="2.67" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.2 4.2L19 7"/></g><text x="988" y="756.0" font-size="15" font-weight="400" fill="#2A2520"><tspan x="988">«Norsk – morsmål»</tspan></text><g transform="translate(962 773) scale(0.7500)" fill="none" stroke="#2D6644" color="#2D6644" stroke-width="2.67" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.2 4.2L19 7"/></g><text x="988" y="787.0" font-size="15" font-weight="400" fill="#2A2520"><tspan x="988">«Besøksvenn, Røde Kors</tspan><tspan x="988" dy="23">besøkstjeneste»</tspan></text><g transform="translate(962 827) scale(0.7500)" fill="none" stroke="#2D6644" color="#2D6644" stroke-width="2.67" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.2 4.2L19 7"/></g><text x="988" y="841.0" font-size="15" font-weight="400" fill="#2A2520"><tspan x="988">«Gruppeprosjekt i</tspan><tspan x="988" dy="23">helsefremmende arbeid»</tspan></text><text x="962" y="902.5" font-size="15" font-weight="400" fill="#2A2520"><tspan x="962"><tspan font-weight="600" fill="#5B5247">Ditt svar – oppgitt av deg, ikke</tspan></tspan><tspan x="962" dy="22"><tspan font-weight="600" fill="#5B5247">kontrollert</tspan></tspan></text><g transform="translate(962 939) scale(0.7500)" fill="none" stroke="#855000" color="#855000" stroke-width="2.67" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 19.5l1-4.2L15.8 5a1.9 1.9 0 0 1 2.7 0l.5.5a1.9 1.9 0 0 1 0 2.7L8.7 18.5z"/><path d="M14 6.8l3.2 3.2"/></g><text x="988" y="953.0" font-size="15" font-weight="400" fill="#2A2520"><tspan x="988"><tspan font-weight="600">Førerkort klasse B: </tspan>«Jeg har</tspan><tspan x="988" dy="23">ikke førerkort ennå. Jeg har</tspan><tspan x="988" dy="23">oppkjøring i april.»</tspan></text><text x="962" y="1037.5" font-size="15" font-weight="400" fill="#2A2520"><tspan x="962"><tspan font-weight="600" fill="#5B5247">Ikke brukt som oppfylt</tspan></tspan></text><g transform="translate(962 1052) scale(0.7500)" fill="none" stroke="#5B5247" color="#5B5247" stroke-width="2.67" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9.2"/><path d="M12 11v5.5"/><circle cx="12" cy="7.8" r=".6" fill="currentColor"/></g><text x="988" y="1066.0" font-size="15" font-weight="400" fill="#2A2520"><tspan x="988">Politiattest (ansettelsesvilkår)</tspan></text>
<rect x="202" y="1282" width="680" height="1" fill="#D9CFBE"/><g transform="translate(202 1307) scale(0.8333)" fill="none" stroke="#34557A" color="#34557A" stroke-width="2.16" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h13M13 6.5l5.5 5.5-5.5 5.5"/></g><text x="232" y="1322.8" font-size="16" font-weight="400" fill="#2A2520"><tspan x="232"><tspan font-weight="600">Neste: </tspan>Kopier teksten og lim den inn der du skriver søknaden.</tspan></text><rect x="642" y="1348" width="240" height="56" rx="10" fill="#34557A"/><g transform="translate(700.60693359375 1366) scale(0.8333)" fill="none" stroke="#FFFFFF" color="#FFFFFF" stroke-width="2.16" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8.5" y="8.5" width="11.5" height="11.5" rx="1.8"/><path d="M15.5 8.5V5.8A1.8 1.8 0 0 0 13.7 4H5.8A1.8 1.8 0 0 0 4 5.8v7.9a1.8 1.8 0 0 0 1.8 1.8h2.7"/></g><text x="730.6" y="1382.0" font-size="17" font-weight="600" fill="#FFFFFF">Kopier tekst</text><rect x="202" y="1350" width="245" height="52" rx="10" fill="#FFFDF9" stroke="#857A69" stroke-width="1.5"/><g transform="translate(232.07861328125 1366) scale(0.8333)" fill="none" stroke="#2A2520" color="#2A2520" stroke-width="2.16" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H6M11 6.5L5.5 12l5.5 5.5"/></g><text x="262.1" y="1382.0" font-size="17" font-weight="600" fill="#2A2520">Endre svar eller valg</text>
<text x="202" y="1436.8" font-size="16" font-weight="400" fill="#34557A" text-decoration="underline">Endre CV eller annonse</text><rect x="0" y="0" width="1440" height="1516" fill="#2A2520" fill-opacity=".55"/><defs><filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#2A2520" flood-opacity=".28"/></filter></defs><rect x="420" y="300" width="600" height="444" rx="16" fill="#FFFDF9" filter="url(#sh)"/><circle cx="480" cy="358" r="24" fill="#F8E3DD"/><g transform="translate(468 346) scale(1.0000)" fill="none" stroke="#A0392A" color="#A0392A" stroke-width="1.80" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 7h15M9.5 7V4.8h5V7M6.5 7l.9 12.2a1.5 1.5 0 0 0 1.5 1.3h6.2a1.5 1.5 0 0 0 1.5-1.3L17.5 7"/></g><text x="456" y="422.8" font-size="26" font-weight="400" fill="#2A2520"><tspan x="456"><tspan font-weight="600">Endre CV eller annonse?</tspan></tspan></text><text x="456" y="461.1" font-size="17" font-weight="400" fill="#2A2520"><tspan x="456">Hvis du går videre, forkaster vi dette:</tspan></text><circle cx="464" cy="492" r="3.5" fill="#2A2520"/><text x="480" y="497.1" font-size="17" font-weight="400" fill="#2A2520"><tspan x="480">svaret ditt om førerkort</tspan></text><circle cx="464" cy="522" r="3.5" fill="#2A2520"/><text x="480" y="527.1" font-size="17" font-weight="400" fill="#2A2520"><tspan x="480">gap-analysen</tspan></text><circle cx="464" cy="552" r="3.5" fill="#2A2520"/><text x="480" y="557.1" font-size="17" font-weight="400" fill="#2A2520"><tspan x="480">teksten – også det du har redigert selv</tspan></text><text x="456" y="595.3" font-size="16" font-weight="400" fill="#5B5247"><tspan x="456">CV-en og annonsen beholdes, så du kan rette dem og analysere på</tspan><tspan x="456" dy="25">nytt. Kopier teksten først hvis du vil ta vare på den.</tspan></text><rect x="795" y="658" width="189" height="52" rx="10" fill="#A0392A"/><text x="824.2" y="690.0" font-size="17" font-weight="600" fill="#FFFFFF">Forkast og endre</text><rect x="672" y="658" width="111" height="52" rx="10" fill="#FFFDF9" stroke="#857A69" stroke-width="1.5"/><text x="701.8" y="690.0" font-size="17" font-weight="600" fill="#2A2520">Avbryt</text><rect x="667.5" y="653.5" width="120" height="61" rx="14.5" fill="none" stroke="#34557A" stroke-width="3"/>
</svg>
