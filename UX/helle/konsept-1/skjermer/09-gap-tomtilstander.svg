<title id="t">Steg 2 – to tomtilstander for gap-analysen</title>
<desc id="d">Variant A (testpar 4): melding om at alle kompetansekrav er dokumentert, ingen svarfelt, fire dokumenterte krav med sitat. Variant B: stiplet tomtilstand «Vi fant ingen tydelige krav i annonsen» med knapp for å endre CV eller annonse; begge kan lage tekst.</desc>
