<title id="t">Feil fra språkmodellen – to varianter</title>
<desc id="d">Variant A: tidsavbrudd med «Vi fikk ikke svar. Inndataene dine er beholdt. Du kan prøve igjen.» og knappen Prøv igjen med fokus. Variant B: ugyldig analyse fordi et sitat ikke kunne bekreftes; ingen delresultater vises. CV og annonse er beholdt i begge.</desc>
